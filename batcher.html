<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2044">
<meta name="robots" content="noindex, nofollow">
<title>Logistics Coordinator — DFL Dispatch</title>
<!--
  Internal Logistics Coordinator (ILC; was "batcher"): builds loads out of
  open outbound shipments. Never picks the trucker; that's the Trucker Liaison
  (clerk.html). A load goes draft -> ready (sent to the liaison). Drafts can be edited, merged and deleted; a ready load can be
  pulled back. Written loads are read-only here except that shipments
  Acumatica refused can be taken off and re-loaded.

  "Free" shipment = outbound, On Hold/Open, no real ShipVia (empty or an old
  BATCH placeholder), not on any load. Dated up to POOL_DAYS_BACK before the
  load date; older ones are flagged.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .cols { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:16px; align-items:start; }
  .cols h2 { font-size:14px; font-weight:700; color:var(--navy); margin:0 2px 8px; display:flex; align-items:center; gap:8px; }
  .cols h2 .muted { font-weight:400; }
  .has-sv { margin-top:12px; }
  @media (max-width:900px) { .cols { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="page" id="app"><div class="empty">Loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script>
  const B = { date: jmDate(0), free: [], hasSv: [], loads: [], dates: [], sel: new Set(), sync: null, busy: false, wave: loadWaveFilter('batcher') };

  // The All / AM / PM filter: free shipments by suggested wave, loads by their wave.
  function inWave(r) { return B.wave === 'all' || suggestWave(r, B.date) === B.wave; }
  function loadInWave(l) { return B.wave === 'all' || l.wave === B.wave; }
  function visFree() { return B.free.filter(inWave); }
  function visLoads() { return B.loads.filter(loadInWave); }

  // ------------------------------------------------------------------
  // Data
  // ------------------------------------------------------------------
  async function loadAll() {
    const from = addDays(B.date, -POOL_DAYS_BACK);
    const [pool, loads, sync, dates] = await Promise.all([
      sb.from(shipTable()).select(SHIP_COLS)
        .eq('operation', 'Issue').in('status', ['On Hold', 'Open'])
        .gte('shipment_date', from).lte('shipment_date', B.date)
        .or('order_type.is.null,order_type.neq.RC')
        .order('shipment_date').range(0, 1999),
      fetchLoads(B.date),
      lastSync(),
      openDates(),
    ]);
    if (pool.error) throw pool.error;
    const rows = pool.data || [];
    // Which of these are already on a load (any date)?
    const taken = new Set();
    for (let i = 0; i < rows.length; i += 150) {
      const { data, error } = await sb.from('load_shipments').select('shipment_nbr')
        .eq('env', D.env).in('shipment_nbr', rows.slice(i, i + 150).map(r => r.shipment_nbr));
      if (error) throw error;
      (data || []).forEach(x => taken.add(x.shipment_nbr));
    }
    const notTaken = rows.filter(r => !taken.has(r.shipment_nbr));
    B.free = notTaken.filter(r => !r.ship_via || isBatch(r.ship_via));
    B.hasSv = notTaken.filter(r => r.ship_via && !isBatch(r.ship_via) && r.shipment_date === B.date);
    B.loads = loads;
    B.sync = sync;
    // Items for everything on screen, so the "short" tags show without opening.
    await loadLines([...B.free, ...B.hasSv].map(r => r.shipment_nbr).concat(loads.flatMap(l => l.ships.map(s => s.shipment_nbr))));
    B.dates = dates;
    // Keep only selections that still make sense.
    const selectable = new Set([...B.free.map(r => r.shipment_nbr), ...B.loads.flatMap(l => l.ships.filter(s => canPick(l, s)).map(s => s.shipment_nbr))]);
    B.sel = new Set([...B.sel].filter(n => selectable.has(n)));
  }

  // Recent dates with free shipments, for quick jumping (TEST data is months old).
  async function openDates() {
    const { data } = await sb.from(shipTable()).select('shipment_date')
      .eq('operation', 'Issue').in('status', ['On Hold', 'Open']).or('ship_via.is.null,ship_via.ilike.BATCH*')
      .order('shipment_date', { ascending: false }).limit(1000);
    const m = new Map();
    (data || []).forEach(r => m.set(r.shipment_date, (m.get(r.shipment_date) || 0) + 1));
    return [...m.entries()].slice(0, 8);
  }

  function canPick(l, s) {
    return l.status === 'draft' || (['confirmed', 'partial', 'done'].includes(l.status) && ['refused', 'failed'].includes(s.result));
  }
  function freeByNbr(n) { return B.free.find(r => r.shipment_nbr === n); }
  function loadOf(n) { return B.loads.find(l => l.ships.some(s => s.shipment_nbr === n)); }
  function rowOf(n) { const f = freeByNbr(n); if (f) return f; const l = loadOf(n); const s = l && l.ships.find(x => x.shipment_nbr === n); return s && s.row; }

  // ------------------------------------------------------------------
  // Render
  // ------------------------------------------------------------------
  function render() {
    const free = visFree(), loads = visLoads();
    const drafts = loads.filter(l => l.status === 'draft');
    const withClerk = loads.filter(l => l.status === 'ready');
    const written = loads.filter(l => ['confirmed', 'writing', 'done', 'partial'].includes(l.status));
    const fs_ = loadStats(free);

    const chips = B.dates.length
      ? `<span class="chips">Unloaded on: ${B.dates.map(([d, n]) => `<button class="chip ${d === B.date ? 'on' : ''}" data-date="${d}">${esc(niceDate(d))} · ${n}</button>`).join('')}</span>` : '';

    document.getElementById('main').innerHTML = `
      <div class="controls">
        <div class="seg" id="daySeg">
          <button data-day="0" class="${B.date === jmDate(0) ? 'on' : ''}">Today</button>
          <button data-day="1" class="${B.date === jmDate(1) ? 'on' : ''}">Tomorrow</button>
        </div>
        <input type="date" id="datePick" value="${B.date}" aria-label="Load date">
        ${syncText(B.sync)}
        ${D.env === 'test' ? '<button class="btn small" data-act="sync_test">Pull fresh TEST data</button>' : ''}
        <span class="spacer"></span>
        ${waveFilterHtml(B.wave)}
        <button class="btn primary" data-act="suggest" ${free.length ? '' : 'disabled'}>Suggest loads${B.sel.size && [...B.sel].every(freeByNbr) ? ' for selected' : B.wave !== 'all' ? ' (' + B.wave + ')' : ''}</button>
      </div>
      ${chips ? `<div class="controls">${chips}</div>` : ''}
      <div class="kpis">
        <div class="kpi ${free.length ? 'warn' : ''}"><div class="l">Not on a load</div><div class="v">${fmt(free.length)}</div><div class="s">${free.length ? fmt(fs_.vol) + ' vol · ' + money(fs_.value) : 'all loaded'}</div></div>
        <div class="kpi"><div class="l">Draft loads</div><div class="v">${drafts.length}</div><div class="s">${fmt(drafts.reduce((s, l) => s + l.vol, 0))} vol · ${money(drafts.reduce((s, l) => s + l.value, 0))}</div></div>
        <div class="kpi"><div class="l">With the liaison</div><div class="v">${withClerk.length}</div><div class="s">waiting for a trucker</div></div>
        <div class="kpi"><div class="l">Trucker confirmed</div><div class="v">${written.length}</div><div class="s">${written.filter(l => l.status === 'done').length} written to Acumatica</div></div>
      </div>
      <div class="cols">
        <div>
          <h2>Not on a load <span class="muted">${esc(niceDate(B.date))}${free.some(r => r.shipment_date < B.date) ? ' and earlier' : ''}${B.wave !== 'all' ? ' · ' + B.wave + ' only' : ''}</span></h2>
          <div class="card">${renderPool(free)}</div>
          ${B.hasSv.length ? `<details class="has-sv" ${keep('has-sv')}><summary>${plural(B.hasSv.length, 'shipment')} on this date already have a Ship Via in Acumatica (not loadable here)</summary>
            <div class="card" style="margin-top:6px">${shipTable_(B.hasSv, { cb: false, sv: true })}</div></details>` : ''}
        </div>
        <div>
          <h2>Loads <span class="muted">${esc(niceDate(B.date))}</span></h2>
          ${loads.length ? loads.map(loadCard).join('') : `<div class="card"><div class="empty">No ${B.wave !== 'all' ? B.wave + ' ' : ''}loads yet. Use <b>Suggest loads</b>, or tick shipments and add them to a new load.</div></div>`}
        </div>
      </div>
      ${selBar()}`;
  }

  function shipTable_(rows, { cb = true, sv = false, zone = false, results = null, pickable = () => true } = {}) {
    const sorted = rows.slice().sort((a, b) => (a.customer_name || '').localeCompare(b.customer_name || '') || vol(b) - vol(a));
    const cols = (cb ? 1 : 0) + 5 + (zone ? 1 : 0) + (sv ? 1 : 0) + (results ? 1 : 0);
    return `<table class="ships"><thead><tr>${cb ? '<th class="cb"></th>' : ''}<th>Shipment</th><th>Customer</th>${zone ? '<th class="hide-m">Zone</th>' : ''}<th class="r">Qty</th><th class="r">Vol</th><th class="r">Value</th>${sv ? '<th>Ship via</th>' : ''}${results ? '<th>Acumatica</th>' : ''}</tr></thead>
      <tbody>${sorted.map(r => {
        const n = r.shipment_nbr, sel = B.sel.has(n), res = results && results.get(n);
        const tags = [];
        if (r.shipment_date && r.shipment_date < B.date) tags.push(`<span class="tag old" title="Shipment date">${esc(niceDate(r.shipment_date))}</span>`);
        if (r.missing) tags.push('<span class="tag old">not found</span>');
        const w = !r.missing && suggestWave(r, B.date);
        return `<tr class="${sel ? 'sel' : ''}">
          ${cb ? `<td class="cb">${pickable(n) ? `<input type="checkbox" data-pick="${esc(n)}" ${sel ? 'checked' : ''} aria-label="Select ${esc(n)}">` : ''}</td>` : ''}
          <td class="num">${shipToggle(n)} ${w ? waveTag(w, 'Suggested run') : ''}</td>
          <td class="cust" title="${esc(r.customer_name || '')}">${esc(r.customer_name || r.customer_id || '—')} ${tags.join(' ')}</td>
          ${zone ? `<td class="hide-m">${esc(r.shipping_zone || '—')}</td>` : ''}
          <td class="r num">${fmt(qty(r))}</td>
          <td class="r num">${fmt(vol(r))}</td>
          <td class="r num">${r.shipment_value == null ? '<span class="muted">—</span>' : money(val(r))}</td>
          ${sv ? `<td>${esc(r.ship_via || '')}</td>` : ''}
          ${results ? `<td>${res ? resultPill(res) + (res.result_detail ? `<div class="muted">${esc(res.result_detail)}</div>` : '') : ''}</td>` : ''}
        </tr>${linesRow(n, cols)}`;
      }).join('')}</tbody></table>`;
  }

  function renderPool(free) {
    if (!free.length) return `<div class="empty">Nothing${B.wave !== 'all' ? ' on the ' + B.wave + ' run' : ''} waiting for a load on ${esc(niceDate(B.date))}.</div>`;
    const zones = new Map();
    free.forEach(r => { const z = r.shipping_zone || 'No zone'; if (!zones.has(z)) zones.set(z, []); zones.get(z).push(r); });
    return [...zones.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([z, rows]) => {
      const s = loadStats(rows);
      const all = rows.every(r => B.sel.has(r.shipment_nbr));
      return `<div class="zone">
        <div class="zhead"><input type="checkbox" data-zone="${esc(z)}" ${all ? 'checked' : ''} aria-label="Select all in ${esc(z)}">
          <span class="zn">${esc(z)}</span>
          <span class="muted">${plural(s.count, 'ship')} · ${plural(s.drops, 'drop')} · ${fmt(s.vol)} vol · ${money(s.value)}</span>
          <span class="muted" style="flex:0 0 auto">fits ${esc(fitLabel(bestFit(s.vol, s.drops)))}</span></div>
        ${shipTable_(rows)}</div>`;
    }).join('');
  }

  function loadCard(l) {
    const draft = l.status === 'draft';
    const rows = l.ships.map(s => s.row || { shipment_nbr: s.shipment_nbr, missing: true });
    const written = ['confirmed', 'writing', 'done', 'partial'].includes(l.status);
    const results = written ? new Map(l.ships.map(s => [s.shipment_nbr, s])) : null;
    const others = B.loads.filter(x => x.status === 'draft' && x.id !== l.id);
    const fit = bestFit(l.vol, l.drops);
    return `<div class="lcard st-${l.status}" data-load="${l.id}">
      <div class="lhead"><div><span class="lnbr">${esc(l.load_nbr)}</span> <span class="muted">${esc(l.zones.join(', '))}</span></div>${statusPill(l.status)}</div>
      ${l.returned_note && draft ? `<div class="warnbox bad">Sent back by the liaison: ${esc(l.returned_note)}</div>` : ''}
      ${draft ? `<div class="lctl">
          <label class="field">Wave <select data-f="wave">${['AM', 'PM'].map(w => `<option ${w === l.wave ? 'selected' : ''}>${w}</option>`).join('')}</select></label>
          <label class="field">Truck <select data-f="truck_type"><option value="">Pick…</option>${D.truckTypes.map(t => `<option ${t.name === l.truck_type ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></label>
          <input class="txt" data-f="notes" value="${esc(l.notes || '')}" placeholder="Note for the liaison" style="flex:1;min-width:140px">
        </div>` : `<div class="lstats">${esc(l.truck_type || 'no truck')}${l.ship_via ? ` · <span class="target">${esc(l.ship_via)}</span> ${esc(l.contractor || '')}` : ''}${l.notes ? ` · ${esc(l.notes)}` : ''}</div>`}
      <div class="lstats">${waveTag(l.wave)}<span>${plural(l.count, 'shipment')}</span><span>${l.drops} / ${MAX_DROPS} drops</span>${capBar(l)}<span>${fmt(l.qty)} qty</span><span><b>${money(l.value)}</b></span>
        ${draft && fit && fitLabel(fit) !== l.truck_type ? `<span>best fit: ${esc(fitLabel(fit))}</span>` : ''}</div>
      ${loadWarnings(l)}
      ${rows.length ? shipTable_(rows, { zone: l.zones.length > 1, results, cb: draft || written, pickable: n => canPick(l, l.ships.find(s => s.shipment_nbr === n)) }) : '<div class="muted">No shipments on this load. Tick some and add them here.</div>'}
      <div class="lactions">
        ${draft ? `<button class="btn primary small" data-act="send">Send to liaison</button>
          ${others.length ? `<select data-merge aria-label="Merge into"><option value="">Merge into…</option>${others.map(o => `<option value="${o.id}">${esc(o.load_nbr)} (${fmt(o.vol)} vol)</option>`).join('')}</select>` : ''}
          <button class="btn small danger" data-act="delete">Delete</button>` : ''}
        ${l.status === 'ready' ? '<button class="btn small" data-act="pull_back">Pull back to edit</button>' : ''}
        ${l.status === 'partial' ? '<span class="muted">Tick refused or failed shipments to move them to another load, or take them off.</span>' : ''}
      </div>
      <div class="inline-err" data-err></div>
      ${eventList(l.events, 'hist-' + l.id)}
    </div>`;
  }

  function selBar() {
    if (!B.sel.size) return '';
    const rows = [...B.sel].map(rowOf).filter(Boolean);
    const s = loadStats(rows);
    const onLoads = [...B.sel].some(n => !freeByNbr(n));
    const drafts = visLoads().filter(l => l.status === 'draft');
    return `<div class="selbar">
      <b>${plural(B.sel.size, 'shipment')}</b><span>${plural(s.drops, 'drop')} · ${fmt(s.vol)} vol · ${money(s.value)}</span>
      <select id="moveTo" aria-label="Move to">
        ${(B.wave === 'PM' ? ['PM', 'AM'] : ['AM', 'PM']).map(w => `<option value="new:${w}">New ${w} load</option>`).join('')}
        ${drafts.map(l => `<option value="${l.id}">${esc(l.load_nbr)} (${fmt(l.vol)} vol, ${l.drops} drops)</option>`).join('')}
      </select>
      <button class="btn small" data-act="move">Add to load</button>
      ${onLoads ? '<button class="btn small" data-act="unload">Take off load</button>' : ''}
      <span class="spacer"></span>
      <button class="btn small" data-act="clear">Clear</button>
    </div>`;
  }

  // ------------------------------------------------------------------
  // Actions
  // ------------------------------------------------------------------
  async function rpc(name, args) {
    const { data, error } = await sb.rpc(name, args);
    if (error) throw error;
    return data;
  }

  async function act(fn) {
    if (B.busy) return;
    B.busy = true;
    document.body.style.cursor = 'progress';
    try { await fn(); await refresh(); }
    catch (e) { console.error('[batcher]', e); toast(errMsg(e), true); await refresh(); }
    finally { B.busy = false; document.body.style.cursor = ''; }
  }

  async function newLoad(wave, nbrs) {
    const vols = nbrs.reduce((s, n) => s + vol(rowOf(n)), 0);
    const t = nbrs.length ? smallestTruckFor(vols) : null;
    return rpc('dispatch_create_load', { p_env: D.env, p_date: B.date, p_wave: wave, p_truck_type: t ? t.name : null, p_shipments: nbrs });
  }

  async function suggest() {
    const onlySel = B.sel.size && [...B.sel].every(freeByNbr);
    const rows = onlySel ? B.free.filter(r => B.sel.has(r.shipment_nbr)) : visFree();
    const plan = suggestLoads(rows, B.date);
    const am = plan.filter(p => p.wave === 'AM').length;
    if (!confirm(`Create ${plural(plan.length, 'draft load')} from ${plural(rows.length, 'shipment')}?\n\n${am} AM · ${plan.length - am} PM, split by zone. You can change anything afterwards.`)) return;
    await act(async () => {
      for (const p of plan) {
        await rpc('dispatch_create_load', { p_env: D.env, p_date: B.date, p_wave: p.wave, p_truck_type: p.truck_type, p_shipments: p.nbrs });
      }
      B.sel.clear();
      toast(`${plural(plan.length, 'draft load')} created`);
    });
  }

  document.getElementById('app').addEventListener('click', e => {
    const chip = e.target.closest('[data-date]');
    if (chip) { setDate(chip.dataset.date); return; }
    const day = e.target.closest('#daySeg button');
    if (day) { setDate(jmDate(Number(day.dataset.day))); return; }
    const wb = e.target.closest('.wavef button[data-wave]');
    if (wb) { B.wave = wb.dataset.wave; saveWaveFilter('batcher', B.wave); B.sel.clear(); render(); return; }
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const card = btn.closest('[data-load]');
    const id = card && Number(card.dataset.load);
    const a = btn.dataset.act;
    if (a === 'clear') { B.sel.clear(); render(); return; }
    if (a === 'suggest') { suggest(); return; }
    if (a === 'sync_test') {
      btn.disabled = true; btn.textContent = 'Pulling from TEST…';
      act(async () => { const r = await callAcu('sync_test'); if (!r.ok) throw new Error(r.error); toast(`${fmt(r.upserted)} TEST shipments pulled`); });
      return;
    }
    if (a === 'move') {
      const to = document.getElementById('moveTo').value;
      const nbrs = [...B.sel];
      act(async () => {
        if (to.startsWith('new:')) {
          const free = nbrs.filter(freeByNbr), loaded = nbrs.filter(n => !freeByNbr(n));
          const newId = await newLoad(to.slice(4), free);
          if (loaded.length) await rpc('dispatch_move_shipments', { p_env: D.env, p_shipments: loaded, p_to: newId });
        } else {
          await rpc('dispatch_move_shipments', { p_env: D.env, p_shipments: nbrs, p_to: Number(to) });
        }
        B.sel.clear();
      });
      return;
    }
    if (a === 'unload') {
      const nbrs = [...B.sel].filter(n => !freeByNbr(n));
      act(async () => { await rpc('dispatch_move_shipments', { p_env: D.env, p_shipments: nbrs, p_to: null }); B.sel.clear(); });
      return;
    }
    if (a === 'send') { act(() => rpc('dispatch_load_action', { p_id: id, p_action: 'send' })); return; }
    if (a === 'pull_back') { act(() => rpc('dispatch_load_action', { p_id: id, p_action: 'pull_back' })); return; }
    if (a === 'delete') {
      const l = B.loads.find(x => x.id === id);
      if (l.count && !confirm(`Delete ${l.load_nbr}? Its ${plural(l.count, 'shipment')} go back to "Not on a load".`)) return;
      act(() => rpc('dispatch_delete_load', { p_id: id }));
    }
  });

  document.getElementById('app').addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'datePick') { if (t.value) setDate(t.value); return; }
    if (t.dataset.pick) { t.checked ? B.sel.add(t.dataset.pick) : B.sel.delete(t.dataset.pick); render(); return; }
    if (t.dataset.zone != null) {
      visFree().filter(r => (r.shipping_zone || 'No zone') === t.dataset.zone)
        .forEach(r => t.checked ? B.sel.add(r.shipment_nbr) : B.sel.delete(r.shipment_nbr));
      render(); return;
    }
    const card = t.closest('[data-load]');
    if (!card) return;
    const id = Number(card.dataset.load);
    if (t.dataset.merge !== undefined && t.value) {
      const l = B.loads.find(x => x.id === id), into = B.loads.find(x => x.id === Number(t.value));
      if (!confirm(`Move all of ${l.load_nbr} into ${into.load_nbr} and delete ${l.load_nbr}?`)) { t.value = ''; return; }
      act(async () => {
        if (l.ships.length) await rpc('dispatch_move_shipments', { p_env: D.env, p_shipments: l.ships.map(s => s.shipment_nbr), p_to: into.id });
        await rpc('dispatch_delete_load', { p_id: id });
      });
      return;
    }
    if (t.dataset.f) {
      const v = f => card.querySelector(`[data-f="${f}"]`).value.trim() || null;
      act(() => rpc('dispatch_update_load', { p_id: id, p_wave: v('wave'), p_truck_type: v('truck_type'), p_notes: v('notes') }));
    }
  });

  function setDate(iso) { B.date = iso; B.sel.clear(); refresh(); }

  async function refresh() {
    try { await loadAll(); render(); }
    catch (e) {
      console.error('[batcher]', e);
      document.getElementById('main').innerHTML = `<div class="err">Couldn't load. ${esc(errMsg(e))}</div>`;
    }
  }

  function editing() {
    const a = document.activeElement;
    return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox';
  }

  onShipToggle(render);

  startPage({
    page: 'batcher', role: 'batcher', title: 'Logistics Coordinator',
    onEnvChange: () => { B.sel.clear(); refresh(); },
    onReady: () => {
      refresh();
      setInterval(() => { if (!B.busy && !editing() && !B.sel.size) refresh(); }, 60 * 1000);
    },
  });
</script>
</body>
</html>
