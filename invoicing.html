<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2044">
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex, nofollow">
<title>Invoicing — Logistics Management System</title>
<!--
  Supervisor invoicing: lists shipments that are Confirmed in Acumatica (so
  checked and ready) grouped by load, lets the supervisor tick any of them, and
  runs Prepare Invoice on the ticked ones in bulk (dispatch-acu invoice_request).
  The writes go through the same background queue as the other Acumatica jobs,
  so the page returns at once and polls for progress. Releasing the invoice
  stays with Accounts.

  Live also needs DISPATCH_LIVE_INVOICE = 'on' in dispatch-acu.

  Printing: prepared invoices (last 3 days) are listed under "Prepared invoices to print", single or
  by load. The invoice is Acumatica's own data (GI DFLInvoicePrint, docs/invoice-print-gi.md) laid out on
  US Letter by invoice-print.js. Needs migrations 20261027140000_invoice_prints.sql and
  20261030100000_invoice_print_data.sql and the sync-invoice-print function. Reprints are decided and
  logged server-side (invoice_print_record).
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  #printWrap { display:none; }
  .grp { background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:12px; overflow:hidden; }
  .grp .gh { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; background:#f8fafc; border-bottom:1px solid var(--border); }
  .grp .gh label { display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:600; color:var(--navy); }
  table.inv { width:100%; border-collapse:collapse; font-size:13px; }
  table.inv th { text-align:left; font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.3px; padding:6px 10px; border-bottom:1px solid var(--border); }
  table.inv td { padding:7px 10px; border-top:1px solid #f1f5f9; vertical-align:middle; }
  table.inv td.r, table.inv th.r { text-align:right; }
  table.inv td.cb, table.inv th.cb { width:34px; padding-right:0; }
  table.inv tr.sel td { background:var(--accent-bg); }
  table.inv tr.busy td { color:var(--text-muted); }
  input[type=checkbox] { width:16px; height:16px; cursor:pointer; }
  .sumbar { position:sticky; bottom:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--navy); color:#fff; border-radius:12px; padding:12px 14px; margin-top:12px; box-shadow:0 6px 20px rgba(15,32,68,.25); font-size:13px; }
  .sumbar .btn { border-color:#fff; }
  .sumbar .hid { color:#fcd34d; }
  .filt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:14px; }
  .filt .frow { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
  .filt .fsearch { margin-bottom:8px; }
  .filt label { display:block; font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.3px; margin-bottom:3px; }
  .filt input, .filt select { width:100%; box-sizing:border-box; }
  .filt .fmeta { display:flex; align-items:center; gap:10px; margin-top:8px; min-height:26px; }
  .grp .gh .gsel { color:var(--accent); font-size:12px; font-weight:600; }
  .grp .gh .gval { margin-left:auto; font-weight:600; color:var(--navy); }
  table.inv tr.bad td { background:var(--bad-bg); }
  table.pc tr.ihead td { background:#f8fafc; border-top:1px solid var(--border); }
  table.pc tr.ihead.mis td { background:var(--warn-bg); }
  table.pc tr.cust td:first-child { padding-left:26px; }
  table.pc tr.low td { background:var(--warn-bg); }
  table.pc tr.zero td { background:var(--bad-bg); }
  table.pc .mis-note { font-size:12px; color:var(--warn-text); font-weight:600; }
  table.pc input[type=number] { width:80px; text-align:right; font:inherit; font-size:14px; padding:5px 8px; border:1px solid var(--border2); border-radius:6px; }
  @media (max-width:900px) { .filt .frow { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:640px) {
    table.inv .hide-m { display:none; }
    table.inv td, table.inv th { padding:8px 6px; }
    .filt input, .filt select { font-size:16px; }
    .grp .gh .gval { margin-left:0; }
    .sumbar { bottom:0; border-radius:12px 12px 0 0; }
    .sumbar .btn { padding:9px 14px; }
  }
</style>
</head>
<body>
<div class="page" id="app"><div class="skel-wrap"><div class="skel-card"><div class="skel w40"></div><div class="skel w70"></div><div class="skel w55"></div></div></div></div>

<div id="printWrap" aria-hidden="true"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3" integrity="sha384-dl/4LkSyQ4uEucc48NM6VDZLAjLLq9yMzZ5JLXumBq7Ld33XBof73hseOqPhO89+" crossorigin="anonymous"></script>
<script src="common.js"></script>
<script src="invoice-print.js"></script>
<script>
  const V = { ships: [], loadOf: new Map(), inv: new Map(), sel: new Set(), date: '', busy: false, poll: null, was: false,
              pr: [], manual: [], marks: new Set(), showPrinted: false, prints: new Map(), hdr: new Map(), psel: new Set(), pbusy: false,
              pend: [], picks: new Map(), items: new Map(), checks: [], final: new Map(), notes: new Map(), openL: new Set(), wasConf: new Map(), odate: new Map(),
              subs: [], subRes: new Map(), subUi: new Map(), subRows: new Map() };

  // ------------------------------------------------------------------
  // Substitutions the checker flagged (check_items.sub_needed). The clerk sorts each one in Acumatica by hand
  // (new SO for the substitute, release it, add it to the shipment, zero the unfound line), then marks it complete here.
  // Printing an invoice on a load with an open one warns; the clerk can print anyway (logged).
  // Needs migration 20261105210000_check_substitution.sql; without it the list is just empty.
  // ------------------------------------------------------------------
  async function loadSubs() {
    try {
      const r = await sb.from('check_items')
        .select('load_id, inventory_id, checked_qty, sub_note, sub_by_name, sub_at, sub_context, loads!inner(id, load_nbr, env, ship_via, truck_type, wave, checker_done_at)')
        .eq('sub_needed', true).is('sub_resolved_at', null).eq('loads.env', D.env).not('loads.checker_done_at', 'is', null).order('sub_at');
      if (r.error) throw r.error;
      const rows = r.data || [], ids = [...new Set(rows.map(x => x.load_id))];
      const picks = new Map();
      if (ids.length) {
        const b = await sb.rpc('dispatch_pick_bundle', { p_load_ids: ids, p_with_checks: false });
        if (b.error) throw b.error;
        (b.data.picks || []).forEach(p => picks.set(p.load_id + '|' + p.inventory_id, p));
      }
      // The pick list drops a line once confirm has lowered it to 0 (and Acumatica removes it), so the description, quantity and
      // customers come from the snapshot taken when the checker raised the flag (check_items.sub_context) when the pick list has nothing.
      V.subs = rows.map(x => { const p = picks.get(x.load_id + '|' + x.inventory_id) || {}, c = x.sub_context || {};
        return { ...x, load: x.loads, desc: p.description || c.description || x.inventory_id, uom: p.uom || c.uom || '',
          required: p.required != null ? Number(p.required) : (c.required != null ? Number(c.required) : null), ctxLines: Array.isArray(c.lines) ? c.lines : [] }; });
      // What the API substitution has done so far for each customer line (needs migration 20261112120000_substitutions.sql).
      V.subRows = new Map();
      if (ids.length) {
        const sr = await sb.from('substitutions').select('*').in('load_id', ids);
        if (!sr.error) (sr.data || []).forEach(r => V.subRows.set(r.load_id + '|' + r.source_inventory_id + '|' + r.orig_shipment_nbr, r));
      }
    } catch (e) { console.warn('[invoicing subs]', e); V.subs = []; }
  }

  // ------------------------------------------------------------------
  // Substitute from here (dispatch-sub): search for the replacement item, say how many each customer gets. Per customer the
  // function makes a separate SO, releases it from credit hold, creates and confirms the shipment, sets the load's
  // Ship Via, and puts the shipment on the same load (so it is on the load sheet and the check-off sheet).
  // ------------------------------------------------------------------
  async function callSub(action, body) {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error('Signed out; reload and sign in again');
    const res = await fetch(`${SUPABASE_URL}/functions/v1/dispatch-sub`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ action, env: D.env, ...(body || {}) }),
    });
    let json = null;
    try { json = await res.json(); } catch (e) {}
    if (!res.ok && !(json && 'ok' in json)) throw new Error(`dispatch-sub ${res.status}`);
    return json;
  }
  const subKey = s => s.load_id + '|' + s.inventory_id;
  const subRowOf = (s, z) => V.subRows.get(s.load_id + '|' + s.inventory_id + '|' + z.shipment);
  const SUB_STEP = { none: 'Waiting', so: 'SO made', released: 'Released from credit hold', shipment: 'Shipment made', shipvia: 'Ship Via set', confirmed: 'Shipment confirmed', joined: 'On the load' };

  function subResultsHtml(u) {
    if (u.searching) return '<div class="muted">Searching…</div>';
    if (u.err) return `<div style="color:var(--bad-text,#b42318)">${esc(u.err)}</div>`;
    if (!u.results.length) return u.q && u.q.trim().length >= 2 ? '<div class="muted">No active items match.</div>' : '';
    return u.results.map(i => `<div><button class="btn small" data-subpick="${esc(i.inventory_id)}">Use</button>
      <b>${esc(i.description || i.inventory_id)}</b> <span class="muted num">${esc(i.inventory_id)}</span> · ${esc(i.uom || '')}</div>`).join('');
  }
  function paintSubResults(key) {
    const u = V.subUi.get(key), el = [...document.querySelectorAll('[data-subresults]')].find(x => x.dataset.subresults === key);
    if (u && el) el.innerHTML = subResultsHtml(u);
  }

  function subPanel(s) {
    const key = subKey(s), u = V.subUi.get(key);
    if (!u) return '';
    const here = s.ctxLines.map(z => subRowOf(s, z)).filter(Boolean);
    const locked = here.some(r => r.step !== 'none');          // the SO exists, so the item is fixed
    const body = s.ctxLines.map(z => {
      const r = subRowOf(s, z), done = r && r.state === 'done', fixed = r && r.step !== 'none';
      const def = u.qty.has(z.shipment) ? u.qty.get(z.shipment) : (r ? Number(r.qty) : (s.ctxLines.length === 1 && s.required != null ? Math.max(0, Math.min(Number(z.qty), s.required - Number(s.checked_qty))) : ''));
      const st = !r ? '' : done
        ? `<span style="color:var(--ok-text,#067647)">Done</span> · SO ${esc(r.new_order_nbr || '')} · shipment ${esc(r.new_shipment_nbr || '')}${r.note ? `<div style="font-size:12px;color:var(--warn-text)"><b>Check:</b> ${esc(r.note)}</div>` : ''}`
        : r.state === 'failed'
          ? `<b style="color:var(--bad-text,#b42318)">Stopped after: ${esc(SUB_STEP[r.step] || r.step)}</b><div style="font-size:12px">${esc(r.error || '')}</div>`
          : `${esc(SUB_STEP[r.step] || r.step)}…`;
      return `<tr><td>${esc(z.customer || z.customer_id || '')}<div class="muted" style="font-size:12px">${esc(z.order_type || 'SO')} ${esc(z.order_nbr || '')} · shipment ${esc(z.shipment || '')} · needed ${fmt(z.qty)}</div></td>
        <td class="r"><input type="number" min="0" max="${esc(z.qty)}" step="1" style="width:84px" data-subqty="${esc(key + '|' + z.shipment)}" value="${esc(def)}" ${fixed || V.busy ? 'disabled' : ''}></td>
        <td>${st}</td></tr>`;
    }).join('');
    const canRun = u.pick && !V.busy;
    return `<tr class="subpanel"><td colspan="5" style="background:var(--bg-soft,#f6f8fb)">
      <div style="margin:6px 0 4px"><b>Substitute from here</b> <span class="muted">One SO and shipment per customer. Default price. It joins this load.</span></div>
      ${locked && u.pick ? '' : `<div style="margin:6px 0"><input type="search" maxlength="40" placeholder="Search the substitute by name or item number" data-subq="${esc(key)}" value="${esc(u.q)}" style="width:100%;max-width:420px">
        <div data-subresults="${esc(key)}" style="margin-top:4px;display:grid;gap:4px">${subResultsHtml(u)}</div></div>`}
      ${u.pick ? `<div style="margin:6px 0">Substitute: <b>${esc(u.pick.description || u.pick.inventory_id)}</b> <span class="muted num">${esc(u.pick.inventory_id)}</span></div>` : ''}
      <table class="inv"><thead><tr><th>Customer</th><th class="r">Qty</th><th>Progress</th></tr></thead><tbody>${body}</tbody></table>
      <div style="margin:8px 0 4px;display:flex;gap:8px;align-items:center">
        <button class="btn small primary" data-subrun="${esc(key)}" ${canRun ? '' : 'disabled'}>${here.some(r => r.state === 'failed') ? 'Run again' : 'Create substitutions'}</button>
        <button class="btn small" data-subclose="${esc(key)}">Close</button>
        ${u.msg ? `<span class="muted">${esc(u.msg)}</span>` : ''}
      </div></td></tr>`;
  }

  function renderSubs() {
    const el = document.getElementById('invSubs');
    if (!el) return;
    if (!V.subs.length) { el.innerHTML = ''; return; }
    // Once every customer line the API substituted is done, fill "What was done" so Mark complete is one click.
    V.subs.forEach(s => {
      const rs = s.ctxLines.map(z => subRowOf(s, z)).filter(Boolean), k = subKey(s);
      if (rs.length && rs.every(r => r.state === 'done') && !V.subRes.get(k))
        V.subRes.set(k, ('Substituted ' + rs[0].sub_inventory_id + ': ' + rs.map(r => (r.customer_name || r.customer_id) + ' SO ' + r.new_order_nbr).join('; ')).slice(0, 200));
    });
    const byLoad = new Map();
    V.subs.forEach(s => { const k = s.load.load_nbr; if (!byLoad.has(k)) byLoad.set(k, { load: s.load, rows: [] }); byLoad.get(k).rows.push(s); });
    el.innerHTML = `<div class="section-h" style="font-size:14px;font-weight:700;color:var(--navy);margin:0 2px 8px">Substitutions to complete (${V.subs.length})</div>
      <div class="muted" style="margin:-4px 2px 8px">The checker couldn't find these. Use Substitute to pick the replacement item and set each customer's quantity; it makes the order and shipment in Acumatica and puts the shipment on the load. Then mark it complete. Printing an invoice on the load warns until it is.</div>
      ${[...byLoad.entries()].map(([k, g]) => `<div class="grp"><div class="gh"><span class="lnbr">${esc(k)}</span>${waveTag(g.load.wave)} <b>${esc(g.load.truck_type || '')}</b> <span class="target">${esc(g.load.ship_via || '')}</span>
          <span class="muted">${plural(g.rows.length, 'item')}</span></div>
        <table class="inv"><thead><tr><th>Item</th><th class="r">Short</th><th>Checker's note</th><th>What was done</th><th></th></tr></thead><tbody>
        ${g.rows.map(s => { const key = s.load_id + '|' + s.inventory_id, short = s.required != null ? s.required - Number(s.checked_qty) : null;
          const who = s.ctxLines.map(z => `${esc(z.customer || z.customer_id || '')} · ${esc(z.order_type || 'SO')} ${esc(z.order_nbr || '')}${z.order_line != null ? ' line ' + esc(z.order_line) : ''} · shipment ${esc(z.shipment || '')} · ${fmt(z.qty)}${s.uom ? ' ' + esc(s.uom) : ''}`).join('<br>');
          return `<tr><td><b>${esc(s.desc)}</b> <span class="muted num">${esc(s.inventory_id)}</span>${who ? `<div style="font-size:12px">${who}</div>` : ''}<div class="muted" style="font-size:12px">${esc(s.sub_by_name || '')} ${esc(stamp(s.sub_at))}</div></td>
            <td class="r num">${short != null ? `<b style="color:var(--warn-text)">${fmt(short)}</b>` : '—'}<div class="muted" style="font-size:11px">found ${fmt(s.checked_qty)}</div></td>
            <td>${s.sub_note ? esc(s.sub_note) : '<span class="muted">—</span>'}</td>
            <td><input type="text" maxlength="200" data-subres="${esc(key)}" value="${esc(V.subRes.get(key) || '')}" placeholder="e.g. SO 209696, or customer declined" style="width:100%;min-width:180px"></td>
            <td class="r"><button class="btn small" data-subopen="${esc(key)}">Substitute…</button> <button class="btn small primary" data-subdone="${esc(key)}">Mark complete</button></td></tr>${subPanel(s)}`; }).join('')}</tbody></table></div>`).join('')}`;
  }

  // ------------------------------------------------------------------
  // Loads the checker has finished, waiting to be confirmed in Acumatica.
  // The checker counts per SKU; where a SKU came up short, the clerk says which
  // customers go short, then confirms. Lowered lines and Control Qty are written
  // by dispatch-acu check_confirm.
  // ------------------------------------------------------------------
  async function loadPending() {
    const r = await sb.from('loads').select('*').eq('env', D.env).not('checker_done_at', 'is', null)
      .or('check_status.is.null,check_status.neq.confirmed').order('load_date').order('seq').order('wave');
    if (r.error) throw r.error;
    const loads = r.data || [], ids = loads.map(l => l.id);
    let ls = [], bundle = { picks: [], items: [], checks: [] };
    if (ids.length) {
      const [a, b] = await Promise.all([
        sb.from('load_shipments').select('*').in('load_id', ids),
        sb.rpc('dispatch_pick_bundle', { p_load_ids: ids, p_with_checks: true }),
      ]);
      if (a.error) throw a.error;
      if (b.error) throw b.error;
      ls = a.data || []; bundle = b.data;
    }
    const nbrs = ls.map(x => x.shipment_nbr);
    const rows = nbrs.length ? await shipmentsByNbr(nbrs) : [];
    const byNbr = new Map(rows.map(x => [x.shipment_nbr, x]));
    // Item lines: fetch what isn't held yet, and again for a part-confirmed load (its lines moved).
    const redo = new Set(loads.filter(l => l.check_status === 'partial').flatMap(l => ls.filter(x => x.load_id === l.id).map(x => x.shipment_nbr)));
    const need = nbrs.filter(n => !D.lines.has(n) || redo.has(n));
    if (need.length) await loadLines(need);
    // Order dates drive the default split of a short SKU (oldest order first). Optional: no date sorts last.
    V.odate = new Map();
    const onbrs = [...new Set(rows.flatMap(x => String(x.order_nbr || '').split(',').map(o => o.trim()).filter(Boolean)))];
    if (onbrs.length) {
      const od = await sb.rpc('dispatch_order_dates', { p_orders: onbrs });
      if (!od.error) (od.data || []).forEach(o => V.odate.set(o.order_nbr, o.order_date));
    }
    V.pend = loads.map(l => ({ ...l, ships: ls.filter(x => x.load_id === l.id).map(x => ({ ...x, row: byNbr.get(x.shipment_nbr) || null })) }));
    V.picks = new Map(ids.map(id => [id, (bundle.picks || []).filter(x => x.load_id === id)]));
    V.items = new Map(ids.map(id => [id, new Map((bundle.items || []).filter(x => x.load_id === id).map(x => [x.inventory_id, x]))]));
    V.checks = bundle.checks || [];
    [...V.final.keys()].forEach(id => { if (!ids.includes(id)) { V.final.delete(id); V.notes.delete(id); } });
    V.pend.forEach(l => {
      const busy = confirmQueued(l) || l.check_status === 'confirming';
      if (V.wasConf.get(l.id) && !busy) toast(l.check_status === 'partial' ? `${l.load_nbr}: some shipments didn't confirm. Open it to see why.` : `${l.load_nbr} confirmed in Acumatica`, l.check_status === 'partial');
      if (busy) V.wasConf.set(l.id, true); else V.wasConf.delete(l.id);
    });
  }

  const pkey = (nbr, ln) => nbr + '|' + ln;
  // Oldest sales order first, then shipment number: the order a short SKU is filled in.
  const shipOdate = s => String(String((s.row && s.row.order_nbr) || '').split(',').map(o => V.odate.get(o.trim())).filter(Boolean).sort()[0] || '');
  function pLinesOf(l) {
    return l.ships.slice().sort((a, b) => (shipOdate(a) || '9999').localeCompare(shipOdate(b) || '9999') || a.shipment_nbr.localeCompare(b.shipment_nbr)).flatMap(s =>
      (D.lines.get(s.shipment_nbr) || []).filter(x => Number(x.shipped_qty) > 0).map(x => ({
        nbr: s.shipment_nbr, customer: (s.row && (s.row.customer_name || s.row.customer_id)) || '', line_nbr: x.line_nbr,
        item: x.inventory_id, desc: x.description, uom: x.uom, shipped: Number(x.shipped_qty), odate: shipOdate(s),
      })));
  }
  // What goes out per shipment line: a saved split wins; else the checker's count per SKU
  // filled oldest sales order first (the shortfall lands on the newest orders; the supervisor can change it); else as shipped.
  function pDefaults(l) {
    const lines = pLinesOf(l), saved = V.checks.filter(c => c.load_id === l.id), m = new Map();
    if (saved.length) {
      V.notes.set(l.id, new Map(saved.filter(c => c.note).map(c => [pkey(c.shipment_nbr, c.line_nbr), c.note])));
      lines.forEach(x => { const c = saved.find(s => s.shipment_nbr === x.nbr && s.line_nbr === x.line_nbr); m.set(pkey(x.nbr, x.line_nbr), c ? Number(c.final_qty) : x.shipped); });
      return m;
    }
    const got = V.items.get(l.id) || new Map();
    const left = new Map([...got.values()].filter(c => c.checked_qty != null).map(c => [c.inventory_id, Number(c.checked_qty)]));
    lines.forEach(x => {
      if (!left.has(x.item)) { m.set(pkey(x.nbr, x.line_nbr), x.shipped); return; }
      const give = Math.min(x.shipped, left.get(x.item));
      left.set(x.item, left.get(x.item) - give);
      m.set(pkey(x.nbr, x.line_nbr), give);
    });
    return m;
  }
  const finalOf = l => { if (!V.final.has(l.id)) V.final.set(l.id, pDefaults(l)); return V.final.get(l.id); };
  // SKUs of the load; `short` = the checker counted fewer than the shipments hold.
  function pItems(l) {
    const fin = finalOf(l), got = V.items.get(l.id) || new Map(), by = new Map();
    pLinesOf(l).forEach(x => { if (!by.has(x.item)) by.set(x.item, []); by.get(x.item).push(x); });
    return [...by.entries()].map(([item, xs]) => {
      const onShip = xs.reduce((t, x) => t + x.shipped, 0), out = xs.reduce((t, x) => t + fin.get(pkey(x.nbr, x.line_nbr)), 0);
      const c = got.get(item), checked = c && c.checked_qty != null ? Number(c.checked_qty) : null;
      return { item, xs, onShip, out, checked, short: checked != null ? checked < onShip : out < onShip, desc: xs[0].desc };
    });
  }
  const pMismatch = l => pItems(l).filter(i => i.short && i.checked != null && i.out !== i.checked);

  function renderPending() {
    const el = document.getElementById('invConfirm');
    if (!el) return;
    if (!V.pend.length) { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="section-h" style="font-size:14px;font-weight:700;color:var(--navy);margin:0 2px 8px">Checked loads to confirm in ${D.env === 'test' ? 'Acumatica TEST' : 'Acumatica'} (${V.pend.length})</div>${V.pend.map(pendCard).join('')}`;
  }

  function pendPill(l) {
    if (confirmQueued(l)) return '<span class="pill warn">Queued for Acumatica</span>';
    if (l.check_status === 'confirming') return `<span class="pill warn">Confirming ${l.ships.filter(s => s.check_result).length} of ${l.ships.length}…</span>`;
    if (l.check_status === 'partial') return '<span class="pill bad">Partly confirmed</span>';
    return '<span class="pill info">Ready to confirm</span>';
  }

  function pendCard(l) {
    const items = pItems(l), shorts = items.filter(i => i.short), open = V.openL.has(l.id);
    const queued = confirmQueued(l), confirming = l.check_status === 'confirming', locked = queued || confirming;
    const res = l.ships.slice().sort((a, b) => a.shipment_nbr.localeCompare(b.shipment_nbr));
    const bad = pMismatch(l);
    return `<div class="grp"><div class="gh">
        <button class="btn small" data-lopen="${l.id}" aria-expanded="${open}">${open ? 'Hide' : 'Open'}</button>
        <span class="lnbr">${esc(l.load_nbr)}</span>${waveTag(l.wave)} <b>${esc(l.truck_type || '')}</b> <span class="target">${esc(l.ship_via || '')}</span>
        <span class="muted">${plural(l.ships.length, 'shipment')} · ${shorts.length ? `<b style="color:var(--warn-text)">${plural(shorts.length, 'short item')}</b>` : 'nothing short'}</span>
        ${pendPill(l)}<span class="gval">${locked ? '' : `<button class="btn primary small" data-confirm="${l.id}">${l.check_status === 'partial' ? 'Retry confirm' : 'Confirm in Acumatica'}</button>`}</span></div>
      ${open ? `<div style="padding:10px 14px">
        ${queued ? progressBox('Queued for Acumatica', 0, l.ships.length, 'Starts as soon as the load ahead of it is done.') : ''}
        ${confirming ? progressBox('Confirming in Acumatica', res.filter(s => s.check_result).length, l.ships.length, 'Lowering lines and confirming, shipment by shipment. You can leave this page.') : ''}
        ${bad.length ? `<div class="warnbox">Going out doesn't add up to the checker's count for: ${bad.map(i => esc(i.desc || i.item)).join(', ')}.</div>` : ''}
        ${!pLinesOf(l).length ? '<div class="warnbox bad">No item lines for this load\'s shipments yet.</div>' : ''}
        ${shorts.length ? `<table class="inv pc"><thead><tr><th>Short item / customer</th><th class="r">On shipment</th><th class="r">Going out</th></tr></thead>${shorts.map(i => pendItem(l, i, locked)).join('')}</table>`
          : '<div class="muted" style="margin-bottom:8px">The checker found nothing short. Everything goes out as on the shipments.</div>'}
        ${res.some(s => s.check_result) ? `<table class="inv"><thead><tr><th>Shipment</th><th>Customer</th><th>Acumatica</th></tr></thead><tbody>${res.map(s => `<tr><td class="num">${esc(s.shipment_nbr)}</td><td>${esc((s.row && (s.row.customer_name || s.row.customer_id)) || '')}</td>
          <td>${s.check_result ? resultPill({ result: s.check_result }) + (s.check_detail ? ` <span class="muted">${esc(s.check_detail)}</span>` : '') : ''}</td></tr>`).join('')}</tbody></table>` : ''}
      </div>` : ''}</div>`;
  }

  function pendItem(l, i, locked) {
    const fin = finalOf(l), notes = V.notes.get(l.id) || new Map();
    const sc = (V.items.get(l.id) || new Map()).get(i.item), sub = sc && sc.sub_needed;
    return `<tbody><tr class="ihead ${i.checked != null && i.out !== i.checked ? 'mis' : ''}"><td><b>${esc(i.desc || i.item)}</b> <span class="muted num">${esc(i.item)}</span>
        <div class="mis-note">Checker counted ${i.checked != null ? fmt(i.checked) : '—'} of ${fmt(i.onShip)}${i.checked != null ? ` · short ${fmt(i.onShip - i.checked)}` : ''}</div>
        ${sub ? `<div class="mis-note">Substitute needed${sc.sub_note ? ' — ' + esc(sc.sub_note) : ''}${sc.sub_resolved_at ? ' · complete' : ''}</div>` : ''}</td>
      <td class="r num">${fmt(i.onShip)}</td><td class="r num"><b>${fmt(i.out)}</b></td></tr>
      ${i.xs.map(x => {
        const k = pkey(x.nbr, x.line_nbr), fv = fin.get(k);
        return `<tr class="cust ${fv === 0 ? 'zero' : fv < x.shipped ? 'low' : ''}"><td>${esc(x.customer)} <span class="muted num">${esc(x.nbr)}${x.odate ? ' · ordered ' + esc(x.odate) : ''}</span>
          ${fv < x.shipped ? `<div><input type="text" maxlength="200" data-lnote="${esc(k)}" data-load="${l.id}" value="${esc(notes.get(k) || '')}" placeholder="${fv === 0 ? 'Why removed? e.g. substituted with item…' : 'Why lowered?'}" style="width:100%;margin-top:4px" ${locked ? 'disabled' : ''}></div>` : ''}</td>
          <td class="r num">${fmt(x.shipped)}</td>
          <td class="r"><input type="number" min="0" max="${x.shipped}" step="1" data-lfinal="${esc(k)}" data-load="${l.id}" value="${fv}" ${locked ? 'disabled' : ''} aria-label="Going out for ${esc(i.item)} to ${esc(x.customer)}"></td></tr>`;
      }).join('')}</tbody>`;
  }

  function pPayload(l) {
    const fin = finalOf(l), notes = V.notes.get(l.id) || new Map();
    return pLinesOf(l).map(x => { const k = pkey(x.nbr, x.line_nbr), fv = fin.get(k);
      return { shipment_nbr: x.nbr, line_nbr: x.line_nbr, final_qty: fv, note: fv < x.shipped ? (notes.get(k) || null) : null }; });
  }
  const editingBoxes = () => { const a = document.activeElement; return !!(a && a.dataset && (a.dataset.lfinal !== undefined || a.dataset.lnote !== undefined || a.dataset.subres !== undefined || a.dataset.subq !== undefined || a.dataset.subqty !== undefined)); };

  async function loadAll() {
    await loadPending();
    await loadSubs();
    const { data: ships, error } = await sb.from(shipTable()).select(SHIP_COLS)
      .eq('status', 'Confirmed').eq('operation', 'Issue').order('shipment_date').order('shipment_nbr').range(0, 999);
    if (error) throw error;
    const nbrs = (ships || []).map(s => s.shipment_nbr);
    const loadOf = new Map(), inv = new Map();
    for (let i = 0; i < nbrs.length; i += 150) {
      const chunk = nbrs.slice(i, i + 150);
      const [ls, iv] = await Promise.all([
        sb.from('load_shipments').select('shipment_nbr, loads(load_nbr, wave, load_date, ship_via, truck_type, check_status)').eq('env', D.env).in('shipment_nbr', chunk),
        sb.from('shipment_invoicing').select('*').eq('env', D.env).in('shipment_nbr', chunk),
      ]);
      if (ls.error) throw ls.error;
      if (iv.error) throw iv.error;
      (ls.data || []).forEach(r => loadOf.set(r.shipment_nbr, r.loads));
      (iv.data || []).forEach(r => inv.set(r.shipment_nbr, r));
    }
    // Recent results for shipments that have since left Confirmed (invoiced).
    const since = new Date(Date.now() - 24 * 3600e3).toISOString();
    const rec = await sb.from('shipment_invoicing').select('*').eq('env', D.env).gte('updated_at', since).order('updated_at', { ascending: false }).limit(200);
    if (rec.error) throw rec.error;
    V.recent = rec.data || [];
    // Only shipments on a load the checker has confirmed in full. Confirmed
    // shipments that aren't on a checked load (older ones, other routes) stay off.
    V.ships = (ships || []).filter(s => { const l = loadOf.get(s.shipment_nbr); return l && l.check_status === 'confirmed'; });
    V.loadOf = loadOf; V.inv = inv;
    // Drop selections that are no longer selectable.
    [...V.sel].forEach(n => { if (!selectable(n)) V.sel.delete(n); });
    const active = [...inv.values()].some(r => ['queued', 'running'].includes(r.state));
    if (V.was && !active) toast('Invoicing finished. Check any that need attention.');
    V.was = active;
    await loadPrintable();
  }

  // ------------------------------------------------------------------
  // Printing. Prepared invoices (done in the last 3 days) can be printed one by one or a
  // whole load at a time. The server counts earlier prints (invoice_print_record): the first
  // is free, a reprint needs a reason and is marked REPRINT on the paper. Every print is logged.
  // ------------------------------------------------------------------
  async function loadPrintable() {
    await loadKinds();
    const since = new Date(Date.now() - 3 * 24 * 3600e3).toISOString();
    const r = await sb.from('shipment_invoicing').select('shipment_nbr,finished_at').eq('env', D.env).eq('state', 'done')
      .gte('finished_at', since).order('finished_at', { ascending: false }).limit(300);
    if (r.error) throw r.error;
    // Invoices looked up by number (printLookup) stay in the list for the rest of the session.
    const nbrs = [...new Set([...(r.data || []).map(x => x.shipment_nbr), ...V.manual.map(m => m.nbr)])];
    V.prints = new Map(); V.hdr = new Map(); V.pr = [];
    if (!nbrs.length) { V.psel.clear(); return; }
    const rows = await shipmentsByNbr(nbrs);
    const byNbr = new Map(rows.map(x => [x.shipment_nbr, x]));
    V.manual.forEach(m => { if (!byNbr.has(m.nbr)) byNbr.set(m.nbr, { shipment_nbr: m.nbr, order_nbr: m.order, customer_id: m.cust, customer_name: m.name, shipment_value: null }); });
    const ls = [], pr = [];
    for (let i = 0; i < nbrs.length; i += 150) {
      const c = nbrs.slice(i, i + 150);
      const [a, b] = await Promise.all([
        sb.from('load_shipments').select('shipment_nbr, loads(id, load_nbr, wave, load_date, ship_via, truck_type)').eq('env', D.env).in('shipment_nbr', c),
        sb.from('invoice_prints').select('shipment_nbr,print_no,printed_at,printed_name').eq('env', D.env).is('voided_at', null).in('shipment_nbr', c).order('print_no'),
      ]);
      if (a.error) throw a.error;
      if (b.error) throw b.error;
      ls.push(...(a.data || [])); pr.push(...(b.data || []));
    }
    const loadOfP = new Map(ls.map(x => [x.shipment_nbr, x.loads]));
    V.marks = new Set();
    const lids = [...new Set(ls.map(x => x.loads && x.loads.id).filter(Boolean))];
    if (lids.length) {
      const mk = await sb.from('invoice_load_marks').select('load_id').eq('env', D.env).in('load_id', lids);
      if (mk.error) throw mk.error;
      (mk.data || []).forEach(m => V.marks.add(m.load_id));
    }
    pr.forEach(x => V.prints.set(x.shipment_nbr, x));            // ordered, so the last wins
    // Invoice per shipment: matched on the shipment number Acumatica puts on each invoice line (invoice_shipments),
    // so a shipment that carries a second sales order (a substitution) still finds its invoice. V.hdr is keyed by shipment.
    const manualOf = new Map(V.manual.map(m => [m.nbr, m]));
    const askInv = async () => {
      const items = rows.filter(x => !manualOf.has(x.shipment_nbr)).map(x => ({ shipment_nbr: x.shipment_nbr, order_nbr: x.order_nbr || '' }));
      V.hdr = new Map();
      if (!items.length) return;
      const h = await sb.rpc('invoice_print_for_shipments', { p_items: items });
      if (h.error) throw h.error;
      (h.data || []).forEach(x => V.hdr.set(x.shipment_nbr, x));
    };
    await askInv();
    // Anything still without an invoice number: pull the shipment-to-invoice links from Acumatica (at most once a minute), then look again.
    if (rows.some(x => !manualOf.has(x.shipment_nbr) && !V.hdr.has(x.shipment_nbr)) && Date.now() - (V.linkTry || 0) > 60000) {
      V.linkTry = Date.now();
      try { await callSyncInvoiceLinks(); await askInv(); } catch (e) { console.warn('[invoicing links]', e); }
    }
    V.pr = nbrs.filter(n => byNbr.has(n)).map(n => ({ nbr: n, ship: byNbr.get(n), load: loadOfP.get(n) || null,
      inv: manualOf.has(n) ? { reference_number: manualOf.get(n).ref } : V.hdr.get(n) || null }));
    [...V.psel].forEach(n => { if (!V.pr.some(x => x.nbr === n)) V.psel.delete(n); });
  }

  // Print by invoice number: refresh that invoice from Acumatica (live), add it to the print list, and let the
  // usual flow print it. Also how an older invoice is reprinted once it has left the 3-day list.
  async function printLookup() {
    const box = document.getElementById('plookup');
    const ref = (box.value || '').trim();
    if (!ref) { toast('Type an invoice number', true); return; }
    if (D.env !== 'live') { toast('Print by invoice number reads live Acumatica. Switch to Live.', true); return; }
    if (V.pbusy) return;
    V.pbusy = true;
    try {
      const s = await callSyncInvoicePrint([ref]);
      if ((s.not_found || []).includes(ref)) { toast(`Invoice ${ref} wasn't found in Acumatica`, true); return; }
      const f = await sb.rpc('invoice_print_fetch', { p_refs: [ref] });
      if (f.error) throw f.error;
      const inv = (f.data || [])[0];
      if (!inv) { toast(`Invoice ${ref} isn't available yet`, true); return; }
      if (!inv.shipment_nbr) { toast(`Invoice ${ref} has no shipment on it, so the print can't be logged against one`, true); return; }
      if (!V.manual.some(m => m.nbr === inv.shipment_nbr)) V.manual.push({ nbr: inv.shipment_nbr, ref: inv.ref, order: inv.so_number, cust: inv.customer_id, name: (inv.bill && inv.bill.name) || '' });
      V.psel.add(inv.shipment_nbr);
      box.value = '';
    } catch (e) { console.error('[invoicing lookup]', e); toast(errMsg(e), true); }
    finally { V.pbusy = false; await refresh(); }
  }

  function printPill(n) {
    const p = V.prints.get(n);
    if (!p) return '<span class="pill info">Not printed</span>';
    return `<span class="pill ok">Printed${p.print_no > 1 ? ' ×' + p.print_no : ''}</span> <span class="muted">${esc(new Date(p.printed_at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }))}${p.printed_name ? ' · ' + esc(p.printed_name) : ''}</span>`;
  }

  const prLoadKey = x => x.load ? x.load.load_nbr : '—';
  function renderPrintPanel() {
    const el = document.getElementById('invPrint');
    if (!el) return;
    if (!V.pr.length) { el.innerHTML = ''; return; }
    const groups = new Map();
    V.pr.forEach(x => { const k = prLoadKey(x); if (!groups.has(k)) groups.set(k, { load: x.load, rows: [] }); groups.get(k).rows.push(x); });
    // A load is finished with once every invoice on it has been printed here, or someone marked it printed
    // (printed from Acumatica). Those drop off the list; 'Show printed' brings them back.
    const isDone = g => g.rows.every(x => V.prints.has(x.nbr)) || (g.load && V.marks.has(g.load.id));
    const all = [...groups.entries()].sort(([a], [b]) => (a === '—') - (b === '—') || a.localeCompare(b));
    const nDone = all.filter(([, g]) => isDone(g)).length;
    const order = V.showPrinted ? all : all.filter(([, g]) => !isDone(g));
    el.innerHTML = `<div class="section-h" style="font-size:14px;font-weight:700;color:var(--navy);margin:0 2px 8px">Prepared invoices to print (${order.reduce((n, [, g]) => n + g.rows.length, 0)})${nDone ? ` <button class="btn small" data-act="pshowprinted" style="margin-left:8px">${V.showPrinted ? 'Hide' : 'Show'} printed loads (${nDone})</button>` : ''}</div>
      ${!order.length ? '<div class="card"><div class="empty">Every prepared load has been printed.</div></div>' : ''}
      ${order.map(([k, g]) => {
        const allOn = g.rows.every(x => V.psel.has(x.nbr)), nUn = g.rows.filter(x => !V.prints.has(x.nbr)).length;
        return `<div class="grp"><div class="gh">
          <label><input type="checkbox" data-pgrp="${esc(k)}" ${allOn ? 'checked' : ''}> ${g.load ? `<span class="lnbr">${esc(k)}</span>` : 'Not on a load'}</label>
          ${g.load ? `${waveTag(g.load.wave)} <b>${esc(g.load.truck_type || '')}</b> <span class="target">${esc(g.load.ship_via || '')}</span>` : ''}
          <span class="muted">${plural(g.rows.length, 'invoice')}${nUn ? ` · ${nUn} not printed` : ' · all printed'}</span>
          <span class="gval">${g.load ? (V.marks.has(g.load.id) ? `<span class="muted">Marked printed</span> <button class="btn small" data-pmark="${g.load.id}" data-to="0" ${V.pbusy ? 'disabled' : ''}>Undo</button>` : `<button class="btn small" data-pmark="${g.load.id}" data-to="1" ${V.pbusy ? 'disabled' : ''} title="Printed from Acumatica? Hide this load from the list">Mark printed</button>`) : ''} <button class="btn small" data-pload="${esc(k)}" ${V.pbusy ? 'disabled' : ''}>Print load</button></span></div>
          <table class="inv"><thead><tr><th class="cb"></th><th>Invoice</th><th>Shipment</th><th>Customer</th><th class="r">Value</th><th>Print</th></tr></thead><tbody>
          ${g.rows.map(x => `<tr class="${V.psel.has(x.nbr) ? 'sel' : ''}"><td class="cb"><input type="checkbox" data-pship="${esc(x.nbr)}" ${V.psel.has(x.nbr) ? 'checked' : ''} aria-label="Select ${esc(x.nbr)} to print"></td>
            <td class="num">${x.inv ? esc(x.inv.reference_number) : '<span class="muted" title="Not synced from Acumatica yet">pending</span>'}</td><td class="num">${esc(x.nbr)}</td>
            <td>${esc(x.ship.customer_name || x.ship.customer_id || '')}</td><td class="r num">${x.ship.shipment_value == null ? '<span class="muted">—</span>' : money(x.ship.shipment_value)}</td>
            <td>${printPill(x.nbr)}${isSlipKind(x) ? ` <button class="btn small" data-slip="${esc(x.nbr)}" ${V.pbusy ? 'disabled' : ''} title="Delivery slip with no prices (donation and promotion orders)">Delivery slip</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
      }).join('')}
      ${V.psel.size ? `<div class="sumbar"><span><b>${V.psel.size}</b> selected to print</span><span class="spacer"></span>
        <button class="btn small" data-act="pclear">Clear</button>${V.pr.some(x => V.psel.has(x.nbr) && isSlipKind(x)) ? `<button class="btn small" data-act="pslip" ${V.pbusy ? 'disabled' : ''}>Print delivery slips (${V.pr.filter(x => V.psel.has(x.nbr) && isSlipKind(x)).length})</button>` : ''}<button class="btn primary small" data-act="print" ${V.pbusy ? 'disabled' : ''}>Print ${plural(V.psel.size, 'invoice')}</button></div>` : ''}`;
  }

  // The invoice itself comes from Acumatica (Generic Inquiry DFLInvoicePrint, synced by sync-invoice-print),
  // laid out by invoice-print.js on US Letter. Before printing: refresh those invoices, refuse any that are
  // missing or whose tax doesn't reconcile, log the print (first print free; a reprint needs a reason and is marked).
  async function callSyncInvoicePrint(refs) {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error('Signed out; reload and sign in again');
    const res = await fetch(`${SUPABASE_URL}/functions/v1/sync-invoice-print`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ refs }),
    });
    let j = null;
    try { j = await res.json(); } catch (e) {}
    if (!res.ok || !(j && j.success)) throw new Error((j && j.error) || `Invoice refresh failed (${res.status})`);
    return j;
  }

  // Links only (which invoice belongs to which shipment): cheap, so the page can ask whenever a row is still pending.
  async function callSyncInvoiceLinks() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return;
    const res = await fetch(`${SUPABASE_URL}/functions/v1/sync-invoice-print`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ links: true, days_back: 3 }),
    });
    const j = await res.json().catch(() => null);
    if (!res.ok || !(j && j.success)) throw new Error((j && j.error) || `Link refresh failed (${res.status})`);
  }

  async function markLoadPrinted(loadId, on) {
    if (V.pbusy) return;
    V.pbusy = true; renderPrintPanel();
    try {
      const r = await sb.rpc('invoice_load_mark_printed', { p_env: D.env, p_load_id: loadId, p_marked: on });
      if (r.error) throw r.error;
      toast(on ? 'Load marked printed' : 'Mark removed');
    } catch (e) { console.error('[invoicing mark]', e); toast(errMsg(e), true); }
    finally { V.pbusy = false; await refresh(); }
  }

  // Delivery slip: the same document as the invoice with no prices, tax or totals, for donation and promotion orders.
  // It is not logged as an invoice print, so it never makes the real invoice a "reprint".
  const isSlipKind = x => ['donation', 'promotion'].includes(kindOf(x.ship));
  async function printSlips(nbrs) {
    const items = V.pr.filter(x => nbrs.includes(x.nbr));
    if (!items.length || V.pbusy) return;
    const noInv = items.filter(x => !x.inv);
    if (noInv.length) { toast(`No invoice number yet for ${noInv.slice(0, 4).map(x => x.nbr).join(', ')}. Try again in a few minutes.`, true); return; }
    V.pbusy = true; renderPrintPanel();
    try {
      const refs = items.map(x => x.inv.reference_number);
      await callSyncInvoicePrint(refs);
      const f = await sb.rpc('invoice_print_fetch', { p_refs: refs });
      if (f.error) throw f.error;
      const byRef = new Map((f.data || []).map(i => [i.ref, i]));
      const missing = refs.filter(r => !byRef.get(r) || !(byRef.get(r).lines || []).length);
      if (missing.length) { toast(`Nothing printed. ${missing.slice(0, 4).join(', ')}: no lines in Acumatica data yet`, true); return; }
      InvoicePrint.show(items.flatMap(x => InvoicePrint.pages(byRef.get(x.inv.reference_number), { slip: true })));
    } catch (e) { console.error('[invoicing slip]', e); toast(errMsg(e), true); }
    finally { V.pbusy = false; await refresh(); }
  }

  async function printInvoices(nbrs) {
    const items = V.pr.filter(x => nbrs.includes(x.nbr));
    if (!items.length || V.pbusy) return;
    const noInv = items.filter(x => !x.inv);
    if (noInv.length) { toast(`No invoice number yet for ${noInv.slice(0, 4).map(x => x.nbr).join(', ')}. Try again in a few minutes.`, true); return; }
    // Open substitutions on these invoices' loads: warn, and let the clerk print anyway (logged once the print is recorded).
    const lids = new Set(items.map(x => x.load && x.load.id).filter(Boolean));
    const openSubs = V.subs.filter(s => lids.has(s.load_id));
    if (openSubs.length) {
      const list = openSubs.slice(0, 5).map(s => `${s.load.load_nbr}: ${s.desc}`).join('\n');
      if (!confirm(`${plural(openSubs.length, 'substitution')} not complete yet on ${lids.size > 1 ? 'these loads' : 'this load'}:\n\n${list}${openSubs.length > 5 ? '\n…' : ''}\n\nThe invoice may not show the substituted item yet.\n\nPrint anyway?`)) return;
    }
    const again = items.filter(x => V.prints.has(x.nbr));
    let reason = null;
    if (again.length) {
      reason = prompt(`${plural(again.length, 'invoice')} already printed (${again.slice(0, 4).map(x => x.nbr).join(', ')}${again.length > 4 ? '…' : ''}).\nThese come out marked REPRINT and are logged.\n\nWhy are they being reprinted?`);
      if (reason == null) return;
      if (!reason.trim()) { toast('A reprint needs a reason', true); return; }
    }
    V.pbusy = true; renderPrintPanel();
    let ids = [];
    try {
      const refs = items.map(x => x.inv.reference_number);
      await callSyncInvoicePrint(refs);
      const f = await sb.rpc('invoice_print_fetch', { p_refs: refs });
      if (f.error) throw f.error;
      const byRef = new Map((f.data || []).map(i => [i.ref, i]));
      const problems = [];
      items.forEach(x => {
        const inv = byRef.get(x.inv.reference_number);
        if (!inv) { problems.push(`${x.inv.reference_number}: not in Acumatica data yet`); return; }
        if (!(inv.lines || []).length) { problems.push(`${inv.ref}: no lines yet`); return; }
        const c = InvoicePrint.check(inv);
        if (!c.ok) problems.push(`${inv.ref}: ${c.problems.join('; ')}`);
      });
      if (problems.length) { toast(`Nothing printed. ${problems.slice(0, 3).join(' | ')}${problems.length > 3 ? ` (+${problems.length - 3} more)` : ''}`, true); return; }
      const r = await sb.rpc('invoice_print_record', { p_env: D.env, p_items: items.map(x => ({ shipment_nbr: x.nbr, invoice_nbr: x.inv.reference_number })), p_reason: reason });
      if (r.error) throw r.error;
      if (openSubs.length) [...new Set(openSubs.map(s => s.load_id))].forEach(id => sb.rpc('dispatch_sub_override', { p_load_id: id, p_note: null }).then(x => { if (x.error) console.warn('[sub override log]', x.error); }));
      const prs = new Map((r.data || []).map(p => [p.shipment_nbr, p]));
      ids = (r.data || []).map(p => p.id);
      V.psel.clear();
      const pages = items.flatMap(x => {
        const p = prs.get(x.nbr);
        return InvoicePrint.pages(byRef.get(x.inv.reference_number), p.reprint ? { reprint: { n: p.print_no - 1 } } : {});
      });
      InvoicePrint.show(pages);       // returns once the print dialog is closed
      // The browser can't tell a printed page from a cancelled dialog, so ask. "No" voids these prints.
      if (!confirm(`Did the ${plural(items.length, 'invoice')} print?\n\nOK = yes, they printed.\nCancel = no, it was cancelled or failed (it won't count as a print).`)) {
        const v = await sb.rpc('invoice_print_void', { p_ids: ids, p_note: 'Person said it did not print' });
        if (v.error) throw v.error;
        toast('Marked as not printed. You can print again.');
      }
    } catch (e) { console.error('[invoicing print]', e); toast(errMsg(e), true); }
    finally { V.pbusy = false; await refresh(); }
  }

  const stateOf = n => (V.inv.get(n) || {}).state;
  const busyNow = n => ['queued', 'running'].includes(stateOf(n));
  const selectable = n => V.ships.some(s => s.shipment_nbr === n) && !busyNow(n);

  function statePill(n) {
    const r = V.inv.get(n);
    if (!r) return '';
    return { queued: '<span class="pill warn">Queued</span>', running: '<span class="pill warn">Invoicing…</span>',
             done: '<span class="pill ok">Prepared</span>', refused: '<span class="pill warn">Refused</span>',
             failed: '<span class="pill bad">Failed</span>' }[r.state] + (r.detail ? ` <span class="muted">${esc(r.detail)}</span>` : '');
  }

  const F = { q: '', load: '', via: '', cust: '', ship: '', status: '' };
  const norm = x => String(x == null ? '' : x).toLowerCase();
  const hasFilter = () => Object.values(F).some(Boolean);
  const loadKey = s => { const l = V.loadOf.get(s.shipment_nbr); return l ? l.load_nbr : '—'; };
  const stateKind = n => busyNow(n) ? 'queue' : ['failed', 'refused'].includes(stateOf(n)) ? 'bad' : 'ready';

  // Rows after the date + filter panel are applied. Select-all and the group
  // boxes work on these only.
  function visible() {
    const terms = norm(F.q).split(/\s+/).filter(Boolean);
    const load = norm(F.load).trim(), cust = norm(F.cust).trim(), ship = norm(F.ship).trim();
    return V.ships.filter(s => {
      if (V.date && s.shipment_date !== V.date) return false;
      const l = V.loadOf.get(s.shipment_nbr) || {};
      if (F.status && stateKind(s.shipment_nbr) !== F.status) return false;
      if (F.via && (l.ship_via || '') !== F.via) return false;
      if (load && !norm(l.load_nbr).includes(load) && !nbrMatches(l.load_nbr, load)) return false;
      if (cust && !(norm(s.customer_name) + ' ' + norm(s.customer_id)).includes(cust)) return false;
      if (ship && !norm(s.shipment_nbr).includes(ship)) return false;
      if (terms.length) {
        const hay = [l.load_nbr, l.ship_via, l.truck_type, s.customer_name, s.customer_id, s.shipment_nbr, s.order_nbr].map(norm).join(' ');
        if (!nbrMatches(l.load_nbr, F.q) && !terms.every(t => hay.includes(t))) return false;
      }
      return true;
    });
  }

  function ensureShell() {
    const main = document.getElementById('main');
    if (main.querySelector('#invTop')) return;
    main.innerHTML = `<div id="invSubs" style="margin-bottom:14px"></div><div id="invConfirm"></div>
      <div class="filt" id="invLookup" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <label for="plookup" style="margin:0">Print by invoice number</label>
        <input class="txt" id="plookup" type="search" autocomplete="off" placeholder="e.g. 1059165" style="width:180px">
        <button class="btn small" data-act="plookup">Find and add</button>
        <span class="muted">Live Acumatica. Also for reprinting older invoices.</span>
      </div>
      <div id="invPrint" style="margin-bottom:14px"></div><div id="invTop"></div>
      <div class="filt" id="invFilt">
        <div class="fsearch"><label for="fq">Search</label><input class="txt" id="fq" type="search" autocomplete="off" placeholder="Load, trucker, customer, shipment or order…"></div>
        <div class="frow">
          <div><label for="fload">Load</label><input class="txt" id="fload" data-f="load" type="search" autocomplete="off" placeholder="Load number"></div>
          <div><label for="fvia">Trucker</label><select id="fvia" data-f="via"></select></div>
          <div><label for="fcust">Customer</label><input class="txt" id="fcust" data-f="cust" type="search" autocomplete="off" placeholder="Name or ID"></div>
          <div><label for="fship">Shipment</label><input class="txt" id="fship" data-f="ship" type="search" autocomplete="off" placeholder="Shipment no."></div>
          <div><label for="fstatus">Status</label><select id="fstatus" data-f="status">
            <option value="">All</option><option value="ready">Ready</option><option value="queue">In the queue</option><option value="bad">Need attention</option></select></div>
        </div>
        <div class="fmeta"><span class="muted" id="fcount"></span><span class="spacer"></span><button class="btn small" data-act="resetf" id="fclear" hidden>Clear filters</button></div>
      </div>
      <div id="invProg"></div><div id="invList"></div><div id="invBar"></div>`;
  }

  function syncFilterBox(shown) {
    const vias = [...new Set(V.ships.map(s => (V.loadOf.get(s.shipment_nbr) || {}).ship_via).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    if (F.via && !vias.includes(F.via)) F.via = '';
    document.getElementById('fvia').innerHTML = '<option value="">All truckers</option>' + vias.map(v => `<option value="${esc(v)}" ${F.via === v ? 'selected' : ''}>${esc(v)}</option>`).join('');
    document.getElementById('fcount').textContent = hasFilter() || V.date
      ? `Showing ${shown} of ${V.ships.length} shipments` : `${plural(V.ships.length, 'shipment')} on checked loads`;
    document.getElementById('fclear').hidden = !hasFilter();
  }

  function render() {
    ensureShell();
    renderSubs();
    renderPending();
    renderPrintPanel();
    const all = visible();
    const groups = new Map();
    all.forEach(s => {
      const l = V.loadOf.get(s.shipment_nbr);
      const k = l ? l.load_nbr : '—';
      if (!groups.has(k)) groups.set(k, { load: l, rows: [] });
      groups.get(k).rows.push(s);
    });
    const order = [...groups.entries()].sort(([a], [b]) => (a === '—') - (b === '—') || a.localeCompare(b));
    const waiting = V.ships.filter(s => busyNow(s.shipment_nbr)).length;
    const doneToday = V.recent.filter(r => r.state === 'done').length;
    const bad = V.ships.filter(s => ['failed', 'refused'].includes(stateOf(s.shipment_nbr))).length;
    const ready = V.ships.filter(s => !busyNow(s.shipment_nbr)).length;
    const dates = [...new Set(V.ships.map(s => s.shipment_date).filter(Boolean))];
    const shownIds = new Set(all.map(s => s.shipment_nbr));
    const selShips = V.ships.filter(s => V.sel.has(s.shipment_nbr));
    const selVal = selShips.reduce((t, s) => t + val(s), 0);
    const hidden = selShips.filter(s => !shownIds.has(s.shipment_nbr)).length;
    const anyPick = all.some(s => selectable(s.shipment_nbr) && !V.sel.has(s.shipment_nbr));

    document.getElementById('invTop').innerHTML = `
      <div class="controls">
        <select id="datePick" aria-label="Shipment date"><option value="">All dates</option>${dates.map(d => `<option value="${d}" ${V.date === d ? 'selected' : ''}>${esc(niceDate(d))}</option>`).join('')}</select>
        <span class="spacer"></span>
        <button class="btn small" data-act="selall" ${all.some(s => selectable(s.shipment_nbr)) ? '' : 'disabled'}>${anyPick ? (hasFilter() || V.date ? 'Select all shown' : 'Select all') : 'Clear shown'}</button>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="l">Ready to invoice</div><div class="v">${ready}</div><div class="s">confirmed shipments</div></div>
        <div class="kpi"><div class="l">In the queue</div><div class="v">${waiting}</div><div class="s">being prepared</div></div>
        <div class="kpi ${bad ? 'warn' : ''}"><div class="l">Need attention</div><div class="v">${bad}</div><div class="s">failed or refused</div></div>
        <div class="kpi"><div class="l">Prepared (24h)</div><div class="v">${doneToday}</div><div class="s">invoices from here</div></div>
      </div>`;
    syncFilterBox(all.length);
    document.getElementById('invProg').innerHTML = waiting
      ? progressBox('Preparing invoices in ' + (D.env === 'test' ? 'Acumatica TEST' : 'Acumatica'), 0, waiting, 'Runs in the background, one shipment at a time. You can leave this page.') : '';

    let body;
    if (order.length) body = order.map(([k, g]) => group(k, g)).join('');
    else if (V.ships.length) body = `<div class="card"><div class="empty">No shipments match the filters.<br><button class="btn small" data-act="resetf" style="margin-top:10px">Clear filters</button></div></div>`;
    else body = `<div class="card"><div class="empty">${doneToday ? `All caught up — ${plural(doneToday, 'invoice')} prepared in the last 24 hours.` : 'No checked and confirmed loads waiting to be invoiced.'}</div></div>`;
    document.getElementById('invList').innerHTML = body;

    document.getElementById('invBar').innerHTML = V.sel.size
      ? `<div class="sumbar"><span><b>${V.sel.size}</b> selected · ${money(selVal)}${hidden ? ` <span class="hid">(${hidden} hidden by filters)</span>` : ''}</span><span class="spacer"></span>
        <button class="btn small" data-act="clear">Clear</button>
        <button class="btn primary small" data-act="invoice">Prepare ${plural(V.sel.size, 'invoice')}</button></div>` : '';
  }

  function group(k, g) {
    const sel = g.rows.filter(s => selectable(s.shipment_nbr));
    const allOn = sel.length && sel.every(s => V.sel.has(s.shipment_nbr));
    const l = g.load, nSel = g.rows.filter(s => V.sel.has(s.shipment_nbr)).length;
    return `<div class="grp"><div class="gh">
        <label><input type="checkbox" data-grp="${esc(k)}" ${allOn ? 'checked' : ''} ${sel.length ? '' : 'disabled'}>
          ${l ? `<span class="lnbr">${esc(k)}</span>` : 'Not on a load'}</label>
        ${l ? `${waveTag(l.wave)} <b>${esc(l.truck_type || '')}</b> <span class="target">${esc(l.ship_via || '')}</span>` : ''}
        <span class="muted">${plural(g.rows.length, 'shipment')}</span>${nSel ? `<span class="gsel">${nSel} selected</span>` : ''}
        <span class="gval">${money(g.rows.reduce((t, s) => t + val(s), 0))}</span></div>
      <table class="inv"><thead><tr><th class="cb"></th><th>Shipment</th><th>Customer</th><th class="hide-m">Order</th><th class="hide-m">Date</th><th class="r">Value</th><th>Invoice</th></tr></thead><tbody>
      ${g.rows.map(s => {
        const n = s.shipment_nbr, can = selectable(n);
        return `<tr class="${V.sel.has(n) ? 'sel' : ''} ${busyNow(n) ? 'busy' : ''} ${stateKind(n) === 'bad' ? 'bad' : ''}"><td class="cb"><input type="checkbox" data-ship="${esc(n)}" ${V.sel.has(n) ? 'checked' : ''} ${can ? '' : 'disabled'} aria-label="Select ${esc(n)}"></td>
          <td class="num">${esc(n)}</td><td>${esc(s.customer_name || s.customer_id || '')}</td><td class="num hide-m">${esc(s.order_nbr || '')}</td>
          <td class="hide-m">${esc(s.shipment_date ? niceDate(s.shipment_date) : '')}</td><td class="r num">${s.shipment_value == null ? '<span class="muted">—</span>' : money(s.shipment_value)}</td>
          <td>${statePill(n)}</td></tr>`;
      }).join('')}</tbody></table></div>`;
  }

  async function act(fn) {
    if (V.busy) return;
    V.busy = true;
    try { await fn(); }
    catch (e) { console.error('[invoicing]', e); toast(errMsg(e), true); }
    finally { V.busy = false; await refresh(); }
  }

  document.getElementById('app').addEventListener('click', e => {
    const sOpen = e.target.closest('[data-subopen]');
    if (sOpen) {
      const k = sOpen.dataset.subopen;
      if (V.subUi.has(k)) V.subUi.delete(k);
      else {
        const s = V.subs.find(x => subKey(x) === k), u = { q: '', results: [], pick: null, qty: new Map(), msg: '', searching: false, err: '' };
        const started = s && s.ctxLines.map(z => subRowOf(s, z)).find(r => r && r.sub_inventory_id);
        if (started) u.pick = { inventory_id: started.sub_inventory_id, description: started.sub_description };
        V.subUi.set(k, u);
      }
      renderSubs(); return;
    }
    const sClose = e.target.closest('[data-subclose]');
    if (sClose) { V.subUi.delete(sClose.dataset.subclose); renderSubs(); return; }
    const sPick = e.target.closest('[data-subpick]');
    if (sPick) {
      const k = (sPick.closest('[data-subresults]') || {}).dataset?.subresults, u = V.subUi.get(k);
      if (u) { u.pick = u.results.find(i => i.inventory_id === sPick.dataset.subpick) || null; u.results = []; u.q = ''; renderSubs(); }
      return;
    }
    const sRun = e.target.closest('[data-subrun]');
    if (sRun) {
      const k = sRun.dataset.subrun, u = V.subUi.get(k), s = V.subs.find(x => subKey(x) === k);
      if (!u || !s || !u.pick) return;
      const lines = s.ctxLines.map(z => ({ shipment: z.shipment, qty: Number(u.qty.has(z.shipment) ? u.qty.get(z.shipment) : (subRowOf(s, z) ? subRowOf(s, z).qty : (s.ctxLines.length === 1 && s.required != null ? Math.min(Number(z.qty), s.required - Number(s.checked_qty)) : 0))) }))
        .filter(x => x.qty > 0 && !(subRowOf(s, { shipment: x.shipment }) || {}).state?.startsWith('done'));
      if (!lines.length) { toast('Enter a quantity for at least one customer', true); return; }
      const where = D.env === 'test' ? 'Acumatica TEST' : 'live Acumatica';
      if (!confirm(`Create ${plural(lines.length, 'order')} for ${u.pick.description || u.pick.inventory_id} in ${where}?\n\nEach customer gets its own sales order and shipment, confirmed and added to ${s.load.load_nbr}. This takes about 30 seconds per customer.`)) return;
      act(async () => {
        u.msg = 'Working… keep this page open.';
        renderSubs();
        const r = await callSub('run', { load_id: s.load_id, source_inventory_id: s.inventory_id, sub_inventory_id: u.pick.inventory_id, lines });
        u.msg = '';
        if (!r.ok) throw new Error(r.error || "Couldn't run the substitution");
        const rows = r.rows || [], done = rows.filter(x => x.state === 'done').length;
        toast(done === rows.length ? `Done: ${plural(done, 'substitute shipment')} on ${s.load.load_nbr}` : `${done} of ${rows.length} done. See the rows below for what stopped.`, done !== rows.length);
      });
      return;
    }
    const lo = e.target.closest('[data-lopen]');
    if (lo) { const id = Number(lo.dataset.lopen); V.openL.has(id) ? V.openL.delete(id) : V.openL.add(id); renderPending(); return; }
    const cf = e.target.closest('[data-confirm]');
    if (cf) {
      const l = V.pend.find(x => x.id === Number(cf.dataset.confirm));
      if (!l) return;
      const bad = pMismatch(l);
      if (bad.length) { V.openL.add(l.id); renderPending(); toast("Going out has to add up to the checker's count: " + bad.map(i => i.desc || i.item).join(', '), true); return; }
      const lines = pLinesOf(l), fin = finalOf(l);
      const low = lines.filter(x => fin.get(pkey(x.nbr, x.line_nbr)) < x.shipped).length;
      const where = D.env === 'test' ? 'Acumatica TEST' : 'live Acumatica';
      if (!confirm(`Confirm ${l.load_nbr} in ${where}?\n\n${plural(new Set(lines.map(x => x.nbr)).size, 'shipment')} will be confirmed${low ? `, with ${plural(low, 'line')} lowered or removed` : ''}.`)) return;
      act(async () => {
        if (l.check_status !== 'partial') { const { error } = await sb.rpc('dispatch_check_save', { p_load_id: l.id, p_lines: pPayload(l) }); if (error) throw error; }
        const r = await callAcu('check_confirm', { load_id: l.id });
        if (!r.ok) throw new Error(r.error || "Couldn't queue the load");
        V.wasConf.set(l.id, true); V.final.delete(l.id); V.notes.delete(l.id); V.openL.add(l.id);
      });
      return;
    }
    const sd = e.target.closest('[data-subdone]');
    if (sd) {
      const [lid, ...rest] = sd.dataset.subdone.split('|'), inv = rest.join('|'), key = sd.dataset.subdone;
      const what = (V.subRes.get(key) || '').trim();
      act(async () => {
        const { error } = await sb.rpc('dispatch_sub_resolve', { p_load_id: Number(lid), p_inventory_id: inv, p_resolved: true, p_resolution: what || null });
        if (error) throw error;
        V.subRes.delete(key);
        toast('Marked complete', false, { action: { label: 'Undo', fn: () => act(async () => { const u = await sb.rpc('dispatch_sub_resolve', { p_load_id: Number(lid), p_inventory_id: inv, p_resolved: false }); if (u.error) throw u.error; }) } });
      });
      return;
    }
    const sl = e.target.closest('[data-slip]');
    if (sl) { printSlips([sl.dataset.slip]); return; }
    const pm = e.target.closest('[data-pmark]');
    if (pm) { markLoadPrinted(Number(pm.dataset.pmark), pm.dataset.to === '1'); return; }
    const pl = e.target.closest('[data-pload]');
    if (pl) { printInvoices(V.pr.filter(x => (x.load ? x.load.load_nbr : '—') === pl.dataset.pload).map(x => x.nbr)); return; }
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const a = b.dataset.act;
    if (a === 'clear') { V.sel.clear(); render(); return; }
    if (a === 'pshowprinted') { V.showPrinted = !V.showPrinted; renderPrintPanel(); return; }
    if (a === 'pclear') { V.psel.clear(); renderPrintPanel(); return; }
    if (a === 'print') { printInvoices([...V.psel]); return; }
    if (a === 'pslip') { printSlips(V.pr.filter(x => V.psel.has(x.nbr) && isSlipKind(x)).map(x => x.nbr)); return; }
    if (a === 'plookup') { printLookup(); return; }
    if (a === 'selall') {
      const rows = visible().filter(s => selectable(s.shipment_nbr));
      const every = rows.length && rows.every(s => V.sel.has(s.shipment_nbr));
      rows.forEach(s => every ? V.sel.delete(s.shipment_nbr) : V.sel.add(s.shipment_nbr));
      render(); return;
    }
    if (a === 'resetf') {
      Object.keys(F).forEach(k => F[k] = '');
      ['fq', 'fload', 'fcust', 'fship'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('fstatus').value = '';
      render(); return;
    }
    if (a === 'invoice') {
      const nbrs = [...V.sel];
      const shown = new Set(visible().map(s => s.shipment_nbr));
      const hid = nbrs.filter(n => !shown.has(n)).length;
      const where = D.env === 'test' ? 'Acumatica TEST' : 'live Acumatica';
      if (!confirm(`Prepare ${plural(nbrs.length, 'invoice')} in ${where}?${hid ? `\n\n${hid} of them are hidden by your current filters.` : ''}\n\nReleasing them stays with Accounts.`)) return;
      act(async () => {
        const r = await callAcu('invoice_request', { env: D.env, shipments: nbrs });
        if (!r.ok) throw new Error(r.error || "Couldn't queue the invoices");
        V.sel.clear(); V.was = true;
        toast(`${plural(r.queued, 'shipment')} queued${r.skipped ? `, ${r.skipped} skipped (not confirmed or already queued)` : ''}`);
      });
    }
  });
  document.getElementById('app').addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.lnote !== undefined) { const id = Number(t.dataset.load); if (!V.notes.has(id)) V.notes.set(id, new Map()); V.notes.get(id).set(t.dataset.lnote, t.value.trim()); return; }
    if (t.dataset.lfinal !== undefined) {
      const l = V.pend.find(x => x.id === Number(t.dataset.load));
      const x = pLinesOf(l).find(y => pkey(y.nbr, y.line_nbr) === t.dataset.lfinal);
      let n = Math.round(Number(t.value));
      if (!(n >= 0)) n = 0;
      if (n > x.shipped) { toast(`Only ${fmt(x.shipped)} on the shipment; adding is a new order`, true); n = x.shipped; }
      finalOf(l).set(t.dataset.lfinal, n);
      renderPending(); return;
    }
    if (t.dataset.pship !== undefined) { t.checked ? V.psel.add(t.dataset.pship) : V.psel.delete(t.dataset.pship); renderPrintPanel(); return; }
    if (t.dataset.pgrp !== undefined) {
      V.pr.filter(x => (x.load ? x.load.load_nbr : '—') === t.dataset.pgrp).forEach(x => t.checked ? V.psel.add(x.nbr) : V.psel.delete(x.nbr));
      renderPrintPanel(); return;
    }
    if (t.id === 'datePick') { V.date = t.value; render(); return; }
    if (t.dataset.ship !== undefined) { t.checked ? V.sel.add(t.dataset.ship) : V.sel.delete(t.dataset.ship); render(); return; }
    if (t.dataset.f !== undefined) { F[t.dataset.f] = t.value; render(); return; }
    if (t.dataset.grp !== undefined) {
      visible().filter(s => loadKey(s) === t.dataset.grp && selectable(s.shipment_nbr))
        .forEach(s => t.checked ? V.sel.add(s.shipment_nbr) : V.sel.delete(s.shipment_nbr));
      render();
    }
  });

  // Filters apply as you type; debounced so a few hundred rows stay snappy.
  let fTimer = null;
  document.getElementById('app').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'plookup') { e.preventDefault(); printLookup(); }
  });
  document.getElementById('app').addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.subres !== undefined) { V.subRes.set(t.dataset.subres, t.value); return; }
    if (t.dataset.subqty !== undefined) {
      const i = t.dataset.subqty.lastIndexOf('|'), u = V.subUi.get(t.dataset.subqty.slice(0, i));
      if (u) u.qty.set(t.dataset.subqty.slice(i + 1), t.value === '' ? '' : Math.max(0, Math.round(Number(t.value)) || 0));
      return;
    }
    if (t.dataset.subq !== undefined) {
      const k = t.dataset.subq, u = V.subUi.get(k);
      if (!u) return;
      u.q = t.value; u.err = '';
      clearTimeout(u.timer);
      if (t.value.trim().length < 2) { u.results = []; u.searching = false; paintSubResults(k); return; }
      u.searching = true; paintSubResults(k);
      u.timer = setTimeout(async () => {
        const asked = u.q;
        try { const r = await callSub('search_items', { q: asked }); if (asked !== u.q) return; if (!r.ok) throw new Error(r.error || 'Search failed'); u.results = r.items || []; u.err = ''; }
        catch (err) { u.results = []; u.err = errMsg(err); }
        u.searching = false; paintSubResults(k);
      }, 450);
      return;
    }
    if (t.id !== 'fq' && !(t.dataset.f && t.tagName === 'INPUT')) return;
    if (t.id === 'fq') F.q = t.value; else F[t.dataset.f] = t.value;
    clearTimeout(fTimer); fTimer = setTimeout(render, 120);
  });

  function poll() {
    if (V.poll || !V.was) return;
    V.poll = setTimeout(async () => { V.poll = null; if (!V.busy) await refresh(); else poll(); }, 3000);
  }
  async function refresh() {
    try { await loadAll(); render(); poll(); }
    catch (e) { console.error('[invoicing]', e); document.getElementById('main').innerHTML = errBox(e); }
  }

  startPage({
    page: 'supervisor', role: ['supervisor', 'invoicer'], title: 'Invoicing',
    onEnvChange: () => { V.sel.clear(); V.psel.clear(); refresh(); },
    onReady: () => { refresh(); keepFresh(refresh, () => V.busy || editingBoxes(), ['loads', 'check_items']); },
  });
</script>
</body>
</html>
