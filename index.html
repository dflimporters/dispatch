<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2044">
<meta name="robots" content="noindex, nofollow">
<title>DFL Dispatch</title>
<!--
  Landing page for dflimporters.github.io/dispatch/. Signs in, then
  shows a tile for each page the user's roles allow. Someone with only one
  page (e.g. a picker) goes straight there.

  This replaced the old anon load board (2026-10-07); its overview now lives
  in the Coordinator page's suggested loads.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px; margin-top:16px; }
  .tile { display:block; text-decoration:none; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; color:var(--text); }
  .tile:hover { border-color:var(--navy); }
  .tile b { display:block; font-size:16px; color:var(--navy); margin-bottom:4px; }
  .tile span { font-size:13.5px; color:var(--text-muted); line-height:1.4; }
</style>
</head>
<body>
<div class="page" id="app"><div class="empty">Loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script>
const PAGES = [
  ['batcher.html',   'Coordinator',     'batcher', 'Build the day’s loads from open shipments.'],
  ['transfers.html', 'Transfers',       'batcher', 'Transfer lists from Ashenheim to 71 for bumped items.'],
  ['clerk.html',     'Trucker Liaison', 'clerk',   'Book truckers and lock loads in.'],
  ['picking.html',   'Picking',         'picker',  'Pick locked-in loads by area.'],
  ['checker.html',   'Checker',         'checker', 'Check picked against shipped, then confirm.'],
  ['invoicing.html', 'Invoicing',       'supervisor', 'Convert confirmed shipments to invoices in bulk.'],
  ['dashboard.html', 'Dashboard',       ['manager', 'supervisor'], 'Orders, shipments, picking and checking at a glance.'],
];

(async function () {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    gate(`<h2>DFL Dispatch</h2>
      <p>Sign in with your DFL Microsoft account.</p>
      <button class="btn primary" id="signin">Sign in with Microsoft</button>`);
    document.getElementById('signin').onclick = signIn;
    return;
  }
  const { data: me, error } = await sb.rpc('dispatch_me');
  if (error) { gate(`<h2>Something went wrong</h2><p>${esc(errMsg(error))}</p><button class="btn" onclick="signOut()">Sign out</button>`); return; }

  const mine = PAGES.filter(([, , role]) => [].concat(role).some(r => me.roles.includes(r)));
  if (!mine.length) {
    gate(`<h2>No dispatch access</h2>
      <p>You're signed in as <b>${esc(session.user.email)}</b>, but this account has no dispatch roles yet. Ask Joel to add them.</p>
      <button class="btn" onclick="signOut()">Sign out</button>`);
    return;
  }
  if (mine.length === 1) { location.replace(mine[0][0]); return; }

  document.getElementById('app').innerHTML = `
    <div class="hdr">
      <div class="brand"><h1>DFL Dispatch</h1></div>
      <div class="who"><span>${esc(me.name || session.user.email)}</span><button class="btn small" id="signout">Sign out</button></div>
    </div>
    <div class="tiles">${mine.map(([href, label, , blurb]) =>
      `<a class="tile" href="${href}"><b>${esc(label)}</b><span>${esc(blurb)}</span></a>`).join('')}</div>`;
  document.getElementById('signout').onclick = signOut;
})();
</script>
</body>
</html>
