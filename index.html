<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Load Board — DFL Dispatch</title>

<!--
  Load board: outbound shipments per shipping zone, their volume, how many
  trucks each zone needs, and whether a trucker has been assigned.

  Data: public.shipments, a mirror of the Acumatica SO-Shipment GI refreshed
  every 5 minutes by the sync-shipments edge function; public.truck_types holds
  each truck size's capacity in DFL volume units.

  Rules (from dispatch):
    - Batched = ship_via is set. Null ship_via = no trucker assigned yet.
    - Only operation='Issue' counts. 'Receipt' rows are returns coming back in.
    - A truck makes at most MAX_DROPS drops. A drop = one customer, so two
      shipments to the same customer in a zone are one stop.
    - Trucks needed = best fit per zone: the fewest trucks that satisfy both
      volume and drops, then the smallest total capacity among those. Zones are
      planned independently; a real truck may cover two small nearby zones.

  Three sections: Overview (the board), Logistics clerk (confirms a haulage
  contractor per BATCHnn placeholder batch) and Batcher (read-only list of
  confirmed ShipVias to apply in Acumatica, checked against the sync). See
  the "Batching" block in the script for the status rules.

  Hosted on GitHub Pages (dflimporters/dispatch → dflimporters.github.io/dispatch/),
  separate from the staff portal at dflhq.com. Same Supabase project.

  UNGUARDED while dispatch tests it: no sign-in, requests go out as anon.
  Temporary policies that allow it:
    shipments_read_anon, truck_types_read_anon          (read)
    batch_assignments_{read,insert,update}_test         (clerk writes!)
    batch_events_{read,insert}_test                     (append-only trail)
  The "Your name" box is honour-system until then. See README.md for what
  going behind sign-in involves.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f0f4f8; --surface:#ffffff; --border:#e2e8f0; --border2:#cbd5e1;
    --navy:#0f2044; --navy2:#1a3260;
    --text:#1e293b; --text-muted:#64748b; --text-dim:#94a3b8;
    --accent:#2563eb; --accent-bg:#eff6ff;
    --ok:#0f9f6e; --ok-bg:#ecfdf5; --ok-text:#047857;
    --warn:#f59e0b; --warn-bg:#fffbeb; --warn-text:#b45309;
    --bad:#dc2626; --bad-bg:#fef2f2; --bad-text:#b91c1c;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; font-size:14px; }

  .page { max-width:1100px; margin:0 auto; padding:24px 20px 60px; }
  .top { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  h1 { font-size:22px; font-weight:700; color:var(--navy); letter-spacing:-0.2px; }
  .sync { font-size:12px; color:var(--text-muted); margin-top:4px; }
  .sync.stale { color:var(--bad-text); font-weight:600; }

  .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .seg { display:inline-flex; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:3px; }
  .seg button { border:0; background:none; font:inherit; font-size:13px; font-weight:500; color:var(--text-muted); padding:6px 12px; border-radius:6px; cursor:pointer; }
  .seg button.on { background:var(--navy); color:#fff; }
  input[type=date] { font:inherit; font-size:13px; border:1px solid var(--border); border-radius:8px; padding:6px 8px; background:var(--surface); color:var(--text); }

  .kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:18px; }
  .kpi { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .kpi .l { font-size:12px; color:var(--text-muted); font-weight:500; }
  .kpi .v { font-size:24px; font-weight:700; color:var(--navy); margin-top:2px; }
  .kpi .s { font-size:12px; color:var(--text-dim); margin-top:2px; }
  .kpi.warn { background:var(--warn-bg); border-color:#fde68a; }
  .kpi.warn .l, .kpi.warn .v, .kpi.warn .s { color:var(--warn-text); }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .row { display:grid; grid-template-columns:minmax(0,1.3fr) 64px 52px 52px minmax(0,2.3fr) minmax(0,1.3fr) 130px; gap:12px; align-items:center; padding:11px 16px; border-top:1px solid var(--border); }
  .row.head { border-top:0; font-size:11.5px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.3px; background:#f8fafc; }
  .row.item { cursor:pointer; }
  .row.item:hover { background:#f8fafc; }
  .row.item.open { background:var(--accent-bg); }
  .name { font-weight:600; color:var(--navy); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .name .sub { display:block; font-weight:400; font-size:12px; color:var(--text-muted); white-space:normal; }
  .num { font-variant-numeric:tabular-nums; }
  .sub2 { display:block; font-size:11.5px; color:var(--text-dim); }
  .vol { display:flex; align-items:center; gap:10px; }
  .bar { flex:1; height:9px; border-radius:5px; background:#eef2f7; overflow:hidden; display:flex; }
  .bar span { height:100%; }
  .bar .b { background:var(--ok); } .bar .u { background:var(--warn); }
  .vol .n { width:52px; text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
  .trucks { font-size:13px; font-weight:500; }
  .pill { display:inline-block; font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .pill.ok { background:var(--ok-bg); color:var(--ok-text); }
  .pill.warn { background:var(--warn-bg); color:var(--warn-text); }
  .pill.bad { background:var(--bad-bg); color:var(--bad-text); }
  .pill.done { background:#f1f5f9; color:var(--text-muted); }
  .pills { display:flex; flex-wrap:wrap; gap:4px; }

  .detail { background:#fbfcfe; border-top:1px solid var(--border); padding:6px 16px 12px; }
  .detail table { width:100%; border-collapse:collapse; font-size:13px; }
  .detail th { text-align:left; font-size:11.5px; font-weight:600; color:var(--text-muted); padding:8px 8px 6px; }
  .detail td { padding:6px 8px; border-top:1px solid var(--border); vertical-align:top; }
  .detail td.r, .detail th.r { text-align:right; }
  .detail .zero { color:var(--bad-text); font-weight:600; }

  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--text-muted); margin:10px 2px 18px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:-1px; margin-right:5px; }
  .notes { display:flex; gap:8px; flex-wrap:wrap; }
  .note { font-size:12.5px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:7px 11px; color:var(--text-muted); }
  .note.bad { background:var(--bad-bg); border-color:#fecaca; color:var(--bad-text); }
  .note button { font:inherit; color:var(--accent); background:none; border:0; cursor:pointer; font-weight:600; padding:0 0 0 4px; }
  .empty, .err { padding:40px 16px; text-align:center; color:var(--text-muted); }
  .err { color:var(--bad-text); }
  #extra { margin-top:12px; }

  /* ---- Batching sections (clerk / batcher) ---- */
  .namebar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 16px; margin-bottom:14px; font-size:13px; }
  .namebar label { font-weight:600; color:var(--navy); display:flex; align-items:center; gap:8px; }
  .namebar .muted, .muted { color:var(--text-muted); font-size:12.5px; }
  .summary { font-size:13px; color:var(--text-muted); margin:0 2px 12px; }
  .bcard { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .bcard.st-mismatch { border-color:#fecaca; }
  .bhead { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .bcode { font-weight:700; color:var(--navy); font-size:15px; }
  .bstats { font-size:13px; color:var(--text-muted); margin:4px 0 10px; }
  .bform { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .bform label { display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; color:var(--text-muted); }
  .bform .wide { grid-column:1 / -1; }
  .bcard input, .bcard textarea, .bcard select, .namebar input {
    font:inherit; font-size:13.5px; font-weight:400; color:var(--text); background:#fff;
    border:1px solid var(--border2); border-radius:8px; padding:8px 10px; width:100%; }
  .namebar input { width:220px; }
  .bcard input:disabled { background:#f8fafc; color:var(--text-muted); }
  .bcard textarea { resize:vertical; min-height:38px; }
  .bactions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .btn { font:inherit; font-size:13px; font-weight:600; border-radius:8px; padding:8px 14px; cursor:pointer; border:1px solid var(--border2); background:#fff; color:var(--text); }
  .btn.primary { background:var(--navy); border-color:var(--navy); color:#fff; }
  .btn.small { padding:5px 10px; font-size:12px; }
  .saved { font-size:12px; color:var(--text-dim); }
  .saved.bad { color:var(--bad-text); font-weight:600; }
  .inline-err { font-size:12.5px; color:var(--bad-text); font-weight:600; margin-top:8px; }
  .inline-err:empty { display:none; }
  .warnbox { font-size:12.5px; background:var(--warn-bg); color:var(--warn-text); border-radius:8px; padding:7px 10px; margin-bottom:10px; }
  .warnbox.bad { background:var(--bad-bg); color:var(--bad-text); }
  .calls { border-top:1px solid var(--border); margin-top:12px; padding-top:10px; }
  .callform { display:grid; grid-template-columns:150px 1fr auto; gap:8px; }
  .callform select, .callform input { width:100%; }
  .evs { list-style:none; margin-top:8px; font-size:12.5px; }
  .evs li { padding:5px 0; border-top:1px dashed var(--border); color:var(--text-muted); }
  .evs li b { color:var(--text); font-weight:600; }
  .bcard details { margin-top:10px; }
  .bcard summary { cursor:pointer; font-size:12.5px; font-weight:600; color:var(--accent); }
  .bcard .detail { border:1px solid var(--border); border-radius:8px; margin-top:6px; }
  .target { font-family:ui-monospace,Consolas,monospace; background:var(--accent-bg); color:var(--accent); padding:2px 7px; border-radius:6px; font-weight:600; }
  .applyrow td .pill { font-size:11.5px; }

  @media (max-width:640px) {
    .page { padding:16px 16px 48px; }
    .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .kpi .v { font-size:21px; }
    .row.head { display:none; }
    .row { grid-template-columns:1fr auto; gap:6px 10px; padding:12px 14px; }
    .row > .c-name { grid-column:1; }
    .row > .c-status { grid-column:2; grid-row:1; justify-self:end; }
    .row > .c-vol { grid-column:1 / -1; }
    .row > .c-ships, .row > .c-drops, .row > .c-fill { display:none; }
    .row > .c-trucks { grid-column:1 / -1; font-size:12.5px; color:var(--text-muted); }
    .row > .c-trucks::before { content:attr(data-m); }
    .detail { padding:4px 8px 10px; }
    .detail .hide-m { display:none; }
    .detail td { padding:6px 5px; overflow-wrap:anywhere; font-size:12.5px; }
    .detail th { padding:8px 5px 6px; }
    .bform { grid-template-columns:1fr; }
    .callform { grid-template-columns:1fr auto; }
    .callform input { grid-column:1 / -1; grid-row:2; }
    .namebar input { width:100%; }
    .namebar label { flex:1; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="top">
    <div>
      <h1>Load board</h1>
      <div class="sync" id="sync">Loading…</div>
      <div class="sync">New, sign-in: <a href="batcher.html">Batcher</a> · <a href="clerk.html">Logistics clerk</a></div>
    </div>
    <div class="controls">
      <div class="seg" id="sectionSeg">
        <button data-section="overview" class="on">Overview</button>
        <button data-section="clerk">Logistics clerk</button>
        <button data-section="batcher">Batcher</button>
      </div>
      <div class="seg" id="daySeg">
        <button data-day="0" class="on">Today</button>
        <button data-day="1">Tomorrow</button>
      </div>
      <input type="date" id="datePick" aria-label="Pick a date">
      <div class="seg" id="viewSeg">
        <button data-view="zone" class="on">By zone</button>
        <button data-view="trucker">By trucker</button>
      </div>
    </div>
  </div>

  <div id="overview">
    <div class="kpis" id="kpis"></div>
    <div class="card" id="board"><div class="empty">Loading shipments…</div></div>
    <div class="legend" id="legend"></div>
    <div class="notes" id="notes"></div>
    <div id="extra"></div>
  </div>
  <div id="batching" hidden></div>
  <datalist id="shipViaList"></datalist>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Supabase client. Named `sb`, never `supabase`: the CDN script above
  // defines `supabase` as the library itself.
  const SUPABASE_URL = 'https://hzagwndglwhcepsirafi.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_5rAinfDT1K9kwEQnqYwlOA_-C5tk_6h';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, { auth: { persistSession: false } });
</script>
<script>
  const MAX_DROPS = 10;
  const REFRESH_MS = 60 * 1000;
  const STALE_MIN = 15;
  const JM_OFFSET_H = -5; // Jamaica, no DST
  // Placeholder ShipVia codes the batcher uses to group shipments before a
  // haulage contractor is confirmed. Anything matching is "batched, awaiting
  // contractor", never a real trucker.
  const BATCH_RE = /^BATCH/i;
  function isBatch(v) { return !!v && BATCH_RE.test(v); }
  // Assigned directly by design, never through a batch or the clerk: customer
  // pickups (PICKUP…) and DFL's own vehicles (any code containing DFL, e.g.
  // DFLVAN02, DFL TRUCK 1, CU3717DFL5TON). Left out of the batcher's
  // "assigned outside a batch" count.
  const DIRECT_OK_RE = /^PICKUP|DFL/i;
  function isDirectOk(v) { return !!v && DIRECT_OK_RE.test(v); }

  const LB = {
    section: 'overview', date: null, view: 'zone', open: null,
    truckTypes: [], rows: [], receipts: 0, stragglers: [], lastSync: null,
    showStragglers: false, showZero: false,
    codes: [], assignments: [], events: [], pendingRender: false,
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
  function fmt(n) { return Math.round(n || 0).toLocaleString('en-US'); }
  function vol(r) { return Number(r.shipped_volume) || 0; }

  // Fill: what this shipment carries vs. what the customer was still owed.
  // Ordered qty covers the whole order, so on a partly-shipped order it would
  // make every later shipment look short. Instead:
  //   not yet Completed -> owed = unshipped_qty (still includes this shipment)
  //   Completed         -> owed = shipped + unshipped_qty (unshipped has
  //                        already dropped by this shipment's qty)
  // Null when the order quantities aren't known.
  function owed(r) {
    if (r.unshipped_qty == null || r.order_shipped_qty == null) return null;
    const u = Number(r.unshipped_qty), s = Number(r.order_shipped_qty);
    return r.status === 'Completed' ? s + u : u;
  }
  function shortBy(r) {
    const o = owed(r);
    return o == null ? 0 : Math.max(0, o - Number(r.order_shipped_qty));
  }
  function fillPct(shipped, owedQty) {
    return owedQty > 0 ? Math.min(100, Math.round((shipped / owedQty) * 100)) : null;
  }

  function jmDate(offsetDays) {
    const d = new Date(Date.now() + JM_OFFSET_H * 3600e3);
    d.setUTCDate(d.getUTCDate() + offsetDays);
    return d.toISOString().split('T')[0];
  }
  function niceDate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', timeZone:'UTC' });
  }

  // ------------------------------------------------------------
  // Best fit: fewest trucks that carry `volume` and make `drops` stops at
  // MAX_DROPS per truck; among equal counts, the smallest total capacity.
  // Returns [{ type, count }] largest first, or null if nothing fits.
  // ------------------------------------------------------------
  function bestFit(volume, drops) {
    const types = LB.truckTypes;
    if (!types.length) return null;
    const maxCap = types[types.length - 1].capacity_volume;
    const minK = Math.max(1, Math.ceil(drops / MAX_DROPS), Math.ceil(volume / maxCap));

    for (let k = minK; k <= minK + 20; k++) {
      let best = null;
      const counts = new Array(types.length).fill(0);
      (function walk(i, left, cap) {
        if (i === types.length - 1) {
          const total = cap + left * types[i].capacity_volume;
          if (total >= volume && (!best || total < best.total)) {
            counts[i] = left;
            best = { total, counts: counts.slice() };
          }
          counts[i] = 0;
          return;
        }
        for (let c = 0; c <= left; c++) {
          counts[i] = c;
          walk(i + 1, left - c, cap + c * types[i].capacity_volume);
        }
        counts[i] = 0;
      })(0, k, 0);
      if (best) {
        return best.counts
          .map((count, i) => ({ type: types[i], count }))
          .filter(x => x.count > 0)
          .reverse();
      }
    }
    return null;
  }
  function fitLabel(fit) {
    if (!fit) return '—';
    return fit.map(x => (x.count > 1 ? x.count + ' × ' : '') + x.type.name).join(' + ');
  }
  function fitCount(fit) { return fit ? fit.reduce((s, x) => s + x.count, 0) : 0; }

  // ------------------------------------------------------------
  // Data
  // ------------------------------------------------------------
  async function loadTruckTypes() {
    const { data, error } = await sb.from('truck_types')
      .select('name, capacity_volume, sort_order')
      .eq('active', true)
      .order('capacity_volume', { ascending: true });
    if (error) throw error;
    LB.truckTypes = (data || []).map(t => ({ ...t, capacity_volume: Number(t.capacity_volume) }));
  }

  async function loadData() {
    const today = jmDate(0);
    const cols = 'shipment_nbr,status,shipment_date,customer_id,customer_name,shipping_zone,ship_via,shipped_volume,shipped_qty,salesperson_name,order_type,order_nbr,ordered_qty,unshipped_qty,order_shipped_qty';
    // Outbound = an Issue that isn't from an RC (return) order. Every RC seen
    // so far is also a Receipt; checking both guards against one that isn't.
    const NOT_RC = 'order_type.is.null,order_type.neq.RC';
    const [day, rec, strag, sync] = await Promise.all([
      // A day is ~200 shipments; well under PostgREST's 1000-row cap.
      sb.from('shipments').select(cols).eq('shipment_date', LB.date).eq('operation', 'Issue').or(NOT_RC).range(0, 999),
      sb.from('shipments').select('shipment_nbr', { count: 'exact', head: true }).eq('shipment_date', LB.date).or('operation.eq.Receipt,order_type.eq.RC'),
      sb.from('shipments').select(cols).eq('operation', 'Issue').or(NOT_RC).neq('status', 'Completed').lt('shipment_date', today).order('shipment_date'),
      sb.from('shipments').select('synced_at').order('synced_at', { ascending: false }).limit(1),
    ]);
    for (const r of [day, rec, strag, sync]) if (r.error) throw r.error;
    LB.rows = day.data || [];
    LB.receipts = rec.count || 0;
    LB.stragglers = strag.data || [];
    LB.lastSync = sync.data && sync.data[0] ? new Date(sync.data[0].synced_at) : null;
    await loadAssignments();
  }

  async function loadAssignments() {
    const { data, error } = await sb.from('batch_assignments').select('*').eq('shipment_date', LB.date);
    if (error) throw error;
    LB.assignments = data || [];
    const ids = LB.assignments.map(a => a.id);
    if (!ids.length) { LB.events = []; return; }
    const ev = await sb.from('batch_events').select('*').in('assignment_id', ids).order('created_at', { ascending: false });
    if (ev.error) throw ev.error;
    LB.events = ev.data || [];
  }

  async function loadCodes() {
    const { data, error } = await sb.from('ship_via_codes').select('ship_via, description').order('ship_via').range(0, 999);
    if (error) throw error;
    LB.codes = data || [];
    document.getElementById('shipViaList').innerHTML = LB.codes
      .filter(c => !isBatch(c.ship_via))
      .map(c => `<option value="${esc(c.ship_via)}">${esc(c.description || '')}</option>`).join('');
  }
  function codeInfo(v) { return LB.codes.find(c => c.ship_via === v) || null; }

  // Group shipments by a key; drops = distinct customers in the group.
  function group(rows, keyFn) {
    const m = new Map();
    for (const r of rows) {
      const k = keyFn(r);
      if (!m.has(k)) m.set(k, { key: k, rows: [], vol: 0, unbVol: 0, unb: 0, done: 0, zero: 0, customers: new Set(), zones: new Set(), shipped: 0, owed: 0, short: 0 });
      const g = m.get(k);
      g.rows.push(r);
      g.vol += vol(r);
      if (!r.ship_via) { g.unb++; g.unbVol += vol(r); }
      if (r.status === 'Completed') g.done++;
      if (!vol(r)) g.zero++;
      g.customers.add(r.customer_id || r.shipment_nbr);
      g.zones.add(r.shipping_zone || 'No zone');
      const o = owed(r);
      if (o != null) { g.owed += o; g.shipped += Number(r.order_shipped_qty); }
      if (shortBy(r) > 0) g.short++;
    }
    return [...m.values()].map(g => ({ ...g, drops: g.customers.size })).sort((a, b) => b.vol - a.vol);
  }

  // ------------------------------------------------------------
  // Render
  // ------------------------------------------------------------
  function renderSync() {
    const el = document.getElementById('sync');
    if (!LB.lastSync) { el.textContent = 'Not synced yet'; return; }
    const mins = Math.round((Date.now() - LB.lastSync.getTime()) / 60000);
    const when = mins < 1 ? 'just now' : mins + ' min ago';
    el.textContent = niceDate(LB.date) + ' · Synced from Acumatica ' + when;
    el.classList.toggle('stale', mins > STALE_MIN);
    if (mins > STALE_MIN) el.textContent += ' — data may be out of date';
  }

  function renderKpis(zones) {
    const rows = LB.rows;
    const total = rows.reduce((s, r) => s + vol(r), 0);
    const unb = rows.filter(r => !r.ship_via);
    const unbVol = unb.reduce((s, r) => s + vol(r), 0);
    const done = rows.filter(r => r.status === 'Completed').length;
    const trucks = zones.reduce((s, z) => s + fitCount(z.fit), 0);
    document.getElementById('kpis').innerHTML = `
      <div class="kpi"><div class="l">Shipments</div><div class="v num">${fmt(rows.length)}</div><div class="s">${fmt(done)} completed</div></div>
      <div class="kpi"><div class="l">Volume</div><div class="v num">${fmt(total)}</div><div class="s">across ${zones.length} zone${zones.length === 1 ? '' : 's'}</div></div>
      <div class="kpi"><div class="l">Trucks needed</div><div class="v num">${fmt(trucks)}</div><div class="s">best fit per zone</div></div>
      <div class="kpi ${unb.length ? 'warn' : ''}"><div class="l">Not batched</div><div class="v num">${fmt(unb.length)}</div><div class="s">${unb.length ? fmt(unbVol) + ' volume' : 'all assigned'}</div></div>`;
  }

  function volCell(g, maxVol) {
    const bw = maxVol ? ((g.vol - g.unbVol) / maxVol) * 100 : 0;
    const uw = maxVol ? (g.unbVol / maxVol) * 100 : 0;
    return `<div class="vol"><div class="bar"><span class="b" style="width:${bw}%"></span><span class="u" style="width:${uw}%"></span></div><span class="n">${fmt(g.vol)}</span></div>`;
  }

  function statusPill(g) {
    if (g.unb) return `<span class="pill warn">${g.unb} not batched</span>`;
    if (g.done === g.rows.length) return `<span class="pill done">Completed</span>`;
    return `<span class="pill ok">All batched</span>`;
  }

  function fillCell(g) {
    const p = fillPct(g.shipped, g.owed);
    if (p == null) return '<span class="num c-fill" style="color:var(--text-dim)">—</span>';
    const color = p >= 95 ? 'var(--ok-text)' : p >= 85 ? 'var(--warn-text)' : 'var(--bad-text)';
    return `<span class="num c-fill" style="font-weight:600;color:${color}">${p}%<span class="sub2">${g.short} short</span></span>`;
  }
  function fillText(g) {
    const p = fillPct(g.shipped, g.owed);
    return p == null ? '' : ` · ${p}% fill`;
  }

  // "shipped / owed", red when short. The tooltip carries the order detail.
  function qtyCell(r) {
    const o = owed(r);
    if (o == null) return '—';
    const s = Number(r.order_shipped_qty);
    const tip = `Order ${r.order_nbr || '?'} · ordered ${fmt(r.ordered_qty)} · owed ${fmt(o)} · shipped ${fmt(s)}`;
    return `<span title="${esc(tip)}" style="${shortBy(r) ? 'color:var(--bad-text);font-weight:600' : ''}">${fmt(s)} / ${fmt(o)}</span>`;
  }

  function detailTable(rows, groupCol) {
    const sorted = rows.slice().sort((a, b) => (a.ship_via ? 1 : 0) - (b.ship_via ? 1 : 0) || vol(b) - vol(a));
    const otherHead = groupCol === 'zone' ? 'Ship via' : 'Zone';
    return `<div class="detail"><table>
      <thead><tr><th>Shipment</th><th>Customer</th><th class="r">Volume</th><th class="r">Qty</th><th>${otherHead}</th><th class="hide-m">Status</th></tr></thead>
      <tbody>${sorted.map(r => {
        const other = groupCol === 'zone'
          ? (r.ship_via ? esc(r.ship_via) : '<span class="pill warn">Not batched</span>')
          : esc(r.shipping_zone || '—');
        return `<tr>
          <td class="num">${esc(r.shipment_nbr)}</td>
          <td>${esc(r.customer_name || r.customer_id)}</td>
          <td class="r num ${vol(r) ? '' : 'zero'}">${vol(r) ? fmt(vol(r)) : '0'}</td>
          <td class="r num">${qtyCell(r)}</td>
          <td>${other}</td>
          <td class="hide-m">${esc(r.status)}</td></tr>`;
      }).join('')}</tbody></table></div>`;
  }

  function renderZones(zones) {
    const maxVol = Math.max(0, ...zones.map(z => z.vol));
    const head = `<div class="row head"><span>Zone</span><span>Ships</span><span>Drops</span><span>Fill</span><span>Volume · batched vs not</span><span>Trucks needed</span><span>Status</span></div>`;
    const body = zones.map(z => {
      const open = LB.open === 'z:' + z.key;
      return `<div class="row item ${open ? 'open' : ''}" data-open="z:${esc(z.key)}">
          <span class="name c-name">${esc(z.key)}</span>
          <span class="num c-ships">${z.rows.length}<span class="sub2">${z.done} done</span></span>
          <span class="num c-drops">${z.drops}</span>
          ${fillCell(z)}
          <span class="c-vol">${volCell(z, maxVol)}</span>
          <span class="trucks c-trucks" data-m="${z.rows.length} ship${z.rows.length === 1 ? '' : 's'} · ${z.drops} drop${z.drops === 1 ? '' : 's'}${fillText(z)} · ">${esc(fitLabel(z.fit))}</span>
          <span class="c-status">${statusPill(z)}</span>
        </div>${open ? detailTable(z.rows, 'zone') : ''}`;
    }).join('');
    return head + body;
  }

  function renderTruckers() {
    const maxCap = LB.truckTypes.length ? LB.truckTypes[LB.truckTypes.length - 1] : null;
    const truckers = group(LB.rows, r => r.ship_via || '');
    const unbatched = truckers.filter(t => t.key === '');
    const assigned = truckers.filter(t => t.key !== '');
    const all = unbatched.concat(assigned);
    const maxVol = Math.max(0, ...all.map(t => t.vol));

    const head = `<div class="row head"><span>Trucker (ship via)</span><span>Ships</span><span>Drops</span><span>Fill</span><span>Volume</span><span>Zones</span><span>Checks</span></div>`;
    const body = all.map(t => {
      const open = LB.open === 't:' + t.key;
      const flags = [];
      if (t.key === '') flags.push('<span class="pill warn">Not batched</span>');
      else if (isBatch(t.key)) {
        const a = LB.assignments.find(x => x.batch_code === t.key);
        flags.push(a && a.confirmed_at
          ? `<span class="pill ok">Confirmed · ${esc(a.ship_via)}</span>`
          : '<span class="pill warn">Needs contractor</span>');
        if (t.drops > MAX_DROPS) flags.push(`<span class="pill bad">${t.drops} drops (max ${MAX_DROPS})</span>`);
        if (maxCap && t.vol > maxCap.capacity_volume) flags.push(`<span class="pill bad">Over ${esc(maxCap.name)} capacity</span>`);
      } else {
        if (t.drops > MAX_DROPS) flags.push(`<span class="pill bad">${t.drops} drops (max ${MAX_DROPS})</span>`);
        if (maxCap && t.vol > maxCap.capacity_volume) flags.push(`<span class="pill bad">Over ${esc(maxCap.name)} capacity</span>`);
        if (!flags.length) flags.push(t.done === t.rows.length ? '<span class="pill done">Completed</span>' : '<span class="pill ok">OK</span>');
      }
      const zones = [...t.zones].sort();
      return `<div class="row item ${open ? 'open' : ''}" data-open="t:${esc(t.key)}">
          <span class="name c-name">${t.key ? esc(t.key) : 'Not batched'}</span>
          <span class="num c-ships">${t.rows.length}<span class="sub2">${t.done} done</span></span>
          <span class="num c-drops">${t.drops}</span>
          ${fillCell(t)}
          <span class="c-vol">${volCell(t, maxVol)}</span>
          <span class="c-trucks" data-m="${t.drops} drop${t.drops === 1 ? '' : 's'}${fillText(t)} · " style="font-size:12.5px;color:var(--text-muted)">${esc(zones.slice(0, 4).join(', '))}${zones.length > 4 ? ' +' + (zones.length - 4) : ''}</span>
          <span class="c-status pills">${flags.join('')}</span>
        </div>${open ? detailTable(t.rows, 'trucker') : ''}`;
    }).join('');
    return head + body;
  }

  function renderNotes() {
    const zero = LB.rows.filter(r => !vol(r));
    const notes = [];
    if (zero.length) notes.push(`<span class="note bad">${zero.length} shipment${zero.length === 1 ? '' : 's'} with 0 volume — check in Acumatica<button data-toggle="zero">${LB.showZero ? 'Hide' : 'Show'}</button></span>`);
    if (LB.stragglers.length) notes.push(`<span class="note">${LB.stragglers.length} still open from earlier dates<button data-toggle="strag">${LB.showStragglers ? 'Hide' : 'Show'}</button></span>`);
    if (LB.receipts) notes.push(`<span class="note">${LB.receipts} return${LB.receipts === 1 ? '' : 's'} (RC) excluded</span>`);
    notes.push(`<span class="note">Drops = distinct customers · max ${MAX_DROPS} per truck</span>`);
    document.getElementById('notes').innerHTML = notes.join('');

    const extra = [];
    if (LB.showZero && zero.length) extra.push(`<div class="card" style="margin-top:10px">${detailTable(zero, 'zone').replace('class="detail"', 'class="detail" style="border-top:0"')}</div>`);
    if (LB.showStragglers && LB.stragglers.length) {
      extra.push(`<div class="card" style="margin-top:10px"><div class="detail" style="border-top:0"><table>
        <thead><tr><th>Date</th><th>Shipment</th><th>Customer</th><th>Zone</th><th class="r">Volume</th><th class="hide-m">Status</th></tr></thead>
        <tbody>${LB.stragglers.map(r => `<tr><td>${esc(niceDate(r.shipment_date))}</td><td class="num">${esc(r.shipment_nbr)}</td><td>${esc(r.customer_name || r.customer_id)}</td><td>${esc(r.shipping_zone || '—')}</td><td class="r num">${fmt(vol(r))}</td><td class="hide-m">${esc(r.status)}</td></tr>`).join('')}</tbody>
      </table></div></div>`);
    }
    document.getElementById('extra').innerHTML = extra.join('');
  }

  function render() {
    renderSync();
    LB.pendingRender = false;
    const overview = LB.section === 'overview';
    document.getElementById('overview').hidden = !overview;
    document.getElementById('batching').hidden = overview;
    document.getElementById('viewSeg').style.display = overview ? '' : 'none';
    if (!overview) { renderBatching(); return; }

    const zones = group(LB.rows, r => r.shipping_zone || 'No zone');
    // Zero-volume shipments still need a stop, so they count as drops.
    zones.forEach(z => { z.fit = bestFit(z.vol, z.drops); });
    renderKpis(zones);

    const board = document.getElementById('board');
    if (!LB.rows.length) {
      board.innerHTML = `<div class="empty">No shipments for ${esc(niceDate(LB.date))} yet.</div>`;
    } else {
      board.innerHTML = LB.view === 'zone' ? renderZones(zones) : renderTruckers();
    }

    document.getElementById('legend').innerHTML = LB.rows.length
      ? `<span><i style="background:var(--ok)"></i>Batched</span><span><i style="background:var(--warn)"></i>Not batched</span><span>Bar length = volume vs. the biggest ${LB.view === 'zone' ? 'zone' : 'trucker'}</span>` +
        (LB.view === 'zone' ? `<span>Trucks: ${LB.truckTypes.map(t => esc(t.name) + ' ' + fmt(t.capacity_volume)).join(' · ')}</span>` : '')
      : '';
    renderNotes();
  }

  async function refresh() {
    try {
      await loadData();
      // Don't rebuild the clerk's form under their cursor; catch up on blur.
      if (isEditing()) { LB.pendingRender = true; renderSync(); return; }
      render();
    } catch (err) {
      console.error('[load-board]', err);
      const msg = `<div class="err">Couldn't load shipments. ${esc(err.message || err)}</div>`;
      document.getElementById(LB.section === 'overview' ? 'board' : 'batching').innerHTML = msg;
    }
  }

  // ------------------------------------------------------------
  // Batching: logistics clerk + batcher
  // ------------------------------------------------------------
  // Duties are split on purpose. The batcher groups shipments under a BATCHnn
  // placeholder in Acumatica but never chooses the contractor. The clerk
  // sources and confirms a contractor here. The batcher then applies that
  // ShipVia in Acumatica, and the sync shows whether what was applied matches
  // what was confirmed. The batcher's section is read-only.
  //
  // Batch status, for a confirmed assignment, is judged against the shipment
  // list frozen at confirmation (confirmed_shipments), because once the batcher
  // applies the real ShipVia those shipments no longer carry the BATCH code:
  //   applied   every confirmed shipment now has the confirmed ShipVia
  //   mismatch  any confirmed shipment has some OTHER real ShipVia
  //   confirmed waiting for the batcher (some still on the placeholder)
  // plus a warning when shipments joined the batch after confirmation.

  function getName() { try { return localStorage.getItem('lb-name') || ''; } catch (e) { return ''; } }
  function setName(v) { try { localStorage.setItem('lb-name', v); } catch (e) {} }

  function batchList() {
    const byNbr = new Map(LB.rows.map(r => [r.shipment_nbr, r]));
    const codes = new Set(LB.rows.filter(r => isBatch(r.ship_via)).map(r => r.ship_via));
    LB.assignments.forEach(a => codes.add(a.batch_code));
    return [...codes].sort((x, y) => x.localeCompare(y, undefined, { numeric: true })).map(code => {
      const rows = LB.rows.filter(r => r.ship_via === code);
      const g = group(rows, () => code)[0] || { rows: [], vol: 0, drops: 0, zones: new Set() };
      const a = LB.assignments.find(x => x.batch_code === code) || null;
      const b = { code, a, rows, vol: g.vol, drops: g.drops, zones: [...g.zones].sort(), fit: bestFit(g.vol, g.drops) };
      if (a && a.confirmed_at) {
        const snap = a.confirmed_shipments || [];
        b.snapRows = snap.map(n => byNbr.get(n) || { shipment_nbr: n, missing: true });
        b.applied = b.snapRows.filter(r => r.ship_via === a.ship_via).length;
        b.mismatch = b.snapRows.filter(r => r.ship_via && r.ship_via !== a.ship_via && r.ship_via !== code);
        b.added = rows.filter(r => !snap.includes(r.shipment_nbr));
        b.status = b.mismatch.length ? 'mismatch'
          : (b.applied === snap.length && !b.added.length) ? 'applied' : 'confirmed';
        // Once applied, shipments leave the placeholder, so describe the batch
        // by what was confirmed (plus late additions), not what's left on it.
        b.rows = b.snapRows.filter(r => !r.missing).concat(b.added);
        const cg = group(b.rows, () => code)[0];
        if (cg) Object.assign(b, { vol: cg.vol, drops: cg.drops, zones: [...cg.zones].sort(), fit: bestFit(cg.vol, cg.drops) });
      } else {
        b.status = rows.length ? 'open' : 'empty';
      }
      return b;
    });
  }

  function batchPill(b) {
    return {
      open:      '<span class="pill warn">Needs contractor</span>',
      empty:     '<span class="pill done">No shipments</span>',
      confirmed: '<span class="pill ok">Confirmed · to apply</span>',
      applied:   '<span class="pill done">Applied in Acumatica</span>',
      mismatch:  '<span class="pill bad">Mismatch</span>',
    }[b.status];
  }

  function stamp(iso) {
    return new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  function batchWarnings(b) {
    const w = [];
    if (b.drops > MAX_DROPS) w.push(`${b.drops} drops — over the ${MAX_DROPS}-drop limit for one truck.`);
    const maxCap = LB.truckTypes[LB.truckTypes.length - 1];
    if (maxCap && b.vol > maxCap.capacity_volume) w.push(`${fmt(b.vol)} volume — more than one ${esc(maxCap.name)} holds.`);
    if (b.added && b.added.length) w.push(`${b.added.length} shipment${b.added.length === 1 ? '' : 's'} joined this batch after it was confirmed.`);
    if (b.mismatch && b.mismatch.length) {
      const got = [...new Set(b.mismatch.map(r => r.ship_via))].join(', ');
      return `<div class="warnbox bad">Applied ShipVia <b>${esc(got)}</b> doesn't match the confirmed <b>${esc(b.a.ship_via)}</b> on ${b.mismatch.length} shipment${b.mismatch.length === 1 ? '' : 's'}.</div>` +
        (w.length ? `<div class="warnbox">${w.join(' ')}</div>` : '');
    }
    return w.length ? `<div class="warnbox">${w.join(' ')}</div>` : '';
  }

  function clerkCard(b) {
    const a = b.a || {};
    const locked = !!a.confirmed_at;
    const evs = LB.events.filter(e => e.assignment_id === a.id);
    const stats = b.rows.length
      ? `${b.rows.length} shipment${b.rows.length === 1 ? '' : 's'} · ${b.drops} drop${b.drops === 1 ? '' : 's'} · ${fmt(b.vol)} volume · suggested truck: <b>${esc(fitLabel(b.fit))}</b>`
      : 'No shipments on this placeholder right now.';
    return `<div class="bcard st-${b.status}" data-code="${esc(b.code)}">
      <div class="bhead"><div><span class="bcode">${esc(b.code)}</span> <span class="muted">${esc(b.zones.join(', '))}</span></div>${batchPill(b)}</div>
      <div class="bstats">${stats}</div>
      ${batchWarnings(b)}
      <div class="bform">
        <label>Contractor's Ship Via
          <input data-f="ship_via" list="shipViaList" value="${esc(a.ship_via || '')}" placeholder="Start typing a code or name" autocomplete="off" ${locked ? 'disabled' : ''}></label>
        <label>Contractor
          <input data-f="contractor" value="${esc(a.contractor || '')}" placeholder="Name, as confirmed on the call" ${locked ? 'disabled' : ''}></label>
        <label class="wide">Notes
          <textarea data-f="notes" rows="2" placeholder="Rate agreed, pickup time, driver phone…">${esc(a.notes || '')}</textarea></label>
      </div>
      <div class="bactions">
        ${locked
          ? `<span class="muted">Confirmed by <b>${esc(a.confirmed_by || '?')}</b>, ${esc(stamp(a.confirmed_at))}</span><button class="btn small" data-act="unconfirm">Undo confirmation</button>`
          : `<button class="btn primary" data-act="confirm">Confirm contractor</button>`}
        <span class="saved" data-saved>${a.updated_at ? 'Saved ' + esc(stamp(a.updated_at)) : ''}</span>
      </div>
      <div class="inline-err" data-err></div>
      <div class="calls">
        <div class="callform">
          <select data-call="outcome" aria-label="Call outcome">
            <option>No answer</option><option>Declined</option><option>Left message</option><option>Accepted</option>
          </select>
          <input data-call="note" placeholder="Who you called, what they said">
          <button class="btn small" data-act="call">Log call</button>
        </div>
        ${evs.length ? `<ul class="evs">${evs.map(e => `<li><b>${esc(e.kind === 'call' ? (e.outcome || 'Call') : e.kind === 'confirm' ? 'Confirmed' : e.kind === 'unconfirm' ? 'Confirmation undone' : 'Edit')}</b>
          ${e.ship_via ? ' · ' + esc(e.ship_via) : ''}${e.contractor ? ' · ' + esc(e.contractor) : ''}${e.note ? ' — ' + esc(e.note) : ''}
          <span style="float:right">${esc(e.entered_by || '?')}, ${esc(stamp(e.created_at))}</span></li>`).join('')}</ul>` : ''}
      </div>
      ${b.rows.length ? `<details><summary>Shipments in this batch</summary>${detailTable(b.rows, 'zone')}</details>` : ''}
    </div>`;
  }

  function batcherCard(b) {
    const a = b.a;
    const info = codeInfo(a.ship_via);
    const rows = b.snapRows.map(r => {
      let st;
      if (r.missing) st = '<span class="pill done">Not on this date</span>';
      else if (r.ship_via === a.ship_via) st = '<span class="pill ok">Applied</span>';
      else if (r.ship_via === b.code) st = '<span class="pill warn">To do</span>';
      else st = `<span class="pill bad">${esc(r.ship_via || 'Cleared')}</span>`;
      return `<tr class="applyrow"><td class="num">${esc(r.shipment_nbr)}</td><td>${esc(r.customer_name || '—')}</td><td class="hide-m">${esc(r.shipping_zone || '—')}</td><td>${st}</td></tr>`;
    }).join('');
    const nbrs = b.snapRows.map(r => r.shipment_nbr).join(', ');
    return `<div class="bcard st-${b.status}" data-code="${esc(b.code)}">
      <div class="bhead"><div><span class="bcode">${esc(b.code)}</span> → <span class="target">${esc(a.ship_via)}</span>
        <span class="muted">${esc(a.contractor || (info && info.description) || '')}</span></div>${batchPill(b)}</div>
      <div class="bstats">Set ShipVia to <b>${esc(a.ship_via)}</b> on these ${b.snapRows.length} shipments in Acumatica · ${b.applied} of ${b.snapRows.length} done ·
        confirmed by ${esc(a.confirmed_by || '?')}, ${esc(stamp(a.confirmed_at))}</div>
      ${batchWarnings(b)}
      ${a.notes ? `<div class="muted" style="margin-bottom:8px">Clerk's notes: ${esc(a.notes)}</div>` : ''}
      <div class="bactions" style="margin:0 0 8px">
        <button class="btn small" data-copy="${esc(a.ship_via)}">Copy Ship Via</button>
        <button class="btn small" data-copy="${esc(nbrs)}">Copy shipment numbers</button>
      </div>
      <div class="detail" style="border-top:0;padding:0"><table>
        <thead><tr><th>Shipment</th><th>Customer</th><th class="hide-m">Zone</th><th>In Acumatica</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>`;
  }

  function renderBatching() {
    const el = document.getElementById('batching');
    const batches = batchList();
    const clerk = LB.section === 'clerk';
    const count = s => batches.filter(b => b.status === s).length;
    const summary = batches.length
      ? `${batches.length} batch${batches.length === 1 ? '' : 'es'} for ${esc(niceDate(LB.date))} · ${count('open')} need a contractor · ${count('confirmed')} to apply · ${count('applied')} applied` + (count('mismatch') ? ` · <b style="color:var(--bad-text)">${count('mismatch')} mismatch</b>` : '')
      : `No <b>BATCH</b> placeholders on shipments for ${esc(niceDate(LB.date))} yet. The batcher groups shipments by setting their ShipVia to BATCH01, BATCH02… in Acumatica.`;

    let body;
    if (clerk) {
      const nameBar = `<div class="namebar"><label>Your name <input id="lbName" value="${esc(getName())}" placeholder="For the audit trail"></label>
        <span class="muted">Remembered on this device. Every call and confirmation is logged with it.</span></div>`;
      const list = batches.filter(b => b.status !== 'empty' || b.a);
      body = nameBar + `<div class="summary">${summary}</div>` + (list.length ? list.map(clerkCard).join('') : '');
    } else {
      const done = batches.filter(b => ['confirmed', 'mismatch', 'applied'].includes(b.status))
        .sort((x, y) => ({ mismatch: 0, confirmed: 1, applied: 2 }[x.status] - { mismatch: 0, confirmed: 1, applied: 2 }[y.status]));
      const waiting = batches.filter(b => b.status === 'open');
      const inBatches = new Set(batches.flatMap(b => (b.a && b.a.confirmed_shipments) || []));
      const direct = LB.rows.filter(r => r.ship_via && !isBatch(r.ship_via) && !isDirectOk(r.ship_via) && !inBatches.has(r.shipment_nbr));
      body = `<div class="summary">${summary}</div>` +
        (waiting.length ? `<div class="note" style="margin-bottom:12px">Waiting on the clerk: ${waiting.map(b => `<b>${esc(b.code)}</b> (${b.rows.length})`).join(', ')}</div>` : '') +
        done.map(batcherCard).join('') +
        (direct.length ? `<div class="note" style="margin-top:4px">${direct.length} shipment${direct.length === 1 ? '' : 's'} on this date got a contractor directly, not through a batch (pickups and DFL vehicles not counted).</div>` : '');
    }
    el.innerHTML = body;
  }

  // ---- Clerk actions ----
  const saveTimers = new Map();
  let saving = Promise.resolve();

  function cardFor(code) { return document.querySelector(`#batching .bcard[data-code="${CSS.escape(code)}"]`); }
  function cardErr(code, msg) { const c = cardFor(code); if (c) c.querySelector('[data-err]').textContent = msg || ''; }
  function fieldVals(card) {
    const v = f => { const el = card.querySelector(`[data-f="${f}"]`); return el ? el.value.trim() || null : null; };
    return { ship_via: v('ship_via'), contractor: v('contractor'), notes: v('notes') };
  }

  // Upsert this batch's assignment from the card's current fields plus `patch`.
  function saveAssignment(code, patch) {
    clearTimeout(saveTimers.get(code));
    saveTimers.delete(code);
    const card = cardFor(code);
    const savedEl = card && card.querySelector('[data-saved]');
    if (savedEl) { savedEl.textContent = 'Saving…'; savedEl.classList.remove('bad'); }
    const row = { shipment_date: LB.date, batch_code: code, updated_by: getName() || null, ...(card ? fieldVals(card) : {}), ...(patch || {}) };
    const p = saving.then(async () => {
      const { data, error } = await sb.from('batch_assignments')
        .upsert(row, { onConflict: 'shipment_date,batch_code' }).select().single();
      if (error) throw error;
      const i = LB.assignments.findIndex(a => a.id === data.id);
      if (i >= 0) LB.assignments[i] = data; else LB.assignments.push(data);
      const el = cardFor(code) && cardFor(code).querySelector('[data-saved]');
      if (el) el.textContent = 'Saved ' + stamp(data.updated_at);
      return data;
    }).catch(err => {
      console.error('[load-board] save', err);
      const el = cardFor(code) && cardFor(code).querySelector('[data-saved]');
      if (el) { el.textContent = 'Not saved — ' + (err.message || err); el.classList.add('bad'); }
      throw err;
    });
    saving = p.catch(() => {});
    return p;
  }

  function scheduleSave(code) {
    clearTimeout(saveTimers.get(code));
    const card = cardFor(code);
    const el = card && card.querySelector('[data-saved]');
    if (el) el.textContent = 'Editing…';
    saveTimers.set(code, setTimeout(() => saveAssignment(code).catch(() => {}), 800));
  }

  async function flushSaves() {
    for (const code of [...saveTimers.keys()]) await saveAssignment(code).catch(() => {});
    await saving;
  }

  async function logEvent(assignmentId, ev) {
    const { error } = await sb.from('batch_events').insert({ assignment_id: assignmentId, entered_by: getName() || null, ...ev });
    if (error) throw error;
  }

  async function clerkAction(code, act) {
    cardErr(code, '');
    const name = getName();
    if (!name) { cardErr(code, 'Enter your name at the top first — it goes on the audit trail.'); document.getElementById('lbName')?.focus(); return; }
    const card = cardFor(code);
    const vals = fieldVals(card);
    const b = batchList().find(x => x.code === code);
    try {
      if (act === 'confirm') {
        if (!vals.ship_via) return cardErr(code, "Enter the contractor's Ship Via code.");
        if (isBatch(vals.ship_via)) return cardErr(code, `${vals.ship_via} is a placeholder, not a contractor.`);
        if (!codeInfo(vals.ship_via)) return cardErr(code, `${vals.ship_via} isn't a Ship Via code in Acumatica. Pick one from the list.`);
        if (!b.rows.length) return cardErr(code, 'This batch has no shipments on it right now.');
        const snap = b.rows.map(r => r.shipment_nbr);
        const a = await saveAssignment(code, { confirmed_at: new Date().toISOString(), confirmed_by: name, confirmed_shipments: snap });
        await logEvent(a.id, { kind: 'confirm', ship_via: a.ship_via, contractor: a.contractor, note: `${snap.length} shipments, ${fmt(b.vol)} volume` });
      } else if (act === 'unconfirm') {
        const prev = b.a;
        const a = await saveAssignment(code, { confirmed_at: null, confirmed_by: null, confirmed_shipments: null });
        await logEvent(a.id, { kind: 'unconfirm', ship_via: prev.ship_via, contractor: prev.contractor });
      } else if (act === 'call') {
        const outcome = card.querySelector('[data-call="outcome"]').value;
        const note = card.querySelector('[data-call="note"]').value.trim() || null;
        if (!vals.ship_via && !vals.contractor && !note) return cardErr(code, 'Say who you called — fill in the contractor or a note.');
        const a = await saveAssignment(code);
        await logEvent(a.id, { kind: 'call', outcome, note, ship_via: vals.ship_via, contractor: vals.contractor });
      }
      await loadAssignments();
      render();
    } catch (err) {
      cardErr(code, "Couldn't save: " + (err.message || err));
    }
  }

  function isEditing() {
    const a = document.activeElement;
    return !!(a && a.closest && a.closest('#batching') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
  }

  const batchingEl = document.getElementById('batching');
  batchingEl.addEventListener('input', e => {
    if (e.target.id === 'lbName') { setName(e.target.value.trim()); return; }
    const card = e.target.closest('.bcard');
    if (card && e.target.dataset.f) scheduleSave(card.dataset.code);
  });
  // Picking a code from the list fills in the contractor if it's still blank.
  batchingEl.addEventListener('change', e => {
    if (e.target.dataset.f !== 'ship_via') return;
    const card = e.target.closest('.bcard');
    const who = card.querySelector('[data-f="contractor"]');
    const info = codeInfo(e.target.value.trim());
    if (info && who && !who.value.trim()) { who.value = info.description || ''; scheduleSave(card.dataset.code); }
  });
  batchingEl.addEventListener('click', e => {
    const copy = e.target.closest('[data-copy]');
    if (copy) {
      navigator.clipboard?.writeText(copy.dataset.copy).then(() => {
        const t = copy.textContent; copy.textContent = 'Copied'; setTimeout(() => { copy.textContent = t; }, 1200);
      }).catch(() => {});
      return;
    }
    const btn = e.target.closest('[data-act]');
    if (btn) clerkAction(btn.closest('.bcard').dataset.code, btn.dataset.act);
  });
  batchingEl.addEventListener('focusout', () => {
    setTimeout(async () => {
      if (isEditing() || !LB.pendingRender) return;
      await flushSaves();
      render();
    }, 0);
  });

  // ------------------------------------------------------------
  // Controls
  // ------------------------------------------------------------
  function setDate(iso) {
    LB.date = iso;
    LB.open = null;
    document.getElementById('datePick').value = iso;
    document.querySelectorAll('#daySeg button').forEach(b => b.classList.toggle('on', jmDate(Number(b.dataset.day)) === iso));
    refresh();
  }

  document.getElementById('daySeg').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) setDate(jmDate(Number(b.dataset.day)));
  });
  document.getElementById('datePick').addEventListener('change', e => { if (e.target.value) setDate(e.target.value); });
  function setSection(s) {
    LB.section = s;
    LB.open = null;
    try { localStorage.setItem('lb-section', s); } catch (e) {}
    document.querySelectorAll('#sectionSeg button').forEach(x => x.classList.toggle('on', x.dataset.section === s));
  }
  document.getElementById('sectionSeg').addEventListener('click', async e => {
    const b = e.target.closest('button');
    if (!b) return;
    await flushSaves();
    setSection(b.dataset.section);
    render();
  });
  document.getElementById('viewSeg').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    LB.view = b.dataset.view;
    LB.open = null;
    document.querySelectorAll('#viewSeg button').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
  document.getElementById('board').addEventListener('click', e => {
    const row = e.target.closest('.row.item');
    if (!row) return;
    LB.open = LB.open === row.dataset.open ? null : row.dataset.open;
    render();
  });
  document.getElementById('notes').addEventListener('click', e => {
    const b = e.target.closest('button[data-toggle]');
    if (!b) return;
    if (b.dataset.toggle === 'zero') LB.showZero = !LB.showZero;
    else LB.showStragglers = !LB.showStragglers;
    renderNotes();
  });

  async function initLoadBoard() {
    try {
      await Promise.all([loadTruckTypes(), loadCodes()]);
    } catch (err) {
      console.error('[load-board]', err);
    }
    let s = 'overview';
    try { s = localStorage.getItem('lb-section') || 'overview'; } catch (e) {}
    setSection(['overview', 'clerk', 'batcher'].includes(s) ? s : 'overview');
    setDate(jmDate(0));
    setInterval(refresh, REFRESH_MS);
    setInterval(renderSync, 30 * 1000);
  }

  initLoadBoard();
</script>

</body>
</html>
