<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2044">
<meta name="robots" content="noindex, nofollow">
<title>Sales Orders — Logistics Management System</title>
<!--
  Sales Orders, for the Logistics Coordinator: the orders still waiting to be put on a shipment.
  Live mode reads dispatch_sales_orders(): production sales orders (SO type), Open and Back
  Order by default, with what is still to ship, its volume, and whether stock at 71 covers it.
  Orders on Credit Hold or On Hold can be shown but can't be selected: Acumatica won't ship them.
  Test mode reads the Acumatica TEST tenant's Open / Back Order orders through dispatch-orders
  (production order numbers don't exist there).

  Create shipments (dispatch-orders create_shipments) runs Create Shipment on the selected
  orders with the date in the date box (default today; the coordinator picks tomorrow for the
  next day's batch). Test writes to TEST only. Live is refused by the server until
  DISPATCH_LIVE_ORDERS = 'on' (after a TEST run). The new shipments then appear on the
  Coordinator page at the next shipment sync (within 5 minutes).
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .so-ctl { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .so-ctl input[type=search], .so-ctl select, .so-ctl input[type=date] { font:inherit; font-size:13px; padding:6px 10px; border:1px solid var(--border2); border-radius:8px; background:#fff; }
  .so-ctl input[type=search] { min-width:200px; flex:1; max-width:320px; }
  .so-chips { display:flex; gap:6px; flex-wrap:wrap; }
  .so-chips button { font:inherit; font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:999px; border:1px solid var(--border2); background:#fff; color:var(--text-muted); cursor:pointer; }
  .so-chips button.on { background:var(--navy); border-color:var(--navy); color:#fff; }
  .so-wrap { overflow-x:auto; }
  table.so { width:100%; border-collapse:collapse; font-size:13px; min-width:760px; }
  table.so th { text-align:left; font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.3px; padding:8px; border-bottom:1px solid var(--border); background:#f8fafc; white-space:nowrap; }
  table.so td { padding:7px 8px; border-top:1px solid #f1f5f9; vertical-align:middle; }
  table.so th.r, table.so td.r { text-align:right; font-variant-numeric:tabular-nums; }
  table.so th[data-sort] { cursor:pointer; user-select:none; }
  table.so th[data-sort]:hover { color:var(--navy); }
  table.so tr.blocked td { opacity:.55; }
  table.so tr.sel td { background:var(--accent-bg); }
  table.so td.nbr { font-weight:600; white-space:nowrap; }
  table.so .cust { max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .so-bar { position:sticky; bottom:0; display:flex; gap:12px; flex-wrap:wrap; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 14px; margin-top:12px; box-shadow:0 -2px 8px rgba(15,32,68,.06); }
  .so-bar .spacer { flex:1; }
  .so-bar label { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); font-weight:500; }
</style>
</head>
<body>
<div class="page" id="app"><div class="skel-wrap"><div class="skel-card"><div class="skel w40"></div><div class="skel w70"></div><div class="skel w55"></div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3" integrity="sha384-dl/4LkSyQ4uEucc48NM6VDZLAjLLq9yMzZ5JLXumBq7Ld33XBof73hseOqPhO89+" crossorigin="anonymous"></script>
<script src="common.js"></script>
<script>
  const STATUSES = ['Open', 'Back Order', 'Shipping', 'Credit Hold', 'On Hold'];
  const CANT_SHIP = ['Credit Hold', 'On Hold'];
  const S = { rows: [], statuses: ['Open', 'Back Order'], q: '', zone: 'all', sel: new Set(), date: jmDate(0), synced: null, results: null, busy: false, sort: { key: 'order_date', dir: -1 }, tab: loadKindTab() };

  async function callOrders(action, body) {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error('Signed out; reload and sign in again');
    const res = await fetch(`${SUPABASE_URL}/functions/v1/dispatch-orders`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ action, ...(body || {}) }),
    });
    let json = null;
    try { json = await res.json(); } catch (e) {}
    if (!res.ok && !(json && 'ok' in json)) throw new Error(`dispatch-orders ${res.status}`);
    return json;
  }
  try {
    const f = JSON.parse(localStorage.getItem('dispatch-so-filter') || '{}');
    if (Array.isArray(f.statuses) && f.statuses.every(x => STATUSES.includes(x)) && f.statuses.length) S.statuses = f.statuses;
  } catch (e) {}
  function saveFilter() { try { localStorage.setItem('dispatch-so-filter', JSON.stringify({ statuses: S.statuses })); } catch (e) {} }

  async function loadAll() {
    let data;
    if (D.env === 'test') {
      const r = await callOrders('list_test_orders');
      if (!r.ok) throw new Error(r.error || "Couldn't read the TEST orders");
      data = (r.orders || []).filter(o => S.statuses.includes(o.status));
      S.synced = null;
    } else {
      const [rows, sync] = await Promise.all([
        sb.rpc('dispatch_sales_orders', { p_statuses: S.statuses, p_days: 90 }),
        sb.rpc('dispatch_so_synced_at'),
      ]);
      if (rows.error) throw rows.error;
      data = rows.data || [];
      S.synced = sync.data ? new Date(sync.data) : null;
    }
    await loadKinds();
    S.rows = data.map(r => ({ ...r, order_total: Number(r.order_total) || 0, open_qty: Number(r.open_qty) || 0, open_volume: Number(r.open_volume) || 0 }));
    const have = new Set(S.rows.filter(canShip).map(r => r.order_nbr));
    S.sel = new Set([...S.sel].filter(n => have.has(n)));
  }

  // Acumatica only ships lines whose Ship On date is on or before the shipment date, so an order whose Ship On is
  // after the date picked below can't be shipped on it.
  const notDue = r => !!r.sched_shipment && r.sched_shipment > S.date;
  const canShip = r => !CANT_SHIP.includes(r.status) && r.open_qty > 0 && !notDue(r);
  function visible() {
    const q = S.q.trim().toLowerCase();
    const k = S.sort.key, d = S.sort.dir;
    const num = ['open_qty', 'open_volume', 'order_total'].includes(k);
    return S.rows.filter(r => (S.tab === 'special') === !!kindOf(r) && (S.zone === 'all' || r.shipping_zone === S.zone)
      && (!q || [r.order_nbr, r.customer_name, r.customer_id].some(v => String(v || '').toLowerCase().includes(q))))
      .sort((a, b) => d * (num ? (a[k] - b[k])
        : String(a[k] || '').localeCompare(String(b[k] || ''), undefined, { numeric: true, sensitivity: 'base' }))
        || String(b.order_nbr).localeCompare(String(a.order_nbr), undefined, { numeric: true }));
  }
  function sortTh(label, key, cls) {
    const on = S.sort.key === key;
    return `<th class="${cls || ''}" data-sort="${key}" aria-sort="${on ? (S.sort.dir > 0 ? 'ascending' : 'descending') : 'none'}" tabindex="0">${label}${on ? (S.sort.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  }
  function statusPill(s) {
    const cls = { 'Open': 'ok', 'Back Order': 'warn', 'Shipping': 'info', 'Credit Hold': 'bad', 'On Hold': 'bad' }[s] || 'done';
    return `<span class="pill ${cls}">${esc(s)}</span>`;
  }

  function render() {
    const rows = visible();
    const zones = [...new Set(S.rows.map(r => r.shipping_zone).filter(Boolean))].sort();
    const counts = { special: S.rows.filter(r => kindOf(r)).length };
    counts.delivery = S.rows.length - counts.special;
    const picked = S.rows.filter(r => S.sel.has(r.order_nbr));
    const ready = rows.filter(canShip);
    document.getElementById('main').innerHTML = `
      <div class="warnbox info" style="margin-bottom:12px">${D.env === 'test'
        ? '<b>TEST:</b> these are the Open and Back Order orders in the Acumatica TEST tenant. Creating shipments here changes TEST only.'
        : '<b>LIVE:</b> production orders. Creating shipments goes to live Acumatica once that has been switched on after the TEST run.'}</div>
      ${S.results ? resultsHtml() : ''}
      ${kindTabsHtml(S.tab, counts)}
      <div class="so-ctl">
        <div class="so-chips" id="stChips" role="group" aria-label="Order status">
          ${STATUSES.map(s => `<button data-st="${esc(s)}" class="${S.statuses.includes(s) ? 'on' : ''}">${esc(s)}</button>`).join('')}
        </div>
        <input type="search" id="q" placeholder="Search order or customer" value="${esc(S.q)}" aria-label="Search orders">
        <select id="zone" aria-label="Shipping zone">
          <option value="all">All zones</option>
          ${zones.map(z => `<option ${S.zone === z ? 'selected' : ''}>${esc(z)}</option>`).join('')}
        </select>
        ${S.synced ? syncText(S.synced) : ''}
      </div>
      <div class="kpis">
        <div class="kpi"><div class="l">Orders</div><div class="v">${rows.length}</div><div class="s">${plural(ready.length, 'order')} can ship</div></div>
        <div class="kpi"><div class="l">Open qty</div><div class="v">${fmt(rows.reduce((t, r) => t + r.open_qty, 0))}</div><div class="s">cases to ship</div></div>
        <div class="kpi"><div class="l">Volume</div><div class="v">${fmt(rows.reduce((t, r) => t + r.open_volume, 0))}</div><div class="s">open volume</div></div>
        <div class="kpi"><div class="l">Value</div><div class="v">${money(rows.reduce((t, r) => t + r.order_total, 0))}</div><div class="s">order totals</div></div>
      </div>
      <div class="card"><div class="so-wrap">
        ${rows.length ? `<table class="so"><thead><tr>
          <th><input type="checkbox" id="all" aria-label="Select all orders that can ship" ${ready.length && ready.every(r => S.sel.has(r.order_nbr)) ? 'checked' : ''} ${ready.length ? '' : 'disabled'}></th>
          ${sortTh('Order', 'order_nbr')}${sortTh('Customer', 'customer_name')}${sortTh('Zone', 'shipping_zone')}${sortTh('Status', 'status')}${sortTh('Ordered', 'order_date')}${sortTh('Ship on', 'sched_shipment')}${sortTh('Open qty', 'open_qty', 'r')}${sortTh('Volume', 'open_volume', 'r')}${sortTh('Value', 'order_total', 'r')}<th>Notes</th></tr></thead>
          <tbody>${rows.map(r => `<tr class="${canShip(r) ? '' : 'blocked'} ${S.sel.has(r.order_nbr) ? 'sel' : ''}">
            <td><input type="checkbox" data-pick="${esc(r.order_nbr)}" aria-label="Select order ${esc(r.order_nbr)}" ${S.sel.has(r.order_nbr) ? 'checked' : ''} ${canShip(r) ? '' : 'disabled'}></td>
            <td class="nbr">${esc(r.order_nbr)}</td>
            <td class="cust" title="${esc(r.customer_name || '')}">${kindTag(kindOf(r))}${esc(r.customer_name || r.customer_id || '')}</td>
            <td>${esc(r.shipping_zone || '')}</td>
            <td>${statusPill(r.status)}</td>
            <td>${esc(r.order_date ? niceDate(r.order_date) + ' ' + r.order_date.slice(0, 4) : '')}</td>
            <td>${esc(r.sched_shipment ? niceDate(r.sched_shipment) + ' ' + r.sched_shipment.slice(0, 4) : '')}</td>
            <td class="r">${fmt(r.open_qty)}</td><td class="r">${fmt(r.open_volume)}</td><td class="r">${money(r.order_total)}</td>
            <td>${notDue(r) ? `<span class="tag old" title="Acumatica won't ship lines before their Ship On date. Set the shipment date to ${esc(niceDate(r.sched_shipment))} or later.">Ship on ${esc(niceDate(r.sched_shipment))}: set that date</span>` : ''}${r.open_shipments ? `<span class="tag" title="Already on an open shipment">On shipment${r.open_shipments > 1 ? ' ×' + r.open_shipments : ''}</span> ` : ''}${r.short_lines ? `<span class="tag old" title="Open qty is more than on hand at 71 on these lines">Short ${r.short_lines}</span>` : ''}${CANT_SHIP.includes(r.status) ? '<span class="tag old">Can\'t ship</span>' : ''}</td>
          </tr>`).join('')}</tbody></table>` : `<div class="empty">No ${S.tab === 'special' ? 'pickup / donation / promotion ' : ''}${esc(S.statuses.join(' / '))} orders${S.q || S.zone !== 'all' ? ' match that search' : ''}.</div>`}
      </div></div>
      <div class="so-bar">
        <span><b>${plural(picked.length, 'order')}</b> selected · volume ${fmt(picked.reduce((t, r) => t + r.open_volume, 0))} · ${money(picked.reduce((t, r) => t + r.order_total, 0))}</span>
        <span class="spacer"></span>
        <label>Shipment date <input type="date" id="shipDate" min="${jmDate(0)}" value="${esc(S.date)}"></label>
        <button class="btn primary" data-create ${picked.length && !S.busy ? '' : 'disabled'}>${S.busy ? 'Creating…' : 'Create shipments'}</button>
      </div>`;
  }

  function resultsHtml() {
    const cls = { created: 'ok', none: 'warn', refused: 'bad', failed: 'bad', skipped: 'warn' };
    const word = { created: 'Created', none: 'No shipment', refused: 'Refused', failed: 'Failed', skipped: 'Skipped' };
    const made = S.results.filter(r => r.state === 'created').length;
    return `<div class="card" style="margin-bottom:12px;padding:12px 14px">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><b>${made} of ${S.results.length} order${S.results.length === 1 ? '' : 's'} got a shipment</b>
        <span class="spacer" style="flex:1"></span><button class="btn small" data-dismiss>Dismiss</button></div>
      ${S.results.map(r => `<div style="padding:4px 0;border-top:1px solid #f1f5f9;font-size:13px"><b>${esc(r.order_nbr)}</b>
        <span class="pill ${cls[r.state] || 'done'}">${esc(word[r.state] || r.state)}</span>
        ${(r.shipments || []).length ? `shipment ${esc(r.shipments.join(', '))}` : ''} <span class="muted">${esc(r.detail || '')}</span></div>`).join('')}
      ${made ? '<div class="muted" style="margin-top:6px">New shipments appear on the Coordinator page at the next shipment sync (within 5 minutes).</div>' : ''}
    </div>`;
  }

  async function createShipments() {
    if (S.busy) return;
    const orders = [...S.sel];
    if (!orders.length) return;
    if (orders.length > 20) { toast('Select 20 orders or fewer at a time', true); return; }
    const where = D.env === 'test' ? 'Acumatica TEST' : 'live Acumatica';
    if (!confirm(`Create shipments for ${plural(orders.length, 'order')} dated ${niceDate(S.date)} ${S.date.slice(0, 4)} in ${where}?\n\nAcumatica ships only what's available; orders with nothing in stock get no shipment.`)) return;
    S.busy = true; render();
    try {
      const r = await callOrders('create_shipments', { env: D.env, orders, shipment_date: S.date });
      if (!r.ok) throw new Error(r.error || "Couldn't create shipments");
      S.results = r.results || [];
      const done = new Set(S.results.filter(x => x.state === 'created').map(x => x.order_nbr));
      done.forEach(n => S.sel.delete(n));
      toast(`${plural(done.size, 'order')} shipped`);
    } catch (e) { console.error('[salesorders]', e); toast(errMsg(e), true); }
    finally { S.busy = false; await refresh(); }
  }

  document.getElementById('app').addEventListener('click', async e => {
    if (e.target.closest('[data-create]')) { createShipments(); return; }
    if (e.target.closest('[data-dismiss]')) { S.results = null; render(); return; }
    const th = e.target.closest('th[data-sort]');
    if (th) {
      const k = th.dataset.sort;
      S.sort = S.sort.key === k ? { key: k, dir: -S.sort.dir } : { key: k, dir: ['open_qty', 'open_volume', 'order_total', 'order_date'].includes(k) ? -1 : 1 };
      render(); return;
    }
    const kt = e.target.closest('[data-ktab]');
    if (kt) { S.tab = kt.dataset.ktab; saveKindTab(S.tab); render(); return; }
    const st = e.target.closest('[data-st]');
    if (!st) return;
    const s = st.dataset.st;
    S.statuses = S.statuses.includes(s) ? S.statuses.filter(x => x !== s) : [...S.statuses, s];
    if (!S.statuses.length) S.statuses = [s];
    saveFilter();
    await refresh();
  });
  document.getElementById('app').addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'zone') { S.zone = t.value; render(); return; }
    if (t.id === 'shipDate') { S.date = t.value || jmDate(0); S.sel = new Set([...S.sel].filter(n => { const r = S.rows.find(x => x.order_nbr === n); return r && canShip(r); })); render(); return; }
    if (t.id === 'all') { visible().filter(canShip).forEach(r => t.checked ? S.sel.add(r.order_nbr) : S.sel.delete(r.order_nbr)); render(); return; }
    if (t.dataset.pick) { t.checked ? S.sel.add(t.dataset.pick) : S.sel.delete(t.dataset.pick); render(); }
  });
  document.getElementById('app').addEventListener('input', e => {
    if (e.target.id !== 'q') return;
    S.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById('q'); el.focus(); el.setSelectionRange(pos, pos);
  });

  async function refresh() {
    try { await loadAll(); render(); }
    catch (e) { console.error('[salesorders]', e); document.getElementById('main').innerHTML = errBox(e); }
  }
  function editing() { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }

  startPage({
    page: 'salesorders', role: 'batcher', title: 'Sales Orders',
    onEnvChange: () => { S.sel.clear(); S.results = null; refresh(); },
    onReady: () => { refresh(); setInterval(() => { if (!editing()) refresh(); }, 60 * 1000); },
  });
</script>
</body>
</html>
