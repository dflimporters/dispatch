<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2044">
<meta name="robots" content="noindex, nofollow">
<title>Load Sheets — Logistics Management System</title>
<!--
  Load sheets (OMS last mile): the print station. For each load the checker has confirmed:

    Print load sheet   issues the load's claim code (lm_sheet -> lm_ensure_load) and prints a
                       laser sheet with a QR code and the same code in text. The driver scans
                       the QR (or types the code) in the driver app.

  Where the load is, who has it, the stops, exceptions, photos, unassign and close all live in
  Control Tower (tower.html); each load here links to it. Control Tower's "Print load sheet"
  opens this page as loadsheet.html?print=ID, which prints that load straight away.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .dctl { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }

  /* The printed sheet: hidden on screen, the only thing shown when printing. */
  #sheetwrap { display:none; }
  .sheet { font-family:'Inter',Arial,sans-serif; color:#000; max-width:190mm; margin:0 auto; padding:0; }
  .sheet .sh { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid #000; padding-bottom:8px; margin-bottom:12px; gap:16px; }
  .sheet .sh img { height:46px; }
  .sheet .sh .t { font-size:13px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; text-align:right; }
  .sheet .sh .t b { display:block; font-size:26px; letter-spacing:0; margin-top:2px; font-family:ui-monospace,Consolas,monospace; }
  .sheet .top { display:flex; gap:20px; align-items:center; margin-bottom:14px; }
  .sheet .qr { width:52mm; height:52mm; flex:none; }
  .sheet .qr svg { width:100%; height:100%; display:block; }
  .sheet .big { flex:1; }
  .sheet .big .l { font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#444; }
  .sheet .big .code { font-family:ui-monospace,Consolas,monospace; font-size:34px; font-weight:800; letter-spacing:3px; margin:2px 0 6px; }
  .sheet .big .who { font-size:19px; font-weight:800; }
  .sheet .big .sub { font-size:13px; color:#333; margin-top:2px; }
  .sheet .how { border:1.5px solid #000; border-radius:6px; padding:7px 10px; font-size:12.5px; margin-bottom:12px; }
  .sheet table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .sheet th { text-align:left; font-size:10.5px; letter-spacing:.6px; text-transform:uppercase; border-bottom:2px solid #000; padding:4px 5px; }
  .sheet td { border-bottom:1px solid #999; padding:5px; vertical-align:top; }
  .sheet td.n { width:8mm; font-weight:800; }
  .sheet .foot { margin-top:10px; font-size:11px; color:#444; display:flex; justify-content:space-between; }
  @media print {
    @page { margin:12mm; }
    body { background:#fff; }
    #chrome, #app, .toast { display:none !important; }
    #sheetwrap { display:block !important; }
  }
</style>
</head>
<body>
<div class="page" id="app"><div class="empty">Loading…</div></div>
<div id="sheetwrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3" integrity="sha384-dl/4LkSyQ4uEucc48NM6VDZLAjLLq9yMzZ5JLXumBq7Ld33XBof73hseOqPhO89+" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1" crossorigin="anonymous"></script>
<script src="common.js"></script>
<script>
  const L = { date: jmDate(0), loads: [], pending: 0, lm: new Map(), busy: false, autoPrint: null };
  try { const p = Number(new URLSearchParams(location.search).get('print')); if (p) L.autoPrint = p; } catch (e) {}
  const LM_COLS = 'load_id,status,claimed_name,claimed_phone,aborted_at';

  async function loadAll() {
    // A load opened with ?print=ID may be from another day: find its date first.
    if (L.autoPrint) {
      const one = await sb.from('loads').select('load_date,env').eq('id', L.autoPrint).maybeSingle();
      if (one.data) { L.date = one.data.load_date; if (one.data.env !== D.env) { setEnv(one.data.env); renderEnvBar(() => refresh()); } }
    }
    const { data: loads, error } = await sb.from('loads')
      .select('id,load_nbr,load_date,wave,seq,truck_type,ship_via,contractor,status,check_status,sheet_stale_at')
      .eq('env', D.env).eq('load_date', L.date).in('status', ['done', 'partial']).order('wave').order('seq');
    if (error) throw error;
    const all = loads || [];
    L.loads = all.filter(l => l.check_status === 'confirmed');
    L.pending = all.length - L.loads.length;
    L.lm = new Map();
    const ids = L.loads.map(l => l.id);
    if (!ids.length) return;
    const lm = await sb.from('lm_loads').select(LM_COLS).in('load_id', ids);
    if (lm.error) throw lm.error;
    (lm.data || []).forEach(r => L.lm.set(r.load_id, r));
  }

  function stateOf(l) {
    const m = L.lm.get(l.id);
    if (!m) return { pill: '<span class="pill done">Sheet not printed yet</span>', cls: 'st-draft' };
    const by = m.claimed_name ? ` · ${esc(m.claimed_name)}${m.claimed_phone ? ' ' + esc(m.claimed_phone) : ''}` : '';
    return {
      ready:      { pill: '<span class="pill info">Waiting for the driver to scan</span>', cls: 'st-ready' },
      collected:  { pill: `<span class="pill warn">Collected${by}</span>`, cls: 'st-confirmed' },
      delivering: { pill: `<span class="pill warn">Out for delivery${by}</span>`, cls: 'st-confirmed' },
      completed:  { pill: '<span class="pill ok">Completed</span>', cls: 'st-done' },
      closed:     { pill: '<span class="pill ok">Closed</span>', cls: 'st-done' },
    }[m.status] || { pill: esc(m.status), cls: '' };
  }

  function card(l) {
    const m = L.lm.get(l.id);
    const st = stateOf(l);
    return `<div class="lcard ${st.cls}" data-load="${l.id}">
      <div class="lhead"><div><span class="lnbr">${esc(l.load_nbr)}</span> ${waveTag(l.wave)} ${st.pill}
          ${m && m.aborted_at ? '<span class="pill bad">Stopped by driver</span>' : ''}
          ${l.sheet_stale_at ? '<span class="pill warn">Trucker changed: reprint the sheet</span>' : ''}</div>
        <div class="lactions" style="margin:0">
          ${canReassign() && (!m || m.status === 'ready') ? `<button class="btn small" data-act="reassign">Change trucker…</button>` : ''}
          <a class="btn small" href="tower.html#load=${l.id}">Open in Control Tower</a>
          <button class="btn small primary" data-act="print">${m ? 'Reprint load sheet' : 'Print load sheet'}</button>
        </div></div>
      <div class="lstats"><span><b>${esc(l.ship_via || '—')}</b>${l.contractor ? ' · ' + esc(l.contractor) : ''}</span>${l.truck_type ? `<span>${esc(l.truck_type)}</span>` : ''}</div>
    </div>`;
  }

  // Change the trucker after invoicing (whole load, or some shipments/invoices moved to another
  // trucker's load). Allowed only while no driver has claimed the load; the database enforces it.
  const R = { load: null, rows: [], invs: new Map(), sel: new Set(), isel: new Set(), via: '', target: '', reason: '', part: false };
  function canReassign() { return (D.me?.roles || []).some(r => ['clerk', 'supervisor', 'manager'].includes(r)); }

  async function openReassign(id) {
    const l = L.loads.find(x => x.id === id);
    if (!l) return;
    const ls = await sb.from('load_shipments').select('shipment_nbr').eq('load_id', id);
    if (ls.error) throw ls.error;
    const nbrs = (ls.data || []).map(x => x.shipment_nbr);
    const ships = nbrs.length ? await shipmentsByNbr(nbrs) : [];
    R.invs = new Map();
    if (D.env === 'live' && ships.length) {
      const inv = await sb.from('invoices').select('reference_number,order_number,status,invoice_date').in('order_number', [...new Set(ships.map(s => s.order_nbr).filter(Boolean))]);
      (inv.data || []).forEach(i => { const a = R.invs.get(i.order_number) || []; a.push(i); R.invs.set(i.order_number, a); });
    }
    Object.assign(R, { load: l, rows: ships.sort((a, b) => String(a.customer_name).localeCompare(String(b.customer_name))),
                       sel: new Set(), isel: new Set(), via: '', target: '', reason: '', part: false });
  }

  function reassignHtml() {
    const l = R.load;
    if (!l) return '';
    const opts = shipViaChoices().filter(c => c.ship_via !== l.ship_via)
      .map(c => `<option value="${esc(c.ship_via)}" ${R.via === c.ship_via ? 'selected' : ''}>${esc(c.ship_via)}${c.description ? ' — ' + esc(c.description) : ''}</option>`).join('');
    const targets = R.via ? L.loads.filter(x => x.id !== l.id && x.ship_via === R.via && (!L.lm.get(x.id) || L.lm.get(x.id).status === 'ready')) : [];
    const rows = R.rows.map(s => `<tr>
        <td><input type="checkbox" data-rsel="${esc(s.shipment_nbr)}" ${R.sel.has(s.shipment_nbr) ? 'checked' : ''}></td>
        <td>${esc(s.customer_name || s.customer_id || '')}</td><td class="mono">${esc(s.shipment_nbr)}</td>
        <td class="mono">${(R.invs.get(s.order_nbr) || []).map(i => `<label style="display:block"><input type="checkbox" data-risel="${esc(i.reference_number)}" ${R.isel.has(i.reference_number) ? 'checked' : ''}> ${esc(i.reference_number)} <span class="muted">${esc(i.invoice_date || '')}${i.status === 'Closed' ? ' · closed' : ''}</span></label>`).join('')}</td></tr>`).join('');
    const n = R.sel.size, all = n === R.rows.length;
    return `<div class="card" id="reassign" style="padding:12px 14px;margin-bottom:14px;border:2px solid #b45309">
      <div class="dctl" style="margin:0"><b>Change trucker · ${esc(l.load_nbr)}</b><span class="muted">now ${esc(l.ship_via || '—')}</span>
        <span class="spacer"></span><button class="btn small" data-act="rclose">Close</button></div>
      <div class="dctl" style="margin-top:8px">
        <label>New trucker <select id="rvia"><option value="">Choose…</option>${opts}</select></label>
        <label><input type="radio" name="rmode" value="all" ${R.part ? '' : 'checked'}> Whole load</label>
        <label><input type="radio" name="rmode" value="part" ${R.part ? 'checked' : ''}> Only some invoices</label>
      </div>
      ${R.part ? `<table class="sheettbl" style="width:100%"><thead><tr><th></th><th>Customer</th><th>Shipment</th><th>Invoices that move with it</th></tr></thead><tbody>${rows}</tbody></table>
        <div class="dctl" style="margin-top:8px"><label>Move to <select id="rtarget"><option value="">${R.via ? 'Join a matching load, or create one' : 'Choose a trucker first'}</option>
          ${targets.map(x => `<option value="${x.id}" ${String(x.id) === R.target ? 'selected' : ''}>${esc(x.load_nbr)} (${esc(x.ship_via)})</option>`).join('')}</select></label>
          ${all ? '<span class="pill warn">That is every shipment: use "Whole load"</span>' : ''}</div>` : ''}
      <div class="dctl" style="margin-top:8px"><input type="text" id="rreason" placeholder="Why is the trucker changing? (required)" value="${esc(R.reason)}" style="min-width:320px">
        <button class="btn small primary" data-act="rgo" ${R.via && R.reason.trim() && (!R.part || (n && !all)) ? '' : 'disabled'}>${R.part ? `Move ${plural(n, 'shipment')}` : 'Change whole load'}</button></div>
      <div class="muted">Only before a driver has scanned the load. Reprint the sheet afterwards: the old paper still shows the old trucker or stops.</div>
    </div>`;
  }

  async function doReassign() {
    const l = R.load, why = R.reason.trim();
    if (R.part) {
      if (!confirm(`Move ${plural(R.sel.size, 'shipment')} from ${l.load_nbr} to ${R.via}?`)) return;
      const { data, error } = await sb.rpc('lm_reassign_shipments', { p_shipments: [...R.sel], p_ship_via: R.via, p_reason: why, p_target_load: R.target ? Number(R.target) : null, p_invoices: [...R.isel] });
      if (error) throw error;
      toast(`${plural(R.sel.size, 'shipment')} now on ${data.target_load_nbr}${data.created ? ' (new load)' : ''}. Reprint both sheets.`);
    } else {
      if (!confirm(`Give all of ${l.load_nbr} to ${R.via}?`)) return;
      const { error } = await sb.rpc('lm_reassign_load', { p_load_id: l.id, p_ship_via: R.via, p_reason: why });
      if (error) throw error;
      toast(`${l.load_nbr} is now ${R.via}. Reprint the sheet.`);
    }
    R.load = null;
    callAcu('deliverv_write', {}).catch(() => {});   // writes DELIVERVIA to Acumatica when that switch is on
  }

  // Picked outside the portal: search one invoice, get the run's sister invoices, build the load.
  const F = { q: '', res: null, sel: new Set() };

  function finderHtml() {
    if (D.env !== 'live') return '';                 // invoices exist for the live tenant only
    const r = F.res;
    let body = '';
    if (r && !r.found) {
      body = `<div class="warnbox info">No invoice or shipment ${esc(r.nbr)} found.</div>`;
    } else if (r) {
      const rows = (r.shipments || []).map(s => `<tr>
          <td><input type="checkbox" data-pick="${esc(s.shipment_nbr)}" ${s.blocked ? 'disabled' : ''} ${F.sel.has(s.shipment_nbr) ? 'checked' : ''}></td>
          <td>${esc(s.customer_name || s.customer_id || '')}</td>
          <td class="mono">${esc(s.shipment_nbr)}</td>
          <td class="mono">${esc((s.invoice_nbrs || []).join(', '))}</td>
          <td>${fmt(s.units)} items</td>
          <td>${s.blocked ? `<span class="pill bad">${esc(s.blocked)}</span>` : '<span class="pill ok">Ready</span>'}</td></tr>`).join('');
      const noLines = (r.shipments || []).some(s => s.blocked && s.blocked.startsWith('Item lines not synced'));
      body = `${noLines ? '<div class="warnbox info" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span>Some shipments have no item lines yet.</span><button class="btn small" data-act="fetchlines">Fetch missing lines from Acumatica</button></div>' : ''}
        <div class="muted" style="margin:8px 0">${esc(r.trucker || r.ship_via)} · ${esc(r.ship_via)} · invoices dated ${esc(niceDate(r.invoice_date))}</div>
        ${rows ? `<table class="sheettbl" style="width:100%"><thead><tr><th></th><th>Customer</th><th>Shipment</th><th>Invoice</th><th>Qty</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
               : '<div class="empty">No shipments found for these invoices.</div>'}
        <div class="lactions" style="margin-top:10px">
          <button class="btn small primary" data-act="build" ${F.sel.size ? '' : 'disabled'}>Create load and print sheet (${F.sel.size})</button>
          <button class="btn small" data-act="clearfind">Clear</button>
        </div>`;
    }
    return `<div class="card" id="finder" style="padding:12px 14px;margin-bottom:14px">
      <div class="dctl" style="margin:0">
        <b>Picked outside the portal?</b>
        <input type="search" id="invq" placeholder="Invoice or shipment number" value="${esc(F.q)}" autocomplete="off" style="min-width:230px">
        <button class="btn small" data-act="find">Find the run</button>
      </div>
      <div class="muted" style="margin-top:4px">Finds the other open invoices on the same Ship Via and date, so you can print one load sheet for the whole run.</div>
      ${body}</div>`;
  }

  async function findRun() {
    const q = (document.getElementById('invq')?.value || '').trim();
    F.q = q; F.res = null; F.sel = new Set();
    if (!q) return;
    const { data, error } = await sb.rpc('lm_invoice_search', { p_nbr: q });
    if (error) throw error;
    F.res = data;
    (data.shipments || []).forEach(s => { if (!s.blocked) F.sel.add(s.shipment_nbr); });
  }

  async function fetchLines() {
    const nbrs = (F.res?.shipments || []).filter(s => s.blocked && s.blocked.startsWith('Item lines not synced')).map(s => s.shipment_nbr);
    if (!nbrs.length) return;
    const r = await callAcu('fetch_lines', { shipments: nbrs });
    if (!r.ok) throw new Error(r.error || 'Could not fetch the lines');
    toast(`${fmt(r.lines)} item lines fetched`);
    document.getElementById('invq').value = F.q;
    await findRun();
  }

  async function buildRun() {
    const n = F.sel.size;
    if (!F.res || !n) return;
    if (!confirm(`Create a load for ${n} shipment${n === 1 ? '' : 's'} on ${F.res.ship_via} and print its sheet?`)) return;
    const { data, error } = await sb.rpc('lm_build_invoice_load', { p_ship_via: F.res.ship_via, p_shipments: [...F.sel] });
    if (error) throw error;
    F.q = ''; F.res = null; F.sel = new Set();
    L.date = jmDate(0);
    toast(`Created ${data.load_nbr}`);
    await printSheet(data.load_id);
  }

  function render() {
    document.getElementById('main').innerHTML = `
      <div class="dctl">
        <input type="date" id="day" value="${L.date}">
        <button class="btn small" data-act="today">Today</button>
        <span class="muted">${niceDate(L.date)}</span>
        <span class="spacer"></span>
        <a class="btn small" href="tower.html">Control Tower</a>
        <button class="btn small" data-act="refresh">Refresh</button>
      </div>
      ${reassignHtml()}
      ${finderHtml()}
      ${L.pending ? `<div class="warnbox info">${plural(L.pending, 'load')} on this day ${L.pending === 1 ? "isn't" : "aren't"} confirmed by the checker yet, so ${L.pending === 1 ? 'it has' : 'they have'} no load sheet.</div>` : ''}
      ${L.loads.length ? L.loads.map(card).join('') : '<div class="card"><div class="empty">No checker-confirmed loads on this day yet.</div></div>'}`;
  }

  // Printed sheet --------------------------------------------------
  function prettyCode(c) { return c.slice(0, 4) + '-' + c.slice(4); }
  function qrSvg(text) {
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    const n = qr.getModuleCount(), cell = 4, size = n * cell;
    let rects = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) rects += `<rect x="${c * cell}" y="${r * cell}" width="${cell}" height="${cell}"/>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 ${size + 16} ${size + 16}" shape-rendering="crispEdges"><rect x="-8" y="-8" width="${size + 16}" height="${size + 16}" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
  }
  function sheetHtml(s) {
    const link = new URL('driver/?c=' + s.code, location.href).href;
    const stops = s.stops || [];
    return `<div class="sheet">
      <div class="sh"><img src="assets/dfl-logo-color.png" alt="DFL Importers"><div class="t">Load sheet<b>${esc(s.load_nbr)}</b></div></div>
      <div class="top">
        <div class="qr">${qrSvg(link)}</div>
        <div class="big">
          <div class="l">Load code</div>
          <div class="code">${esc(prettyCode(s.code))}</div>
          <div class="who">${esc(s.trucker || s.ship_via || '')}</div>
          <div class="sub">${esc(s.ship_via || '')}${s.truck_type ? ' · ' + esc(s.truck_type) : ''}</div>
          <div class="sub">${esc(niceDate(s.load_date))}${s.wave && s.wave !== 'ACU' ? ' · ' + esc(s.wave) : ''} · ${plural(stops.length, 'stop')} · ${fmt(s.units)} items</div>
        </div>
      </div>
      <div class="how"><b>Driver:</b> open the DFL Driver app and scan this QR code, or type the code above. Check the load number and your name on the screen before you take responsibility for the load.</div>
      <table><thead><tr><th>#</th><th>Customer</th><th>Area</th><th>Invoices</th></tr></thead><tbody>
        ${stops.map(x => `<tr><td class="n">${x.seq}</td><td>${esc(x.customer_name || x.customer_id)}</td><td>${esc(x.zone || x.city || '')}</td><td>${esc((x.shipments || []).join(', '))}</td></tr>`).join('')}
      </tbody></table>
      <div class="foot"><span>Suggested order. The driver may change it in the app.</span><span>Printed ${esc(stamp(new Date().toISOString()))}</span></div>
    </div>`;
  }

  async function printSheet(id) {
    const { data, error } = await sb.rpc('lm_sheet', { p_load_id: id });
    if (error) throw error;
    document.getElementById('sheetwrap').innerHTML = sheetHtml(data);
    await new Promise(r => setTimeout(r, 150));
    window.print();
  }

  async function act(fn) {
    if (L.busy) return;
    L.busy = true;
    try { await fn(); }
    catch (e) { console.error('[loadsheet]', e); toast(errMsg(e), true); }
    finally { L.busy = false; await refresh(); }
  }

  document.getElementById('app').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const card = b.closest('[data-load]');
    const id = card ? Number(card.dataset.load) : null;
    switch (b.dataset.act) {
      case 'refresh': refresh(); break;
      case 'today': L.date = jmDate(0); refresh(); break;
      case 'print': act(() => printSheet(id)); break;
      case 'reassign': act(async () => { await openReassign(id); render(); window.scrollTo(0, 0); }); break;
      case 'rclose': R.load = null; render(); break;
      case 'rgo': act(doReassign); break;
      case 'find': act(findRun); break;
      case 'build': act(buildRun); break;
      case 'fetchlines': act(fetchLines); break;
      case 'clearfind': F.q = ''; F.res = null; F.sel = new Set(); render(); break;
    }
  });
  document.getElementById('app').addEventListener('change', e => {
    if (e.target.id === 'day' && e.target.value) { L.date = e.target.value; refresh(); }
    if (e.target.id === 'rvia') { R.via = e.target.value; R.target = ''; render(); }
    if (e.target.id === 'rtarget') { R.target = e.target.value; render(); }
    if (e.target.id === 'rreason') { R.reason = e.target.value; render(); }
    if (e.target.name === 'rmode') { R.part = e.target.value === 'part'; render(); }
    if (e.target.dataset && e.target.dataset.rsel) {
      const sh = R.rows.find(x => x.shipment_nbr === e.target.dataset.rsel);
      const invs = (sh && R.invs.get(sh.order_nbr)) || [];
      if (e.target.checked) { R.sel.add(sh.shipment_nbr); invs.filter(i => i.invoice_date >= R.load.load_date).forEach(i => R.isel.add(i.reference_number)); }
      else { R.sel.delete(e.target.dataset.rsel); invs.forEach(i => R.isel.delete(i.reference_number)); }
      render();
    }
    if (e.target.dataset && e.target.dataset.risel) {
      e.target.checked ? R.isel.add(e.target.dataset.risel) : R.isel.delete(e.target.dataset.risel);
      render();
    }
    if (e.target.dataset && e.target.dataset.pick) {
      e.target.checked ? F.sel.add(e.target.dataset.pick) : F.sel.delete(e.target.dataset.pick);
      render();
    }
  });
  document.getElementById('app').addEventListener('input', e => {
    if (e.target.id !== 'rreason') return;
    R.reason = e.target.value;                       // no redraw: it would swallow the next click
    const go = document.querySelector('[data-act="rgo"]');
    if (go) go.disabled = !(R.via && R.reason.trim() && (!R.part || (R.sel.size && R.sel.size !== R.rows.length)));
  });
  document.getElementById('app').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'invq') act(findRun);
  });

  async function refresh() {
    try { await loadAll(); render(); }
    catch (e) { console.error('[loadsheet]', e); document.getElementById('main').innerHTML = `<div class="err">Couldn't load. ${esc(errMsg(e))}</div>`; }
  }

  startPage({
    page: 'loadsheet', role: ['batcher', 'clerk', 'supervisor', 'manager'], title: 'Load sheets',
    onEnvChange: () => { L.autoPrint = null; refresh(); },
    onReady: async () => {
      await refresh();
      if (L.autoPrint) {                           // opened from Control Tower: print that load now
        const id = L.autoPrint; L.autoPrint = null;
        history.replaceState(null, '', location.pathname);
        act(() => printSheet(id));
      }
      setInterval(() => {                           // don't redraw under someone who is searching or ticking
        const typing = document.activeElement && document.activeElement.id === 'invq';
        if (!L.busy && !F.res && !R.load && !typing && document.visibilityState === 'visible') refresh();
      }, 30 * 1000);
    },
  });
</script>
</body>
</html>
