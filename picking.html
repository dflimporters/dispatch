<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2044">
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex, nofollow">
<title>Picking — Logistics Management System</title>
<!--
  Picking, by load (consolidated: one line per item across the load's
  shipments), split by area 1-7. Built for phones and tablets first: one
  tablet per area today, maybe a phone per picker later.

  A load appears once its trucker is locked in (status done/partial) and stays
  until the checker has confirmed it. By default it lists the loads made
  today in load-number order (usually for tomorrow's trucks). No carry-over
  from earlier days; pick the date to see those. Required quantities come live from the
  shipment lines (dispatch_pick_list), so a corrected shipment shows at once.
  The picker records what they picked (dispatch_pick_set): "All" for a full
  pick, or a number for a short. An area is marked done once every item in it
  has a quantity (dispatch_pick_area_done).

  Area mapping is a placeholder by item class (pick_area_classes) until the
  warehouse manager's per-item list arrives. No picker PINs for now.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .areas { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .areas button { font:inherit; font-size:16px; font-weight:600; padding:12px 18px; min-height:48px; border-radius:10px; border:1px solid var(--border2); background:#fff; color:var(--text); cursor:pointer; }
  .areas button.on { background:var(--navy); border-color:var(--navy); color:#fff; }
  .pload { display:block; width:100%; text-align:left; font:inherit; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; min-height:64px; margin-bottom:10px; cursor:pointer; color:var(--text); }
  .pload:hover { border-color:var(--border2); }
  .pload .top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pload .sub { font-size:13px; color:var(--text-muted); margin-top:4px; }
  .achips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .achip { font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; background:#f1f5f9; color:var(--text-muted); }
  .achip.done { background:var(--ok-bg); color:var(--ok-text); }
  .achip.part { background:var(--warn-bg); color:var(--warn-text); }
  .back { font:inherit; font-size:14px; font-weight:600; background:none; border:0; color:var(--accent); cursor:pointer; padding:4px 0; margin-bottom:8px; }
  .item { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 12px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .item.ok { border-color:#34d399; border-left-width:6px; background:var(--ok-bg); }
  .item.short { border-color:#fbbf24; border-left-width:6px; background:var(--warn-bg); }
  .item .desc { font-size:15px; font-weight:600; color:var(--navy); line-height:1.3; }
  .item .meta { font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .item .need { font-size:22px; font-weight:700; color:var(--navy); text-align:right; font-variant-numeric:tabular-nums; }
  .item .need small { display:block; font-size:11px; font-weight:500; color:var(--text-muted); }
  .item .acts { grid-column:1 / -1; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .item .acts .btn { font-size:16px; padding:12px 18px; min-height:52px; }
  .item .acts .btn[data-all] { flex:1 1 140px; font-size:18px; }
  .item .acts .btn.small { min-height:44px; font-size:14px; }
  .item .acts input { width:96px; min-height:52px; font:inherit; font-size:20px; padding:9px 10px; border:1px solid var(--border2); border-radius:8px; text-align:right; }
  .item .acts .got { font-size:13px; color:var(--text-muted); margin-left:auto; }
  .donebar { position:sticky; bottom:10px; display:flex; gap:10px; align-items:center; background:var(--navy); color:#fff; border-radius:12px; padding:12px 14px; margin-top:12px; box-shadow:0 6px 20px rgba(15,32,68,.25); }
  .donebar { flex-wrap:wrap; }
  .donebar .btn { border-color:#fff; font-size:16px; padding:12px 18px; min-height:50px; }
  .grp { margin-bottom:14px; }
  .ghead { position:sticky; top:var(--pin-h,0px); z-index:5; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; background:var(--navy); color:#fff; border-radius:10px; padding:8px 12px; margin-bottom:6px; }
  .ghead .gl { display:flex; align-items:center; gap:8px; flex-wrap:wrap; } .ghead .gl b { font-size:16px; }
  .ghead .gr { display:flex; gap:6px; }
  .ghead .btn { min-height:40px; }
  .item { grid-template-columns:minmax(0,1fr) 70px auto; padding:8px 12px; margin-bottom:6px; }
  .item .acts { grid-column:auto; }
  .item .acts .btn { min-height:46px; font-size:15px; padding:8px 14px; }
  .item .acts .btn[data-all] { flex:0 0 auto; font-size:16px; }
  .item .acts input { min-height:46px; width:84px; }
  @media (max-width:1100px) { .item { grid-template-columns:minmax(0,1fr) 70px; } .item .acts { grid-column:1 / -1; } }
  @media (max-width:640px) { .kpis { display:none; } }
</style>
</head>
<body>
<div class="page" id="app"><div class="skel-wrap"><div class="skel-card"><div class="skel w40"></div><div class="skel w70"></div><div class="skel w55"></div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3" integrity="sha384-dl/4LkSyQ4uEucc48NM6VDZLAjLLq9yMzZ5JLXumBq7Ld33XBof73hseOqPhO89+" crossorigin="anonymous"></script>
<script src="common.js"></script>
<script>
  const AREAS = [[1, 'Area 1'], [2, 'Area 2'], [3, 'Area 3'], [4, 'Area 4'], [5, 'Area 5'], [6, 'Area 6'], [7, 'Area 7'], [0, 'Unassigned']];
  const P = { date: jmDate(0), loads: [], lists: new Map(), done: [], sel: null, busy: false, area: 'all', q: '' };
  try { const a = localStorage.getItem('dispatch-pick-area'); if (a) P.area = a; } catch (e) {}
  function areaName(a) { return (AREAS.find(x => x[0] === Number(a)) || [0, 'Unassigned'])[1]; }
  function inArea(line) { return P.area === 'all' || line.area === Number(P.area); }

  async function loadAll() {
    const loads = (await fetchLoadsView(P.date, { events: false })).filter(l => ['done', 'partial'].includes(l.status) && l.check_status !== 'confirmed' && !l.checker_done_at && !l.closed_at);
    await loadKinds();
    P.loads = loads.sort((a, b) => isSpecialLoad(b) - isSpecialLoad(a) || (a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : 0)); // pickup / donation / promotion first, then in load-number (creation) order
    await loadPicks();
  }
  // Pick lines and area status for the loads already on screen: one request, so a save shows quickly.
  async function loadPicks() {
    const ids = P.loads.map(l => l.id);
    let b = { picks: [], done: [], staged: [] };
    if (ids.length) {
      const r = await sb.rpc('dispatch_pick_bundle', { p_load_ids: ids, p_with_checks: false });
      if (r.error) throw r.error;
      b = r.data;
    }
    P.staged = b.staged || [];
    P.done = b.done || [];
    P.lists = new Map(ids.map(id => [id, (b.picks || []).filter(x => x.load_id === id)]));
    AS.overlay();
  }
  function areaDone(loadId, area) { return P.done.find(d => d.load_id === loadId && d.area === area); }
  function areaStaged(loadId, area) { return (P.staged || []).find(d => d.load_id === loadId && d.area === area); }
  function areasOf(loadId) { return [...new Set((P.lists.get(loadId) || []).map(x => x.area))].sort((a, b) => (a || 9) - (b || 9)); }

  function render() {
    const main = document.getElementById('main');
    const mine = P.loads.filter(l => (P.lists.get(l.id) || []).some(inArea) && loadMatches(l, P.q));
    const cur = mine.find(l => l.id === P.sel) || mine[0] || null;
    P.sel = cur ? cur.id : null;
    const allLines = mine.flatMap(l => (P.lists.get(l.id) || []).filter(inArea));
    const shown = cur ? [cur] : [];
    // One load at a time, grouped by area; lines inside an area follow the Sort button.
    const groups = [];
    shown.forEach(l => areasOf(l.id).filter(a => P.area === 'all' || a === Number(P.area)).forEach(a =>
      groups.push({ a, l, lines: (P.lists.get(l.id) || []).filter(x => x.area === a) })));
    groups.sort((x, y) => (x.a || 9) - (y.a || 9));
    const empty = `<div class="card">${P.q ? emptyState(`Nothing matches “${esc(P.q)}”`, 'Check the spelling, or clear the search.', { label: 'Clear search', id: 'clear-q' })
        : emptyState(`No loads to pick${P.area === 'all' ? '' : ' in ' + areaName(P.area)} from ${P.date === jmDate(0) ? 'today' : esc(niceDate(P.date))}`, 'A load shows here once its trucker is locked in.', P.area !== 'all' ? { label: 'Show all areas', id: 'all-areas' } : P.date === jmDate(0) ? { label: 'Check yesterday', id: 'yesterday' } : { label: 'Check today', id: 'today' })}</div>`;
    morphHTML(main, `
      <div class="controls">
        <div class="seg" id="daySeg">
          <button data-day="0" class="${P.date === jmDate(0) ? 'on' : ''}">Today</button>
          <button data-day="-1" class="${P.date === jmDate(-1) ? 'on' : ''}">Yesterday</button>
        </div>
        <input type="date" id="datePick" value="${P.date}" aria-label="Loads made on">
        ${searchBox(P.q)}
        ${sortButton()}
      </div>
      <div class="areas" role="group" aria-label="My area">
        <button data-area="all" class="${P.area === 'all' ? 'on' : ''}">All areas</button>
        ${AREAS.map(([a, n]) => `<button data-area="${a}" class="${String(P.area) === String(a) ? 'on' : ''}">${n}</button>`).join('')}
      </div>
      <div class="kpis">
        <div class="kpi"><div class="l">Loads to pick</div><div class="v">${mine.length}</div><div class="s">${P.area === 'all' ? 'all areas' : areaName(P.area)}</div></div>
        <div class="kpi"><div class="l">Lines</div><div class="v">${allLines.length}</div><div class="s">${allLines.filter(x => x.picked_qty != null).length} picked</div></div>
        <div class="kpi ${allLines.some(x => x.picked_qty != null && Number(x.picked_qty) < Number(x.required)) ? 'warn' : ''}"><div class="l">Short</div><div class="v">${allLines.filter(x => x.picked_qty != null && Number(x.picked_qty) < Number(x.required)).length}</div><div class="s">lines picked short</div></div>
        <div class="kpi"><div class="l">Cases</div><div class="v">${fmt(allLines.reduce((s, x) => s + Number(x.required), 0))}</div><div class="s">to pick</div></div>
      </div>
      ${mine.length ? `<div class="pk">${rail(mine, cur)}<div class="pkmain">${groups.length ? groups.map(groupHTML).join('') : '<div class="card"><div class="empty">Nothing to pick in this area on this load.</div></div>'}</div></div>` : empty}`);
  }

  // Left rail: one button per load, with a dot for how far along its picking is (in the area chosen above).
  function rail(mine, cur) {
    const btn = (key, on, inner) => `<button class="rl ${on ? 'on' : ''}" data-open="${key}">${inner}</button>`;
    return `<nav class="rail" aria-label="Loads">${mine.map(l => {
      const lines = (P.lists.get(l.id) || []).filter(inArea), got = lines.filter(x => x.picked_qty != null).length;
      const st = lines.length && got === lines.length ? 'ok' : got ? 'part' : '';
      return btn(l.id, cur && cur.id === l.id, `<span class="dot ${st}"></span><span class="rb"><span class="lnbr">${esc(l.load_nbr)}</span>${loadKindTags(l)}<span class="sub">${esc(l.ship_via || '')} · ${got}/${lines.length}</span></span>`);
    }).join('')}</nav>`;
  }

  // One load's lines in one area, under a header that carries that area's Done / Staged buttons.
  function groupHTML(g) {
    const { a, l, lines } = g;
    const locked = l.check_status === 'confirming';
    const dn = areaDone(l.id, a), stg = areaStaged(l.id, a);
    const ids = `data-load="${l.id}" data-area-no="${a}"`;
    const btns = dn
      ? (stg ? `<button class="btn small" data-unstage ${ids} ${locked ? 'disabled' : ''}>Unstage</button>`
             : `<button class="btn primary small" data-stage ${ids} ${locked ? 'disabled' : ''}>Mark staged</button>`)
        + `<button class="btn small" data-reopen ${ids} ${locked ? 'disabled' : ''}>Reopen</button>`
      : `<button class="btn primary small" data-areadone ${ids} ${locked || lines.some(x => x.picked_qty == null) ? 'disabled' : ''}>${areaName(a)} done</button>`;
    return `<section class="grp" data-item="g:${l.id}:${a}">
      <div class="ghead"><div class="gl"><b>${areaName(a)}</b><span class="lnbr">${esc(l.load_nbr)}</span>${shipsTag(l)}${loadKindTags(l)}${waveTag(l.wave)}${loadOriginTags(l)}<span class="target">${esc(l.ship_via || '')}</span>${l.check_status ? '<span class="pill info">Being checked</span>' : ''}${dn ? '<span class="pill ok">picked</span>' : ''}${stg ? '<span class="pill ok">staged</span>' : ''}</div><div class="gr">${btns}</div></div>
      ${lines.slice().sort(itemSorter()).map(x => itemRow(l, x, locked)).join('')}
    </section>`;
  }

  function itemRow(l, x, locked) {
    const got = x.picked_qty != null, short = got && Number(x.picked_qty) < Number(x.required);
    const doneArea = !!areaDone(l.id, x.area);
    const dis = locked || doneArea ? 'disabled' : '';
    return `<div class="item ${got ? (short ? 'short' : 'ok') : ''}" data-item="${l.id}|${esc(x.inventory_id)}" data-load="${l.id}" data-inv="${esc(x.inventory_id)}">
      <div class="ic"><div class="desc">${esc(x.description || x.inventory_id)}</div>
        <div class="meta">${esc(x.inventory_id)} · ${esc(x.uom || '')}${x.shipments > 1 ? ` · ${x.shipments} shipments` : ''}</div></div>
      <div class="need">${fmt(x.required)}<small>to pick</small></div>
      <div class="acts">
        <button class="btn ${got && !short ? 'primary' : ''}" data-all ${dis}>All ${fmt(x.required)}</button>
        <button class="btn ${got && Number(x.picked_qty) === 0 ? 'primary' : ''}" data-zero ${dis} aria-label="None picked, 0">0</button>
        <input type="number" inputmode="numeric" enterkeyhint="done" autocomplete="off" min="0" max="${Number(x.required)}" step="1" data-qty value="${got ? Number(x.picked_qty) : ''}" placeholder="Qty" aria-label="Picked quantity for ${esc(x.inventory_id)}" ${dis}>
        <button class="btn small" data-save ${dis}>Save</button>
        ${got ? `<button class="btn small link" data-clear ${dis}>Clear</button>` : ''}
        <span class="st" data-st>${AS.html(l.id, x.inventory_id)}</span>
        <span class="got">${got ? `${short ? `<b style="color:var(--warn-text)">Short ${fmt(Number(x.required) - Number(x.picked_qty))}</b> · ` : ''}${esc(x.picker_name || '')} ${esc(stamp(x.picked_at))}` : ''}</span>
      </div>
    </div>`;
  }

  // ------------------------------------------------------------------
  // ---- Autosave -------------------------------------------------------
  // dispatch_pick_set sets the picked quantity to an absolute value, so repeating a save (autosave, then the
  // Save button, or a retry) can never double-count. Unsaved quantities are kept in localStorage until the
  // server confirms them, so a reload or dropped wifi doesn't lose input.
  const AS = (() => {
    const KEY = 'dispatch-pick-pending', m = new Map(), timers = new Map();
    let chain = Promise.resolve(), ver = 0, idleT = null;
    const k = (load, item) => load + '|' + item;
    const q = s => String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
    function persist() {
      try {
        const a = [...m.values()].filter(e => e.state !== 'saved').map(e => ({ load: e.load, item: e.item, n: e.n }));
        if (a.length) localStorage.setItem(KEY, JSON.stringify(a)); else localStorage.removeItem(KEY);
      } catch (x) {}
    }
    function html(load, item) {
      const e = m.get(k(load, item));
      if (!e) return '';
      if (e.state === 'saved') return '<span style="color:var(--ok-text,#1a7f37)">✓ Saved</span>';
      if (e.state === 'failed') return '<button class="btn small" data-retry style="color:var(--warn-text,#b42318)">Not saved – retry</button>';
      return '<span class="muted">' + (e.state === 'saving' ? 'Saving…' : 'Unsaved…') + '</span>';
    }
    function paint(e) {
      const el = document.querySelector('.item[data-item="' + q(e.load + '|' + e.item) + '"] [data-st]');
      if (el) el.innerHTML = html(e.load, e.item);
    }
    function pending() { return [...m.values()].some(e => e.state !== 'saved'); }
    function set(load, item, n) {
      const key = k(load, item), e = m.get(key) || { load, item };
      Object.assign(e, { n, state: 'dirty', v: ++ver });
      m.set(key, e); persist(); paint(e);
      clearTimeout(timers.get(key));
      timers.set(key, setTimeout(() => flush(key), 700));
    }
    function flush(key) {
      clearTimeout(timers.get(key));
      const e = m.get(key);
      if (!e || e.state === 'saved' || e.state === 'saving') return chain;
      const v = e.v;
      e.state = 'saving'; paint(e);
      chain = chain.then(async () => {
        try {
          await rpc('dispatch_pick_set', { p_load_id: e.load, p_inventory_id: e.item, p_picked: e.n });
          const line = (P.lists.get(e.load) || []).find(x => x.inventory_id === e.item);
          if (line) line.picked_qty = e.n;
          if (e.v === v) {
            e.state = 'saved'; paint(e); feedback('ok'); flashSaved();
            setTimeout(() => { if (m.get(key) === e && e.state === 'saved') { m.delete(key); paint(e); } }, 1500);
          } else if (e.state === 'saving') { e.state = 'dirty'; flush(key); }
        } catch (err) {
          console.error('[picking] autosave', err);
          if (e.v === v) e.state = 'failed'; else if (e.state === 'saving') e.state = 'dirty';
          paint(e);
        }
        persist();
        idleRefresh();
      });
      return chain;
    }
    function flushAll() { [...m.keys()].forEach(flush); return chain; }
    function retryFailed() { [...m.entries()].forEach(([key, e]) => { if (e.state === 'failed') { e.state = 'dirty'; flush(key); } }); }
    // After saves settle and nobody is typing, re-read so the row shows picker name/time and the done buttons unlock.
    function idleRefresh() {
      clearTimeout(idleT);
      idleT = setTimeout(async () => {
        if (pending() || P.busy || editing()) return;
        try { await loadPicks(); render(); } catch (x) {}
      }, 1200);
    }
    // Show unsaved quantities on top of whatever the server returned.
    function overlay() {
      [...m.values()].forEach(e => {
        if (e.state === 'saved') return;
        const line = (P.lists.get(e.load) || []).find(x => x.inventory_id === e.item);
        if (line) line.picked_qty = e.n;
      });
    }
    // Quantities left over from a reload / closed tab: re-queue them once the loads are on screen.
    function restore() {
      let a = [];
      try { a = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (x) {}
      a.forEach(o => {
        const line = (P.lists.get(o.load) || []).find(x => x.inventory_id === o.item);
        if (line && !m.has(k(o.load, o.item))) set(o.load, o.item, o.n);
      });
      persist();
    }
    window.addEventListener('beforeunload', e => { if (pending()) { flushAll(); e.preventDefault(); e.returnValue = ''; } });
    document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); });
    window.addEventListener('online', retryFailed);
    setInterval(retryFailed, 8000);
    return { set, flush, flushAll, key: k, html, pending, overlay, restore, retryFailed };
  })();

  async function rpc(name, args) { const { error } = await sb.rpc(name, args); if (error) throw error; }
  // A pick save only changes pick data, so re-read just that (one request) instead of the whole page.
  async function act(fn, full) {
    if (P.busy) return;
    P.busy = true;
    const again = async () => { if (full) await refresh(); else { try { await loadPicks(); render(); } catch (e) { await refresh(); } } };
    try { await fn(); feedback('ok'); flashSaved(); await again(); }
    catch (e) { console.error('[picking]', e); feedback('bad'); toast(errMsg(e), true, { action: { label: 'Retry', fn: () => act(fn, full) } }); await again(); }
    finally { P.busy = false; }
  }

  document.getElementById('app').addEventListener('click', e => {
    const t = e.target;
    const nx = t.closest('[data-next]');
    if (nx) {
      const id = nx.dataset.next;
      if (id === 'clear-q') { P.q = ''; render(); }
      else if (id === 'all-areas') { P.area = 'all'; try { localStorage.setItem('dispatch-pick-area', 'all'); } catch (x) {} render(); }
      else { P.date = jmDate(id === 'yesterday' ? -1 : 0); P.sel = null; refresh(); }
      return;
    }
    const day = t.closest('#daySeg button');
    if (day) { P.date = jmDate(Number(day.dataset.day)); P.sel = null; refresh(); return; }
    const ar = t.closest('[data-area]');
    if (ar) { P.area = ar.dataset.area; try { localStorage.setItem('dispatch-pick-area', P.area); } catch (x) {} render(); return; }
    const op = t.closest('[data-open]');
    if (t.closest('#sortBtn')) { toggleSort(); render(); return; }
    if (op) { P.sel = Number(op.dataset.open); render(); const pm = document.querySelector('.pkmain'); if (pm) pm.scrollIntoView({ block: 'start' }); return; }
    const ab = t.closest('[data-areadone],[data-stage],[data-unstage],[data-reopen]');
    if (ab) {
      const lid = Number(ab.dataset.load), ar2 = Number(ab.dataset.areaNo);
      if ('areadone' in ab.dataset) act(() => rpc('dispatch_pick_area_done', { p_load_id: lid, p_area: ar2, p_done: true }));
      else if ('reopen' in ab.dataset) act(() => rpc('dispatch_pick_area_done', { p_load_id: lid, p_area: ar2, p_done: false }));
      else act(() => rpc('dispatch_stage_area', { p_load_id: lid, p_area: ar2, p_staged: 'stage' in ab.dataset }));
      return;
    }
    const row = t.closest('.item[data-item]');
    if (!row) return;
    const item = row.dataset.inv, loadId0 = Number(row.dataset.load);
    if (t.closest('[data-retry]')) { AS.retryFailed(); return; }
    const line = (P.lists.get(loadId0) || []).find(x => x.inventory_id === item);
    if (t.closest('[data-all]')) { setPick(loadId0, item, Number(line.required)); return; }
    if (t.closest('[data-zero]')) { setPick(loadId0, item, 0); return; }
    if (t.closest('[data-clear]')) {
      const was = line.picked_qty, loadId = loadId0;
      setPick(loadId, item, null);
      if (was != null) toast('Pick cleared', false, { action: { label: 'Undo', fn: () => setPick(loadId, item, Number(was)) } });
      return;
    }
    if (t.closest('[data-save]')) { saveQty(row, line); }
  });
  document.getElementById('app').addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !e.target.dataset || e.target.dataset.qty === undefined) return;
    const row = e.target.closest('.item[data-item]');
    saveQty(row, (P.lists.get(Number(row.dataset.load)) || []).find(x => x.inventory_id === row.dataset.inv));
  });
  // The box can't go above what the load needs: anything higher snaps back.
  document.getElementById('app').addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'q') { P.q = t.value; keepSearchFocus(render); return; }
    if (!t.dataset || t.dataset.qty === undefined) return;
    const max = Number(t.max);
    if (t.value !== '' && Number(t.value) > max) {
      t.value = max;
      toast(`Only ${fmt(max)} needed. You can't pick more than that.`, true);
    }
    const row = t.closest('.item[data-item]');
    // An emptied box clears the pick (null), same as the Clear button.
    if (row && t.value.trim() === '') AS.set(Number(row.dataset.load), row.dataset.inv, null);
    else if (row && Number(t.value) >= 0) AS.set(Number(row.dataset.load), row.dataset.inv, Math.round(Number(t.value)));
  });
  document.getElementById('app').addEventListener('focusout', e => {
    const row = e.target.closest && e.target.closest('.item[data-item]');
    if (row && e.target.dataset && e.target.dataset.qty !== undefined) AS.flush(AS.key(Number(row.dataset.load), row.dataset.inv));
  });
  document.getElementById('app').addEventListener('change', e => {
    if (e.target.id === 'datePick' && e.target.value) { P.date = e.target.value; P.sel = null; refresh(); }
  });
  function saveQty(row, line) {
    const v = row.querySelector('[data-qty]').value.trim();
    if (v === '') { toast('Enter the quantity picked, or tap All', true); return; }
    const n = Math.round(Number(v));
    if (!(n >= 0)) { toast('That isn\'t a quantity', true); return; }
    if (n > Number(line.required)) { toast(`Only ${fmt(line.required)} needed. You can't pick more than that.`, true); return; }
    // Same absolute-value write the autosave makes, so pressing Save after autosave doesn't double-count.
    setPick(Number(row.dataset.load), line.inventory_id, n);
  }
  // All / 0 / Clear / Save: show the new quantity at once and save it through the same queue as typing.
  // Nothing blocks the next tap, and only the row that changed is redrawn (so the keyboard and scroll
  // position stay put if the picker has already moved on to another box).
  function setPick(loadId, item, n) {
    const line = (P.lists.get(loadId) || []).find(x => x.inventory_id === item);
    if (line) line.picked_qty = n;
    AS.set(loadId, item, n);
    AS.flush(AS.key(loadId, item));
    render();
  }

  async function refresh() {
    try { await loadAll(); AS.restore(); keepSearchFocus(render); }
    catch (e) { console.error('[picking]', e); document.getElementById('main').innerHTML = errBox(e); }
  }
  function editing() {
    const a = document.activeElement;
    return a && a.id !== 'q' && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  }

  startPage({
    page: 'picker', role: 'picker', title: 'Picking',
    onEnvChange: () => { P.sel = null; refresh(); },
    onReady: () => {
      refresh();
      keepFresh(refresh, () => P.busy || editing() || AS.pending(), ['pick_lines', 'pick_area_status', 'stage_area_status', 'loads']);
    },
  });
</script>
</body>
</html>
